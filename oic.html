// ── Cloudinary Photo Upload ───────────────────────────────────
const CLOUDINARY_CLOUD = 'db94rgiil';
const CLOUDINARY_PRESET = 'culex_uploads';

async function uploadPhotoToFirebase(dataUrl, taskId, staffName, day) {
  try {
    if (!dataUrl) return null;
    const compressed = await compressToSize(dataUrl, 60);
    // Try Cloudinary first
    try {
      const res = await fetch(compressed);
      const blob = await res.blob();
      const folder = 'culex/' + ROLE + '/' + (staffName||'unknown').replace(/[^a-zA-Z0-9]/g,'_');
      const fd = new FormData();
      fd.append('file', blob);
      fd.append('upload_preset', CLOUDINARY_PRESET);
      fd.append('folder', folder);
      const resp = await fetch('https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD + '/image/upload', {
        method: 'POST', body: fd
      });
      const data = await resp.json();
      if (data.secure_url) {
        console.log('Photo uploaded to Cloudinary ✓');
        return data.secure_url;
      }
    } catch(cloudErr) {
      console.warn('Cloudinary unavailable, saving locally:', cloudErr);
    }
    // Fallback — save base64 locally, queue for retry
    showToast('Cloud unavailable — photo saved locally 📱', 'warn');
    const pendingKey = 'pending_photos_' + ROLE;
    const pending = JSON.parse(localStorage.getItem(pendingKey) || '[]');
    const photoEntry = {
      dataUrl: compressed,
      taskId, staffName, day,
      savedAt: new Date().toISOString()
    };
    pending.push(photoEntry);
    localStorage.setItem(pendingKey, JSON.stringify(pending));
    // Return compressed base64 as fallback so photo shows immediately
    return compressed;
  } catch(e) {
    console.warn('Photo save failed completely:', e);
    return null;
  }
}

// Retry pending photos when back online
async function retryPendingPhotos() {
  const pendingKey = 'pending_photos_' + ROLE;
  const pending = JSON.parse(localStorage.getItem(pendingKey) || '[]');
  if (!pending.length) return;
  showToast('Retrying ' + pending.length + ' pending photo(s)...', 'ok');
  const remaining = [];
  for (const p of pending) {
    try {
      const res = await fetch(p.dataUrl);
      const blob = await res.blob();
      const folder = 'culex/' + ROLE + '/' + (p.staffName||'unknown').replace(/[^a-zA-Z0-9]/g,'_');
      const fd = new FormData();
      fd.append('file', blob);
      fd.append('upload_preset', CLOUDINARY_PRESET);
      fd.append('folder', folder);
      const resp = await fetch('https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD + '/image/upload', {
        method: 'POST', body: fd
      });
      const data = await resp.json();
      if (data.secure_url) {
        console.log('Pending photo uploaded ✓');
      } else {
        remaining.push(p);
      }
    } catch(e) {
      remaining.push(p);
    }
  }
  localStorage.setItem(pendingKey, JSON.stringify(remaining));
  if (remaining.length === 0) showToast('All pending photos uploaded ✓', 'ok');
  else showToast(remaining.length + ' photo(s) still pending', 'warn');
}

// Auto-retry when online
window.addEventListener('online', retryPendingPhotos);

// Compress image to target size in KB
function compressToSize(dataUrl, maxKB) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      // Scale down if too large
      const maxDim = 600;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = Math.round(h * maxDim/w); w = maxDim; }
        else { w = Math.round(w * maxDim/h); h = maxDim; }
      }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      // Try quality 0.7 first
      let result = canvas.toDataURL('image/jpeg', 0.5);
      if (result.length > maxKB * 1024 * 1.37) {
        result = canvas.toDataURL('image/jpeg', 0.25);
      }
      resolve(result);
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

// SHARED DATABASE — all checklists write to same localStorage key
// so master dashboard can read all submissions
// ══════════════════════════════════════════════════════════════
const SHARED_DB_KEY = 'OIC_SHARED_DB_V2';

function loadSharedDB() {
  try { return JSON.parse(localStorage.getItem(SHARED_DB_KEY)) || { submissions: [] }; }
  catch(e) { return { submissions: [] }; }
}
function saveSharedDB(db) {
  try { localStorage.setItem(SHARED_DB_KEY, JSON.stringify(db)); } catch(e) {}
}

function pushToMasterDashboard(record) {
  // record: { staffName, role, outlet, week, day, overallPct, qualified, submittedAt, verifiedBy }
  const db = loadSharedDB();
  // Find existing entry for this staff + week and update, or add new
  const idx = db.submissions.findIndex(
    s => s.staffName === record.staffName &&
         s.role === record.role &&
         s.week === record.week &&
         s.outlet === record.outlet
  );
  if (idx >= 0) {
    db.submissions[idx] = { ...db.submissions[idx], ...record };
  } else {
    db.submissions.push(record);
  }
  saveSharedDB(db);
}

// ── Cross-device Camera & Gallery ────────────────────────────
function prepareCamera() {
  const input = document.getElementById('camInput');
  if (!input) return;
  input.setAttribute('capture', 'environment');
  input.setAttribute('accept', 'image/*');
  input.value = '';
}
function prepareGallery() {
  const input = document.getElementById('galInput');
  if (!input) return;
  input.removeAttribute('capture');
  input.setAttribute('accept', 'image/*');
  input.value = '';
}
function triggerCamera() { prepareCamera(); document.getElementById('camInput')?.click(); }
function triggerGallery() { prepareGallery(); document.getElementById('galInput')?.click(); }

function iosPhotoFix(inputEl, onDataUrl) {
  inputEl.setAttribute('accept', 'image/*');
}

function compressAndReturn(file, callback) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const MAX = 400;
      let w = img.width, h = img.height;
      if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
      if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.5));
    };
    img.onerror = function() { callback(ev.target.result); };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ── Day unlock logic — only unlock next day, not future days ─────────────────
function getTodayDayNumber(weekStartStr) {
  if (!weekStartStr) return 1;
  try {
    // Use local calendar date (midnight-based, not 24hr rolling)
    const now = new Date();
    const todayStr = now.getFullYear() + '-' + 
      String(now.getMonth()+1).padStart(2,'0') + '-' + 
      String(now.getDate()).padStart(2,'0');
    const today = new Date(todayStr + 'T00:00:00');
    const start = new Date(weekStartStr + 'T00:00:00');
    const diff = Math.floor((today - start) / (1000 * 60 * 60 * 24));
    return Math.min(Math.max(diff + 1, 1), 6);
  } catch(e) { return 1; }
}

function isDayUnlocked(dayNum, weekStartStr) {
  return true; // All days visible — correct day auto-selected
}

function getTodayDay(weekStartStr) {
  if (!weekStartStr) return 1;
  const start = new Date(weekStartStr + 'T00:00:00');
  const today = new Date();
  today.setHours(0,0,0,0);
  const diff = Math.floor((today - start) / 86400000);
  return Math.min(Math.max(diff + 1, 1), 6);
}

function showToast(msg, type) {
  let t = document.getElementById('_toast');
  if (!t) {
    t = document.createElement('div');
    t.id = '_toast';
    t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);padding:10px 18px;border-radius:30px;font-size:13px;font-weight:600;opacity:0;transition:all 0.3s;z-index:9999;white-space:nowrap;pointer-events:none;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.background = type === 'error' ? '#EF4444' : type === 'warn' ? '#F59E0B' : '#0F172A';
  t.style.color = '#fff';
  t.style.opacity = '1';
  t.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => {
    t.style.opacity = '0';
    t.style.transform = 'translateX(-50%) translateY(20px)';
  }, 2800);
}



// ── Auto-fill audit score for OIC's outlet ───────────────────────────────────
function getLatestAuditForOutlet(outlet) {
  if (!outlet) return null;
  try {
    const db = JSON.parse(localStorage.getItem('OIC_SHARED_DB_V2') || '{}');
    const audits = db.audits || [];
    const outletAudits = audits.filter(a =>
      a.outlet && a.outlet.trim().toLowerCase() === outlet.trim().toLowerCase()
    );
    if (outletAudits.length === 0) return null;
    // Get most recent
    return outletAudits.sort((a,b) => new Date(b.submittedAt) - new Date(a.submittedAt))[0];
  } catch(e) { return null; }
}

function getMonday(date) {
  const d = new Date(date);
  const day = d.getDay();
  // Sunday (0) = day 7 of current week, go back 6 days to Monday
  // Monday (1) = day 1, no change
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  d.setDate(diff);
  d.setHours(0,0,0,0);
  return d;
}

function purgeOldData() {
  try {
    const today = getDubaiDateStr();
    const d = load();
    let cleaned = false;
    Object.keys(d).forEach(key => {
      // Only remove old date-based keys older than 7 days — keep d1-d6 for compatibility
      if (/^dt\d{4}-\d{2}-\d{2}$/.test(key) && key !== 'dt' + today) {
        const diff = (new Date(today) - new Date(key.replace('dt',''))) / (1000*60*60*24);
        if (diff > 7) { delete d[key]; cleaned = true; }
      }
    });
    if (cleaned) save(d);
  } catch(e) {}
}

    const d = load();

    owp.className = 'overwrite-panel';

      <input class="overwrite-input" id="owCode" type="password" placeholder="Enter overwrite code...">
      <button class="overwrite-btn" onclick="doOverwrite()">Unlock to Edit Day ${currentDay}</button>`;
    container.appendChild(owp);
    const msg2 = document.createElement('div');
    msg2.className = 'synced-msg';
    msg2.textContent = '✓ Submitted and synced to dashboard';
    container.appendChild(msg2);
  } else {
    btn.textContent = '📋 Submit Checklist';
    btn.onclick = submitDay;
    container.appendChild(btn);
  }
}

// ── Tap YES/NO/NA ─────────────────────────────────────────────
function setComment(taskId, value) {
  setVal(currentDay, taskId, 'comment', value);
}

function tapYN(tid, val, el) {
  const data = load();
  const todayData = data[getTodayKey()] || {};
  // kic2/oic has no shifts — only lock after full submit (_done)
  if (todayData._done && !ALLOW_OVERWRITE) {
    showToast('Already submitted — cannot edit 🔒', 'error'); return;
  }
  // Lock 'verify' tasks only AFTER submission — Area Manager verifies via dashboard overwrite
  const taskDef = SECTIONS.flatMap(s=>s.tasks).find(t=>t.id===tid);
  if (taskDef && taskDef.owner === 'verify' && todayData._done && !ALLOW_OVERWRITE) {
    showToast('Already submitted — manager verifies this via dashboard 🔒', 'error'); return;
  }
  setVal(currentDay, tid, 'yn', val);
  el.closest('.yn-row').querySelectorAll('.yn').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  // Update score bar and single total box live
  let t=0, y=0;
  const _td = load()[getTodayKey()] || {};
  SECTIONS.forEach(s => {
    if (s.oicOnly) return;
    s.tasks.forEach(tk => {
      if (tk.owner === 'verify') return;
      const v = _td[tk.id]?.yn;
      if (v && v !== 'na') { t++; if(v==='yes') y++; }
    });
  });
  const p = t>0 ? Math.round((y/t)*100) : 0;
  document.getElementById('scoreFill').style.width=p+'%';
  document.getElementById('scoreFill').style.background=p>=95?'#22C55E':p>=70?'#F59E0B':'#3B82F6';
  document.getElementById('scorePct').textContent=p+'%';
  // Update single total score box
  const scCard = document.querySelector('.status-card');
  if (scCard && t > 0) {
    const dayPass = p >= 95;
    scCard.className = `status-card ${dayPass?'pass':'fail'}`;
    scCard.innerHTML = `
      <div style="background:${dayPass?'#F0FDF4':'#FFF1F0'};border:2px solid ${dayPass?'#22C55E':'#EF4444'};border-radius:12px;padding:14px;text-align:center;">
        <div style="font-size:10px;font-weight:700;color:#64748B;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;">🏆 Total Score</div>
        <div style="font-size:36px;font-weight:700;color:${dayPass?'#0F766E':'#B91C1C'}">${p}%</div>
        <div style="font-size:11px;color:${dayPass?'#0F766E':'#B91C1C'};margin-top:4px;font-weight:600;">${dayPass?'✓ Qualified for incentive':'✗ Below target (95%)'}</div>
      </div>`;
  }
}


function fmtDateTime(iso) {
  if (!iso) return '—';
  try {
    const d = new Date(iso);
    const date = d.toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'});
    const time = d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:true});
    return date + ' ' + time;
  } catch(e) { return iso; }
}
function fmtTimeOnly(iso) {
  if (!iso) return '—';
  try {
    return new Date(iso).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:true});
  } catch(e) { return '—'; }
}

// ── Submit day ────────────────────────────────────────────────
function submitDay() {
  const name = getStaffName();
  if (!name) { showToast('Please enter your name first', 'warn'); document.getElementById('fName').focus(); return; }
  // getWeekStart always returns Dubai date as fallback
  const d = load();
  if (!d[getTodayKey()]) d[getTodayKey()] = {};
  d[getTodayKey()]._start = new Date().toISOString();
  d[getTodayKey()]._done = getDubaiDateStr();
  save(d);

  // Calc overall
  // Calculate score from today's data directly
  let tY=0, tM=0;
  const _todaySubmitData = load()[getTodayKey()] || {};
  SECTIONS.forEach(s => s.tasks.forEach(t => {
    if (s.oicOnly) return; // skip OIC eval tasks from self-score
    const v = _todaySubmitData[t.id]?.yn;
    if (v && v !== 'na') { tM++; if(v==='yes') tY++; }
  }));
  const op = tM>0 ? Math.round((tY/tM)*100) : 0;

  // Push to master dashboard
  const _fbRecord = {
    staffName:  name,
    role:       ROLE,
    roleLabel:  ROLE_LABEL,
    outlet:     getOutlet(),
    week:       getWeekStart(),
    verifiedBy: getVerified(),
    overallPct: op,
    qualified:  op>=95,
    day:        currentDay,
    startedAt:  d[getTodayKey()]?._start || new Date().toISOString(),
    submittedAt:new Date().toISOString(),
    lastUpdated:new Date().toISOString(),
    taskData: (function() {
      const tasks = {};
      for (let dd=1; dd<=6; dd++) {
        SECTIONS.forEach(s => s.tasks.forEach(t => {
          const yn    = getVal(dd, t.id, 'yn');
          const pUrl  = getVal(dd, t.id, 'photoUrl');
          const photo = getVal(dd, t.id, 'photo');
          if (yn || photo || pUrl) {
            tasks[`d${dd}_${t.id}`] = {
              day: dd,
              section: s.title,
              task: t.text,
              owner: t.ownerLbl,
              yn: yn||'',
              photoUrl: (pUrl && pUrl.startsWith('http')) ? pUrl : '',
            };
          }
        }));
      }
      return tasks;
    })(),
  };
  pushToMasterDashboard(_fbRecord);
  pushToFirebase(_fbRecord);

  showToast(`Day ${currentDay} submitted ✓`, 'ok');
  buildDayRail();
  renderDay();
}

// ── Overwrite (Area Manager/Admin) ────────────────────────────
function doOverwrite() {
  const code = document.getElementById('owCode')?.value;
  if (!checkOverwritePin(code||'')) { showToast('Wrong PIN — access denied 🔒', 'error'); return; }
  const d = load();
  if (d[getTodayKey()]) delete d[getTodayKey()]._done;
  save(d);
  showToast('Day ${currentDay} unlocked — you can now edit', 'ok');
  buildDayRail();
  renderDay();
}

// ── Photo ─────────────────────────────────────────────────────
function openPhotoModal(tid, label) {
  const data = load();
  if (data[getTodayKey()]?._done && !ALLOW_OVERWRITE) {
    showToast('Day submitted — cannot change photos', 'error'); return;
  }
  activePhotoTask = tid;
  document.getElementById('modalLabel').textContent = label;
  document.getElementById('photoModal').classList.add('open');
}
function closePhotoModal() {
  document.getElementById('photoModal').classList.remove('open');
  activePhotoTask = null;
}

// mbtnCamera is now a <label for="camInput"> — no onclick needed
// prepareCamera() is called via onclick on the label
// mbtnGallery is now a <label for="galInput"> — no onclick needed
// prepareGallery() is called via onclick on the label

function handlePhotoFile(file) {
  if (!file || !activePhotoTask) return;
  const taskId = activePhotoTask;
  activePhotoTask = null;
  compressAndReturn(file, async function(dataUrl) {
    // Save locally first for instant display
    setVal(currentDay, taskId, 'photo', dataUrl);
    renderDay();
    showToast('Photo saved ✓', 'ok');

    // Save compressed photo to Firebase Realtime Database
    const staffName = getStaffName();
    if (staffName && _db) {
      const dbRef = await uploadPhotoToFirebase(dataUrl, taskId, staffName, currentDay);
      if (dbRef) {
        setVal(currentDay, taskId, 'photoUrl', dbRef);
        showToast('Photo synced ✓', 'ok');
      }
    }
  });
}
// ── Persist info fields ───────────────────────────────────────
function removePhoto(taskId, idx) {
  if (!confirm('Remove this photo?')) return;
  const key = idx === 0 ? 'photo' : 'photo_' + idx;
  setVal(currentDay, taskId, key, '');
  setVal(currentDay, taskId, 'photoUrl', '');
  renderDay();
  showToast('Photo removed ✓', 'ok');
}

window.addEventListener('DOMContentLoaded', () => {
  const camIn = document.getElementById('camInput');
  const galIn = document.getElementById('galInput');
  if (camIn) camIn.addEventListener('change', e => handlePhotoFile(e.target.files[0]));
  if (galIn) galIn.addEventListener('change', e => handlePhotoFile(e.target.files[0]));

  // Auto-set Dubai date — locked, no user input
  const _dubaiToday = getDubaiDateStr();
  const _wf = document.getElementById('fWeek');
  if (_wf) { if (_wf.tagName === 'INPUT') _wf.value = _dubaiToday; else _wf.textContent = _dubaiToday; }
  localStorage.setItem('kic_info_' + ROLE + '_fWeek', _dubaiToday);
  ['fName','fOutlet','fWeek','fVerified'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    if (id !== 'fWeek') {
      const saved = localStorage.getItem('kic_info_' + ROLE + '_' + id);
      if (saved) el.value = saved;
    }
    el.addEventListener('input', () => {
      if (id !== 'fWeek') localStorage.setItem('kic_info_' + ROLE + '_' + id, el.value);
      // Update SK when name changes so data saves to correct key
      const nameVal = document.getElementById('fName')?.value?.trim();
      if (nameVal) SK = SK_BASE + '_' + nameVal.replace(/[^a-zA-Z0-9]/g,'_').toLowerCase();
      else SK = SK_BASE;
      buildDayRail(); renderDay();
    });
  });
  // Also set SK from saved name on load
  const _savedName = localStorage.getItem('kic_info_' + ROLE + '_fName');
  if (_savedName) SK = SK_BASE + '_' + _savedName.replace(/[^a-zA-Z0-9]/g,'_').toLowerCase();
  // Critical: clear any stale _done from the shared SK_BASE key
  // This prevents "already submitted" showing for new staff opening the page
  try {
    const _baseData = JSON.parse(localStorage.getItem(SK_BASE)||'{}');
    const _todayKey = 'dt' + getDubaiDateStr();
    if (_baseData[_todayKey]?._done) {
      delete _baseData[_todayKey]._done;
      localStorage.setItem(SK_BASE, JSON.stringify(_baseData));
    }
  } catch(e) {}

  buildDayRail();
  renderDay();
  showAuditBanner();
});

// ── Midnight auto-reset (Dubai UTC+4) ───────────────────────
function scheduleNextMidnight() {
  const now = new Date();
  const dubaiNow = new Date(now.getTime() + (now.getTimezoneOffset()*60000) + (4*3600000));
  const next = new Date(dubaiNow); next.setHours(24,0,0,0);
  setTimeout(function() {
    const nd = getDubaiDateStr();
    const wf = document.getElementById('fWeek');
    if (wf) { if(wf.tagName==='INPUT') wf.value=nd; else wf.textContent=nd; }
    localStorage.setItem('kic_info_' + ROLE + '_fWeek', nd);
    currentShift = null; buildDayRail();
    try { renderDay(); } catch(e) {}
    showToast('📅 New day — ' + nd, 'ok');
    scheduleNextMidnight();
  }, next - dubaiNow);
}
scheduleNextMidnight();

// Warn before page refresh if checklist not submitted
window.addEventListener('beforeunload', function(e) {
  const data = load();
  const todayKey = getTodayKey();
  const isDone = !!data[todayKey]?._done;
  const hasAnswers = data[todayKey] && Object.keys(data[todayKey]).some(k => !k.startsWith('_'));
  if (hasAnswers && !isDone) {
    e.preventDefault();
    e.returnValue = 'You have unsaved progress. Your answers are saved locally but please submit before leaving.';
    return e.returnValue;
  }
});
