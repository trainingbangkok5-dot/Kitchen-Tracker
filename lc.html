// SHARED DATABASE — all checklists write to same localStorage key
// so master dashboard can read all submissions

const SHARED_DB_KEY = 'KIC_SHARED_DB_V2';

function loadSharedDB() {
  try { return JSON.parse(localStorage.getItem(SHARED_DB_KEY)) || { submissions: [] }; }
  catch(e) { return { submissions: [] }; }
}
function saveSharedDB(db) {
  try { localStorage.setItem(SHARED_DB_KEY, JSON.stringify(db)); } catch(e) {}
}

function pushToMasterDashboard(record) {
  // record: { staffName, role, outlet, week, day, overallPct, qualified, submittedAt, verifiedBy }
  const db = loadSharedDB();
  // Find existing entry for this staff + week and update, or add new
  const idx = db.submissions.findIndex(
    s => s.staffName === record.staffName &&
         s.role === record.role &&
         s.week === record.week &&
         s.outlet === record.outlet
  );
  if (idx >= 0) {
    db.submissions[idx] = { ...db.submissions[idx], ...record };
  } else {
    db.submissions.push(record);
  }
  saveSharedDB(db);
}

// ── iOS Safari fix: use blob URL for camera capture ──────────────────────────
function iosPhotoFix(inputEl, onDataUrl) {
  // iOS Safari needs special handling — no capture attribute workaround
  inputEl.removeAttribute('capture');
  inputEl.setAttribute('accept', 'image/*');
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  if (isIOS) {
    // On iOS we add capture back AFTER a small delay so Safari registers it
    setTimeout(() => inputEl.setAttribute('capture', 'environment'), 50);
  }
}

function compressAndReturn(file, callback) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const MAX = 600;
      let w = img.width, h = img.height;
      if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
      if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = function() { callback(ev.target.result); };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ── Day unlock logic — only unlock next day, not future days ─────────────────
function getTodayDayNumber(weekStartStr) {
  if (!weekStartStr) return 1;
  try {
    // Use local calendar date (midnight-based, not 24hr rolling)
    const now = new Date();
    const todayStr = now.getFullYear() + '-' + 
      String(now.getMonth()+1).padStart(2,'0') + '-' + 
      String(now.getDate()).padStart(2,'0');
    const today = new Date(todayStr + 'T00:00:00');
    const start = new Date(weekStartStr + 'T00:00:00');
    const diff = Math.floor((today - start) / (1000 * 60 * 60 * 24));
    return Math.min(Math.max(diff + 1, 1), 6);
  } catch(e) { return 1; }
}

function isDayUnlocked(dayNum, weekStartStr) {
  return dayNum <= getTodayDayNumber(weekStartStr);
}

function showToast(msg, type) {
  let t = document.getElementById('_toast');
  if (!t) {
    t = document.createElement('div');
    t.id = '_toast';
    t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);padding:10px 18px;border-radius:30px;font-size:13px;font-weight:600;opacity:0;transition:all 0.3s;z-index:9999;white-space:nowrap;pointer-events:none;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.background = type === 'error' ? '#EF4444' : type === 'warn' ? '#F59E0B' : '#0F172A';
  t.style.color = '#fff';
  t.style.opacity = '1';
  t.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => {
    t.style.opacity = '0';
    t.style.transform = 'translateX(-50%) translateY(20px)';
  }, 2800);
}



// ── Auto-reset: detect new week and start fresh cycle ────────
function getMonday(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  d.setDate(diff);
  d.setHours(0,0,0,0);
  return d;
}

function getCurrentWeekStart() {
  const monday = getMonday(new Date());
  return monday.toISOString().split('T')[0];
}

function checkAutoReset() {
  const weekField = document.getElementById('fWeek');
  if (!weekField) return;

  const currentWeekStart = getCurrentWeekStart();
  const storedWeek = localStorage.getItem('kic_info_' + ROLE + '_fWeek') || '';

  // Auto-set week to current Monday if not set or if it's a new week
  if (!storedWeek || storedWeek !== currentWeekStart) {
    // New week detected — auto reset
    weekField.value = currentWeekStart;
    localStorage.setItem('kic_info_' + ROLE + '_fWeek', currentWeekStart);
    // Also update the week label display
    try { const el = document.getElementById('fWeek'); if(el) el.value = currentWeekStart; } catch(e) {}

    if (storedWeek && storedWeek !== currentWeekStart) {
      // Clear old week data from localStorage
      const oldData = JSON.parse(localStorage.getItem(SK) || '{}');
      const oldWeekKey = 'week_' + storedWeek;
      
      // Archive old week data before clearing
      const archiveKey = SK + '_archive_' + storedWeek;
      try {
        localStorage.setItem(archiveKey, JSON.stringify(oldData));
      } catch(e) {}
      
      // Start fresh
      localStorage.removeItem(SK);
      showToast('New week started — checklist reset ✓', 'ok');
    }

    buildDayRail();
    renderDay();
  }
}

function load() { try { return JSON.parse(localStorage.getItem(SK))||{}; } catch(e) { return {}; } }
function save(d) { try { localStorage.setItem(SK, JSON.stringify(d)); } catch(e) { showToast('Storage full — clear browser data','error'); } }
function getVal(day,tid,field) { return load()[`d${day}`]?.[tid]?.[field]||null; }
function setVal(day,tid,field,val) {
  const d=load();
  if(!d[`d${day}`]) d[`d${day}`]={};
  if(!d[`d${day}`][tid]) d[`d${day}`][tid]={};
  d[`d${day}`][tid][field]=val;
  save(d);
}

function getWeekStart() { return document.getElementById('fWeek').value; }
function getStaffName() { return document.getElementById('fName').value.trim(); }
function getOutlet() { return document.getElementById('fOutlet').value.trim(); }
function getVerified() { return document.getElementById('fVerified').value.trim(); }

// ── Day rail ──────────────────────────────────────────────────
function buildDayRail() {
  const rail = document.getElementById('dayRail');
  const data = load();
  const weekStart = getWeekStart();
  rail.innerHTML = '';
  for (let i = 1; i <= 6; i++) {
    const done     = data[`d${i}`]?._done;
    const unlocked = isDayUnlocked(i, weekStart);
    const btn = document.createElement('button');
    let cls = 'd-pill day-pill';
    if (i === currentDay) cls += ' active';
    if (done) cls += ' done';
    if (!unlocked) cls += ' locked';
    btn.className = cls;
    btn.textContent = done ? `Day ${i} ✓` : `Day ${i}`;
    btn.onclick = () => {
      if (!unlocked) { showToast(`Day ${i} unlocks on the correct date 📅`, 'warn'); return; }
      currentDay = i; buildDayRail(); renderDay();
    };
    rail.appendChild(btn);
  }
}

// ── Render day ────────────────────────────────────────────────
function renderDay() {
  const container = document.getElementById('mainContent');
  container.innerHTML = '';

  // Track start time for this day
  const dayKey = `d${currentDay}`;
  const dNow = load();
  if (!dNow[dayKey]) { dNow[dayKey] = {}; }
  if (!dNow[dayKey]._start) {
    dNow[dayKey]._start = new Date().toISOString();
    save(dNow);
  }

  const data = load();
  const isDone = !!data[`d${currentDay}`]?._done;
  const weekStart = getWeekStart();
  const unlocked = isDayUnlocked(currentDay, weekStart);
  let total = 0, yes = 0;

  if (!unlocked) {
    const locked = document.createElement('div');
    locked.className = 'locked-msg';
    locked.textContent = `🔒 Day ${currentDay} is not available yet. It will unlock on the correct date.`;
    container.appendChild(locked);
    return;
  }

  SECTIONS.forEach((section, si) => {
    const hdr = document.createElement('div');
    hdr.className = 'section-hdr';
    hdr.textContent = section.title;
    container.appendChild(hdr);

    // Lock opening tasks if opening is submitted
    const openingSubmitted = !!data[`d${currentDay}`]?._openDone;
    // Lock closing tasks only if fully done
    const closingSubmitted = isDone;

    section.tasks.forEach((task, ti) => {
      // Determine lock state per section
      const sectionLocked = (si === 0 && openingSubmitted && !ALLOW_OVERWRITE) || 
                            (si === 1 && closingSubmitted && !ALLOW_OVERWRITE);
      total++;
      const val = getVal(currentDay, task.id, 'yn');
      if (val === 'yes') yes++;
      const photo = getVal(currentDay, task.id, 'photo');

      const card = document.createElement('div');
      card.className = 'task-card' + (sectionLocked ? ' locked-card' : '');
      if (ti === section.tasks.length - 1) card.style.borderRadius = '0 0 10px 10px';

      const ownerCls = {self:'ot-self',verify:'ot-verify',monitor:'ot-monitor',record:'ot-record',auditor:'ot-auditor'}[task.owner]||'ot-self';
      let photoHtml = '';
      if (task.photo) {
        photoHtml = `<div class="photo-row">
          <button class="photo-btn ${photo?'taken':''}" onclick="openPhotoModal('${task.id}','${task.text.substring(0,40).replace(/'/g,"")}')">
            ${photo ? '✓ Photo saved' : '📷 Tap to take photo'}
          </button>
          ${photo ? `<img class="photo-thumb" src="${photo}" alt="proof">` : ''}
        </div>`;
      }
      card.innerHTML = `
        <div class="task-top">
          <span class="owner-tag ${ownerCls}">${task.ownerLbl}</span>
          <span class="task-text">${task.text}</span>
        </div>
        <div class="yn-row">
          <div class="yn yes ${val==='yes'?'on':''}" onclick="tapYN('${task.id}','yes',this)">✓ YES</div>
          <div class="yn no ${val==='no'?'on':''}" onclick="tapYN('${task.id}','no',this)">✗ NO</div>
          <div class="yn na ${val==='na'?'on':''}" onclick="tapYN('${task.id}','na',this)">— N/A</div>
        </div>
        ${photoHtml}`;
      container.appendChild(card);
    });

    // Add "Submit Opening" button after Opening section (si===0)
    if (si === 0) {
      const openDoneFlag = !!data[`d${currentDay}`]?._openDone;
      if (!openDoneFlag) {
        const openBtn = document.createElement('button');
        openBtn.className = 'submit-btn';
        openBtn.style.cssText = 'margin:10px 0;background:#2E6DA4;';
        openBtn.textContent = 'Submit Opening Tasks ✓';
        openBtn.onclick = submitOpening;
        container.appendChild(openBtn);
      } else {
        const openDoneMsg = document.createElement('div');
        openDoneMsg.className = 'synced-msg';
        openDoneMsg.style.cssText = 'margin:8px 0;padding:8px;background:#DCFCE7;border-radius:8px;';
        openDoneMsg.textContent = '✓ Opening Tasks Submitted — ' + new Date(data[`d${currentDay}`]._openDone).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
        container.appendChild(openDoneMsg);
      }
    }
  });

  // Score
  const pct = total > 0 ? Math.round((yes/total)*100) : 0;
  document.getElementById('scoreFill').style.width = pct + '%';
  document.getElementById('scoreFill').style.background = pct>=95?'#22C55E':pct>=70?'#F59E0B':'#3B82F6';
  document.getElementById('scorePct').textContent = pct + '%';

  // Overall
  let tY=0, tM=0;
  for (let d=1;d<=6;d++) {
    SECTIONS.forEach(s=>s.tasks.forEach(t=>{
      const v=getVal(d,t.id,'yn');
      if(v&&v!=='na'){tM++;if(v==='yes')tY++;}
    }));
  }
  const op = tM>0 ? Math.round((tY/tM)*100) : 0;
  const pass = op>=95;

  const sc = document.createElement('div');
  sc.className = `status-card ${tM>0?(pass?'pass':'fail'):''}`;
  sc.innerHTML = `<div class="sc-icon">${tM===0?'📋':pass?'✅':'❌'}</div>
    <div class="sc-title">${tM===0?'Fill your checklist':pass?'Incentive Qualified!':'Keep going!'}</div>
    <div class="sc-score" style="color:${tM===0?'#94A3B8':pass?'#15803D':'#B91C1C'}">${tM>0?op+'%':'—'}</div>
    <div class="sc-sub">6-day overall score (target: 95%)</div>`;
  container.appendChild(sc);

  // Submit buttons — Opening and Closing separately
  const openDone = !!data[`d${currentDay}`]?._openDone;
  const btn = document.createElement('button');
  btn.className = 'submit-btn';
  if (isDone && !ALLOW_OVERWRITE) {
    btn.disabled = true;
    btn.textContent = `✓ Day ${currentDay} Fully Submitted — Locked`;
    const msg = document.createElement('div');
    msg.className = 'synced-msg';
    msg.textContent = '✓ Submitted and synced to dashboard';
    container.appendChild(btn);
    container.appendChild(msg);
  } else if (isDone && ALLOW_OVERWRITE) {
    btn.disabled = true;
    btn.textContent = `✓ Day ${currentDay} Submitted`;
    container.appendChild(btn);
    // Overwrite panel
    const owp = document.createElement('div');
    owp.className = 'overwrite-panel';
    owp.innerHTML = `<div class="overwrite-title">🔓 Overwrite Access (KIC/Area Chef only)</div>
      <input class="overwrite-input" id="owCode" type="password" placeholder="Enter overwrite code...">
      <button class="overwrite-btn" onclick="doOverwrite()">Unlock to Edit Day ${currentDay}</button>`;
    container.appendChild(owp);
    const msg2 = document.createElement('div');
    msg2.className = 'synced-msg';
    msg2.textContent = '✓ Submitted and synced to dashboard';
    container.appendChild(msg2);
  } else {
    btn.textContent = `Submit Day ${currentDay}`;
    btn.onclick = submitDay;
    container.appendChild(btn);
  }
}

// ── Tap YES/NO/NA ─────────────────────────────────────────────
function tapYN(tid, val, el) {
  const data = load();
  if (data[`d${currentDay}`]?._done && !ALLOW_OVERWRITE) {
    showToast('Day already submitted — cannot edit', 'error'); return;
  }
  setVal(currentDay, tid, 'yn', val);
  el.closest('.yn-row').querySelectorAll('.yn').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  // update score bar
  let t=0, y=0;
  SECTIONS.forEach(s=>s.tasks.forEach(tk=>{t++;if(getVal(currentDay,tk.id,'yn')==='yes')y++;}));
  const p=t>0?Math.round((y/t)*100):0;
  document.getElementById('scoreFill').style.width=p+'%';
  document.getElementById('scorePct').textContent=p+'%';
}


function fmtDateTime(iso) {
  if (!iso) return '—';
  try {
    const d = new Date(iso);
    const date = d.toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'});
    const time = d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:true});
    return date + ' ' + time;
  } catch(e) { return iso; }
}
function fmtTimeOnly(iso) {
  if (!iso) return '—';
  try {
    return new Date(iso).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:true});
  } catch(e) { return '—'; }
}

// ── Submit day ────────────────────────────────────────────────
function submitOpening() {
  const name = getStaffName();
  if (!name) { showToast('Please enter your name first', 'warn'); document.getElementById('fName').focus(); return; }
  if (!getWeekStart()) { showToast('Please set the week starting date', 'warn'); return; }
  // Check all opening tasks answered
  const openingTasks = SECTIONS[0].tasks;
  const unanswered = openingTasks.filter(t => !getVal(currentDay, t.id, 'yn'));
  if (unanswered.length > 0) { showToast('Please answer all Opening Tasks first', 'warn'); return; }
  const d = load();
  if (!d[`d${currentDay}`]) d[`d${currentDay}`] = {};
  d[`d${currentDay}`]._openDone = new Date().toISOString();
  save(d);
  showToast('Opening tasks submitted ✓', 'ok');
  buildDayRail(); renderDay();
}

function submitDay() {
  const name = getStaffName();
  if (!name) { showToast('Please enter your name first', 'warn'); document.getElementById('fName').focus(); return; }
  if (!getWeekStart()) { showToast('Please set the week starting date', 'warn'); return; }
  // Check all closing tasks answered
  const closingTasks = SECTIONS[1].tasks;
  const unanswered = closingTasks.filter(t => !getVal(currentDay, t.id, 'yn'));
  if (unanswered.length > 0) { showToast('Please answer all Closing Tasks first', 'warn'); return; }
  const d = load();
  if (!d[`d${currentDay}`]) d[`d${currentDay}`] = {};
  d[`d${currentDay}`]._done = new Date().toISOString();
  save(d);

  // Calc overall
  let tY=0, tM=0;
  for (let dd=1;dd<=6;dd++) {
    SECTIONS.forEach(s=>s.tasks.forEach(t=>{
      const v=getVal(dd,t.id,'yn');
      if(v&&v!=='na'){tM++;if(v==='yes')tY++;}
    }));
  }
  const op = tM>0?Math.round((tY/tM)*100):0;

  // Push to master dashboard
  const _fbRecord = {
    staffName:  name,
    role:       ROLE,
    roleLabel:  ROLE_LABEL,
    outlet:     getOutlet(),
    week:       getWeekStart(),
    verifiedBy: '',
    overallPct: op,
    qualified:  op>=95,
    day:        currentDay,
    startedAt:  d[`d${currentDay}`]?._start || new Date().toISOString(),
    photos: (function() {
      const photos = {};
      SECTIONS.forEach(s => s.tasks.forEach(t => {
        const url = getVal(currentDay, t.id, 'photoUrl');
        if (url) photos[t.id + '_day' + currentDay] = url;
      }));
      return photos;
    })(),
    // Store full task responses for dashboard detail view
    taskData: (function() {
      const tasks = {};
      for (let dd=1; dd<=6; dd++) {
        SECTIONS.forEach(s => s.tasks.forEach(t => {
          const yn    = getVal(dd, t.id, 'yn');
          const photo = getVal(dd, t.id, 'photo'); // base64 local photo
          const pUrl  = getVal(dd, t.id, 'photoUrl'); // firebase url
          if (yn || photo || pUrl) {
            tasks[`d${dd}_${t.id}`] = {
              day: dd,
              section: s.title,
              task: t.text,
              owner: t.ownerLbl,
              yn: yn||'',
              photoUrl: pUrl || photo || '', // prefer firebase url, fall back to base64
            };
          }
        }));
      }
      return tasks;
    })(),
    submittedAt:new Date().toISOString(),
    lastUpdated:new Date().toISOString(),
  };
  pushToMasterDashboard(_fbRecord);
  pushToFirebase(_fbRecord);

  showToast(`Day ${currentDay} submitted ✓`, 'ok');
  buildDayRail();
  renderDay();
}

// ── Overwrite (KIC/Area Chef) ─────────────────────────────────
function doOverwrite() {
  const code = document.getElementById('owCode')?.value;
  if (code !== OVERWRITE_CODE) { showToast('Wrong overwrite code', 'error'); return; }
  const d = load();
  if (d[`d${currentDay}`]) delete d[`d${currentDay}`]._done;
  save(d);
  showToast('Day ${currentDay} unlocked — you can now edit', 'ok');
  buildDayRail();
  renderDay();
}

// ── Photo ─────────────────────────────────────────────────────
function openPhotoModal(tid, label) {
  const data = load();
  if (data[`d${currentDay}`]?._done && !ALLOW_OVERWRITE) {
    showToast('Day submitted — cannot change photos', 'error'); return;
  }
  activePhotoTask = tid;
  document.getElementById('modalLabel').textContent = label;
  document.getElementById('photoModal').classList.add('open');
}
function closePhotoModal() {
  document.getElementById('photoModal').classList.remove('open');
  activePhotoTask = null;
}

document.getElementById('mbtnCamera').onclick = function() {
  closePhotoModal();
  const inp = document.getElementById('camInput');
  inp.value = '';
  // iOS fix: remove then re-add capture attribute
  inp.removeAttribute('capture');
  setTimeout(() => { inp.setAttribute('capture','environment'); inp.click(); }, 80);
};
document.getElementById('mbtnGallery').onclick = function() {
  closePhotoModal();
  const inp = document.getElementById('galInput');
  inp.value = '';
  inp.click();
};

function handlePhotoFile(file) {
  if (!file || !activePhotoTask) return;
  compressAndReturn(file, async function(dataUrl) {
    // Save locally first for instant display
    setVal(currentDay, activePhotoTask, 'photo', dataUrl);
    const taskId = activePhotoTask;
    activePhotoTask = null;
    renderDay();
    showToast('Photo saved ✓', 'ok');
    
    // Upload to Firebase Storage for cross-device viewing
    const staffName = getStaffName();
    if (staffName) {
      const url = await uploadPhotoToFirebase(dataUrl, taskId, staffName, currentDay);
      if (url) {
        setVal(currentDay, taskId, 'photoUrl', url);
        // Update Firebase submission with photo URL
        const d = load();
        if (d[`d${currentDay}`]?._done) {
          // Submission already sent - update photo
          const key = staffName.replace(/[^a-zA-Z0-9]/g,'_') + '_linecook_' + (getWeekStart()||'').replace(/[^a-zA-Z0-9]/g,'_');
          _db.ref(`submissions/${key}/photos/${taskId}_day${currentDay}`).set(url);
        }
      }
    }
  });
}
document.getElementById('camInput').addEventListener('change', e => handlePhotoFile(e.target.files[0]));
document.getElementById('galInput').addEventListener('change', e => handlePhotoFile(e.target.files[0]));

// ── Persist info fields ───────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  // Auto-set to current Monday
  // Auto-set week to current Monday
  if (typeof getMonday === 'function') {
    const monday = getMonday(new Date());
    // Format as YYYY-MM-DD for date input
    const y = monday.getFullYear();
    const m = String(monday.getMonth()+1).padStart(2,'0');
    const d = String(monday.getDate()).padStart(2,'0');
    document.getElementById('fWeek').value = y + '-' + m + '-' + d;
  } else {
    const now = new Date();
    const day = now.getDay();
    const diff = now.getDate() - day + (day === 0 ? -6 : 1);
    now.setDate(diff);
    const y = now.getFullYear();
    const m = String(now.getMonth()+1).padStart(2,'0');
    const d = String(now.getDate()).padStart(2,'0');
    document.getElementById('fWeek').value = y + '-' + m + '-' + d;
  }
  ['fName','fOutlet','fWeek'].forEach(id => {
    const el = document.getElementById(id);
    const saved = localStorage.getItem('kic_info_${linecook}_${id}');
    if (saved) el.value = saved;
    el.addEventListener('input', () => {
      localStorage.setItem('kic_info_${linecook}_${id}', el.value);
      buildDayRail(); renderDay();
    });
  });
  buildDayRail();
  renderDay();
});
