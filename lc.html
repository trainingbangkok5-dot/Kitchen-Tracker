// Init Firebase — wait for SDK to be ready
let _db = null;
function initFirebase() {

function pushToFirebase(record) {

async function uploadPhotoToFirebase(dataUrl, taskId, staffName, day) {
  try {
    if (!_db || !dataUrl) return null;
    // Compress photo before saving to Realtime Database
    const compressed = await compressToSize(dataUrl, 150); // max 150KB
    const key = (staffName||'unknown').replace(/[^a-zA-Z0-9]/g,'_')
              + '_' + ROLE + '_'
              + (getWeekStart()||'').replace(/[^a-zA-Z0-9]/g,'_');
    const photoKey = `d${day}_${taskId}`;
    await _db.ref(`photos/${key}/${photoKey}`).set(compressed);
    // Return a special marker URL so we know photo is in database
    return `db:${key}/${photoKey}`;
  } catch(e) {
    console.warn('Photo save failed:', e);
    return null;
  }
}

// Compress image to target size in KB
function compressToSize(dataUrl, maxKB) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      // Scale down if too large
      const maxDim = 800;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = Math.round(h * maxDim/w); w = maxDim; }
        else { w = Math.round(w * maxDim/h); h = maxDim; }
      }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      // Try quality 0.7 first
      let result = canvas.toDataURL('image/jpeg', 0.7);
      if (result.length > maxKB * 1024 * 1.37) {
        result = canvas.toDataURL('image/jpeg', 0.4);
      }
      resolve(result);
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

// ══════════════════════════════════════════════════════════════
// SHARED DATABASE — all checklists write to same localStorage key
// so master dashboard can read all submissions
// ══════════════════════════════════════════════════════════════
const SHARED_DB_KEY = 'KIC_SHARED_DB_V2';

function loadSharedDB() {
  try { return JSON.parse(localStorage.getItem(SHARED_DB_KEY)) || { submissions: [] }; }
  catch(e) { return { submissions: [] }; }
}
function saveSharedDB(db) {
  try { localStorage.setItem(SHARED_DB_KEY, JSON.stringify(db)); } catch(e) {}
}

function pushToMasterDashboard(record) {
  // record: { staffName, role, outlet, week, day, overallPct, qualified, submittedAt, verifiedBy }
  const db = loadSharedDB();
  // Find existing entry for this staff + week and update, or add new
  const idx = db.submissions.findIndex(
    s => s.staffName === record.staffName &&
         s.role === record.role &&
         s.week === record.week &&
         s.outlet === record.outlet
  );
  if (idx >= 0) {
    db.submissions[idx] = { ...db.submissions[idx], ...record };
  } else {
    db.submissions.push(record);
  }
  saveSharedDB(db);
}

// ── iOS Safari fix: use blob URL for camera capture ──────────────────────────
function iosPhotoFix(inputEl, onDataUrl) {
  // iOS Safari needs special handling — no capture attribute workaround
  inputEl.removeAttribute('capture');
  inputEl.setAttribute('accept', 'image/*');
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  if (isIOS) {
    // On iOS we add capture back AFTER a small delay so Safari registers it
    setTimeout(() => inputEl.setAttribute('capture', 'environment'), 50);
  }
}

function compressAndReturn(file, callback) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const MAX = 600;
      let w = img.width, h = img.height;
      if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
      if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = function() { callback(ev.target.result); };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ── Day unlock logic — only unlock next day, not future days ─────────────────
function getTodayDayNumber(weekStartStr) {
  if (!weekStartStr) return 1;
  try {
    // Use local calendar date (midnight-based, not 24hr rolling)
    const now = new Date();
    const todayStr = now.getFullYear() + '-' + 
      String(now.getMonth()+1).padStart(2,'0') + '-' + 
      String(now.getDate()).padStart(2,'0');
    const today = new Date(todayStr + 'T00:00:00');
    const start = new Date(weekStartStr + 'T00:00:00');
    const diff = Math.floor((today - start) / (1000 * 60 * 60 * 24));
    return Math.min(Math.max(diff + 1, 1), 6);
  } catch(e) { return 1; }
}

function isDayUnlocked(dayNum, weekStartStr) {
  if (!weekStartStr) return dayNum === 1; // allow day 1 even if week not set yet
  return dayNum <= getTodayDayNumber(weekStartStr);
}

function showToast(msg, type) {

    t = document.createElement('div');
    t.id = '_toast';
    t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);padding:10px 18px;border-radius:30px;font-size:13px;font-weight:600;opacity:0;transition:all 0.3s;z-index:9999;white-space:nowrap;pointer-events:none;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.background = type === 'error' ? '#EF4444' : type === 'warn' ? '#F59E0B' : '#0F172A';
  t.style.color = '#fff';
  t.style.opacity = '1';
  t.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => {
    t.style.opacity = '0';
    t.style.transform = 'translateX(-50%) translateY(20px)';
  }, 2800);
}



// ── Auto-reset: detect new week and start fresh cycle ────────
function getMonday(date) {
  const d = new Date(date);
  const day = d.getDay();
  // Sunday (0) = day 7 of current week, go back 6 days to Monday
  // Monday (1) = day 1, no change
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  d.setDate(diff);
  d.setHours(0,0,0,0);
  return d;
}

function getCurrentWeekStart() {
  const monday = getMonday(new Date());
  return monday.toISOString().split('T')[0];
}

function checkAutoReset() {
  const weekField = document.getElementById('fWeek');
  if (!weekField) return;

  const currentWeekStart = getCurrentWeekStart();
  const storedWeek = localStorage.getItem('kic_info_' + ROLE + '_fWeek') || '';

  // Auto-set week to current Monday if not set or if it's a new week
  if (!storedWeek || storedWeek !== currentWeekStart) {
    // New week detected — auto reset
    weekField.value = currentWeekStart;
    localStorage.setItem('kic_info_' + ROLE + '_fWeek', currentWeekStart);
    // Also update the week label display
    try { const el = document.getElementById('fWeek'); if(el) el.value = currentWeekStart; } catch(e) {}

    if (storedWeek && storedWeek !== currentWeekStart) {
      // Clear old week data from localStorage
      const oldData = JSON.parse(localStorage.getItem(SK) || '{}');
      const oldWeekKey = 'week_' + storedWeek;
      
      // Archive old week data before clearing
      const archiveKey = SK + '_archive_' + storedWeek;
      try {
        localStorage.setItem(archiveKey, JSON.stringify(oldData));
      } catch(e) {}
      
      // Start fresh
      localStorage.removeItem(SK);
      showToast('New week started — checklist reset ✓', 'ok');
    }

    buildDayRail();
    renderDay();
  }
}

// ── Day rail ──────────────────────────────────────────────────
function buildDayRail() {
  const rail = document.getElementById('dayRail');
  const data = load();
  const weekStart = getWeekStart();
  rail.innerHTML = '';
  for (let i = 1; i <= 6; i++) {
    const done     = data[`d${i}`]?._done;
    const unlocked = isDayUnlocked(i, weekStart);
    const btn = document.createElement('button');
    let cls = 'd-pill day-pill';
    if (i === currentDay) cls += ' active';
    if (done) cls += ' done';
    if (!unlocked) cls += ' locked';
    btn.className = cls;
    btn.textContent = done ? `Day ${i} ✓` : `Day ${i}`;
    btn.onclick = () => {
      if (!unlocked) { showToast(`Day ${i} unlocks on the correct date 📅`, 'warn'); return; }
      currentDay = i; buildDayRail(); renderDay();
    };
    rail.appendChild(btn);
  }

// ── Shift selection ───────────────────────────────────────────
let currentShift = null; // 'opening' or 'closing'

function selectShift(shift) {
  const data = load();
  const openingDone = !!data[`d${currentDay}`]?._openDone;

  if (shift === 'closing') {
    if (!openingDone) {
      showToast('Opening shift must be submitted first 🔒', 'warn'); return;
    }
    const now = new Date();
    const hour = now.getHours();
    const isNightTime = (hour === 23 && new Date().getMinutes() >= 30) || hour > 23 || hour < 6; // 11PM to 6AM
    if (!isNightTime) {
      const minutesLeft = hour < 23 ? (23 - hour - 1) * 60 + (60 - now.getMinutes()) : 0;
      const h = Math.floor(minutesLeft / 60);
      const m = minutesLeft % 60;
      showToast(`Closing unlocks at 11:30 PM — ${h}h ${m}m remaining ⏰`, 'warn');
      return;
    }
  }
  currentShift = shift;
  window._selectShiftReady = null;
  window._pendingShift = null;
  const btnO = document.getElementById('btnOpenShift');
  const btnC = document.getElementById('btnCloseShift');
  if (btnO) btnO.style.cssText = shift === 'opening'
    ? 'flex:1;padding:8px;border-radius:8px;border:2px solid #fff;background:rgba(255,255,255,0.9);color:#1A3C5E;font-size:12px;font-weight:700;cursor:pointer;'
    : 'flex:1;padding:8px;border-radius:8px;border:2px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.1);color:#fff;font-size:12px;font-weight:700;cursor:pointer;';
  if (btnC) btnC.style.cssText = shift === 'closing'
    ? 'flex:1;padding:8px;border-radius:8px;border:2px solid #22C55E;background:rgba(34,197,94,0.25);color:#fff;font-size:12px;font-weight:700;cursor:pointer;'
    : 'flex:1;padding:8px;border-radius:8px;border:2px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.1);color:#fff;font-size:12px;font-weight:700;cursor:pointer;';
  renderDay();
}

    const closingAvailable = openingDone && isAfter11;
    const minsLeft = isAfter11 ? 0 : (23 - nowH - 1) * 60 + (60 - new Date().getMinutes());
    const hLeft = Math.floor(minsLeft/60), mLeft = minsLeft%60;

    } else if (!openingDone) {

    container.appendChild(hdr);

    section.tasks.forEach((task, ti) => {

        container.appendChild(om);
      }
    }
  });

  // Score bar — today's shift score
  const pct = total > 0 ? Math.round((yes/total)*100) : 0;
  document.getElementById('scoreFill').style.width = pct + '%';
  document.getElementById('scoreFill').style.background = pct>=95?'#22C55E':pct>=70?'#F59E0B':'#3B82F6';
  document.getElementById('scorePct').textContent = pct + '%';

  // 6-day scores — split by opening and closing
  let oY=0,oM=0,cY=0,cM=0;
  for(let d=1;d<=6;d++){
    SECTIONS.forEach((s,si)=>{s.tasks.forEach(t=>{
      const v=getVal(d,t.id,'yn');
      if(v&&v!=='na'){
        if(si===0){oM++;if(v==='yes')oY++;}
        else{cM++;if(v==='yes')cY++;}
      }
    });});
  }
  const opO=oM>0?Math.round((oY/oM)*100):null;
  const opC=cM>0?Math.round((cY/cM)*100):null;
  const tM=oM+cM, tY=oY+cY;
  const op=tM>0?Math.round((tY/tM)*100):0, pass=op>=95;

  const sc=document.createElement('div');
  sc.className=`status-card ${tM>0?(pass?'pass':'fail'):''}`;
  sc.innerHTML=`
    <div class="sc-icon">${tM===0?'📋':pass?'✅':'❌'}</div>
    <div class="sc-title">${tM===0?'Fill your checklist':pass?'Incentive Qualified!':'Keep going!'}</div>
    <div class="sc-score" style="color:${tM===0?'#94A3B8':pass?'#15803D':'#B91C1C'}">${tM>0?op+'%':'—'}</div>

    ${tM>0?`<div style="display:flex;gap:8px;margin-top:10px;justify-content:center;">

      </div>

  container.appendChild(sc);

  // Submit closing button
  if (currentShift === 'closing') {
    const btn = document.createElement('button');
    btn.className = 'submit-btn';
    if (closingDone) {
      btn.disabled = true;
      btn.textContent = `✓ Day ${currentDay} Fully Submitted — Locked`;
      container.appendChild(btn);
      const msg = document.createElement('div');
      msg.className = 'synced-msg';
      msg.textContent = '✓ Submitted and synced to dashboard';

        <input class="overwrite-input" id="owCode" type="password" placeholder="Enter KIC PIN...">

function tapYN(tid, val, el) {
  const data = load();
  if (data[`d${currentDay}`]?._done && !ALLOW_OVERWRITE) {
    showToast('Day already submitted — cannot edit', 'error'); return;
  }
  setVal(currentDay, tid, 'yn', val);
  el.closest('.yn-row').querySelectorAll('.yn').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  // update score bar
  let t=0, y=0;
  const shiftIdx = currentShift==='closing'?1:0;
  const shiftSection = SECTIONS[shiftIdx];
  if(shiftSection) shiftSection.tasks.forEach(tk=>{t++;if(getVal(currentDay,tk.id,'yn')==='yes')y++;});
  const p=t>0?Math.round((y/t)*100):0;
  document.getElementById('scoreFill').style.width=p+'%';
  document.getElementById('scorePct').textContent=p+'%';
}


function fmtDateTime(iso) {
  if (!iso) return '—';
  try {
    const d = new Date(iso);
    const date = d.toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'});
    const time = d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:true});
    return date + ' ' + time;
  } catch(e) { return iso; }
}
function fmtTimeOnly(iso) {
  if (!iso) return '—';
  try {
    return new Date(iso).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:true});
  } catch(e) { return '—'; }
}

// ── Submit day ────────────────────────────────────────────────
function submitOpening() {
  const name = getStaffName();
  if (!name) { showToast('Please enter your name first', 'warn'); document.getElementById('fName').focus(); return; }
  if (!getOutlet()) { showToast('Please select an outlet', 'warn'); return; }
  if (!getWeekStart()) { showToast('Please set the week starting date', 'warn'); return; }
  const openingTasks = SECTIONS[0].tasks;
  const unanswered = openingTasks.filter(t => !getVal(currentDay, t.id, 'yn'));
  if (unanswered.length > 0) { showToast('Please answer all Opening Tasks first', 'warn'); return; }
  const d = load();
  if (!d[`d${currentDay}`]) d[`d${currentDay}`] = {};
  d[`d${currentDay}`]._openDone   = new Date().toISOString();
  d[`d${currentDay}`]._openerName = name;
  save(d);

  // Push opening record to Firebase so dashboard shows partial data
  let oY2=0,oM2=0;
  SECTIONS[0].tasks.forEach(t=>{
    const v=getVal(currentDay,t.id,'yn');
    if(v&&v!=='na'){oM2++;if(v==='yes')oY2++;}
  });
  const opO2=oM2>0?Math.round((oY2/oM2)*100):0;

  // Build taskData for opening tasks only
  const openingTaskData = {};
  SECTIONS[0].tasks.forEach(t=>{
    const yn   = getVal(currentDay, t.id, 'yn');
    const pUrl = getVal(currentDay, t.id, 'photoUrl');
    const photo= getVal(currentDay, t.id, 'photo');
    const comment2 = getVal(currentDay, t.id, 'comment') || '';
    if (yn) {
      openingTaskData[`d${currentDay}_${t.id}`] = {
        day: currentDay, section: SECTIONS[0].title,
        task: t.text, owner: t.ownerLbl,
        yn: yn||'', comment: comment2,
        photoUrl: pUrl||'',
        hasPhoto: !!(pUrl||photo),
      };
    }
  });

  pushToFirebase({
    staffName:   name,
    role:        ROLE,
    roleLabel:   ROLE_LABEL,
    outlet:      getOutlet(),
    week:        getWeekStart(),
    overallPct:  opO2,
    openingPct:  opO2,
    closingPct:  null,
    qualified:   false,
    day:         currentDay,
    status:      'opening_submitted',
    startedAt:   d[`d${currentDay}`]?._start || new Date().toISOString(),
    submittedAt: new Date().toISOString(),
    lastUpdated: new Date().toISOString(),
    taskData:    openingTaskData,
  });
  showToast('Opening tasks submitted ✓', 'ok');
  currentShift = null; // reset so closing staff sees shift picker
  buildDayRail(); renderDay();
}

function submitDay() {
  const name = getStaffName();
  const closerName = name; // closing staff enters their own name in the Staff Name field
  if (!name) { showToast('Please enter your name first', 'warn'); document.getElementById('fName').focus(); return; }
  if (!getOutlet()) { showToast('Please select an outlet', 'warn'); return; }
  if (!getWeekStart()) { showToast('Please set the week starting date', 'warn'); return; }
  const closingTasks = SECTIONS[1].tasks;
  const unanswered = closingTasks.filter(t => !getVal(currentDay, t.id, 'yn'));
  if (unanswered.length > 0) { showToast('Please answer all Closing Tasks first', 'warn'); return; }
  const d = load();
  if (!d[`d${currentDay}`]) d[`d${currentDay}`] = {};
  d[`d${currentDay}`]._closeDone  = new Date().toISOString();
  d[`d${currentDay}`]._closerName = closerName;
  d[`d${currentDay}`]._done       = new Date().toISOString(); // keep _done for compatibility
  save(d);

  // Calc overall — split by opening and closing
  let tY=0,tM=0,oY=0,oM=0,cY=0,cM=0;
  for(let dd=1;dd<=6;dd++){
    SECTIONS.forEach((s,si)=>s.tasks.forEach(t=>{
      const v=getVal(dd,t.id,'yn');
      if(v&&v!=='na'){
        tM++;if(v==='yes')tY++;
        if(si===0){oM++;if(v==='yes')oY++;}
        else{cM++;if(v==='yes')cY++;}
      }
    }));
  }
  const op=tM>0?Math.round((tY/tM)*100):0;
  const opO=oM>0?Math.round((oY/oM)*100):null;
  const opC=cM>0?Math.round((cY/cM)*100):null;

  // Push to master dashboard
  const _fbRecord = {
    staffName:    d[`d${currentDay}`]._openerName || name,
    closingStaff: closerName,
    role:         ROLE,
    roleLabel:    ROLE_LABEL,
    outlet:       getOutlet(),
    week:         getWeekStart(),
    verifiedBy:   '',
    overallPct:   op,
    openingPct:   opO,
    closingPct:   opC,
    qualified:    op>=95,
    day:        currentDay,
    startedAt:  d[`d${currentDay}`]?._start || new Date().toISOString(),
    photos: (function() {
      const photos = {};
      SECTIONS.forEach(s => s.tasks.forEach(t => {
        const url = getVal(currentDay, t.id, 'photoUrl');
        if (url) photos[t.id + '_day' + currentDay] = url;
      }));
      return photos;
    })(),
    // Store full task responses for dashboard detail view
    taskData: (function() {
      const tasks = {};
      for (let dd=1; dd<=6; dd++) {
        SECTIONS.forEach(s => s.tasks.forEach(t => {
          const yn    = getVal(dd, t.id, 'yn');
          const photo = getVal(dd, t.id, 'photo'); // base64 local photo
          const pUrl  = getVal(dd, t.id, 'photoUrl'); // firebase url
          if (yn || photo || pUrl) {
            tasks[`d${dd}_${t.id}`] = {
              day: dd,
              section: s.title,
              task: t.text,
              owner: t.ownerLbl,
              yn: yn||'',
              comment: getVal(dd, t.id, 'comment')||'',
              photoUrl: pUrl || photo || '', // prefer firebase url, fall back to base64
            };
          }
        }));
      }
      return tasks;
    })(),
    submittedAt:new Date().toISOString(),
    lastUpdated:new Date().toISOString(),
  };
  pushToMasterDashboard(_fbRecord);
  pushToFirebase(_fbRecord);

  showToast(`Day ${currentDay} submitted ✓`, 'ok');
  buildDayRail();
  renderDay();
}

// ── Overwrite (KIC/Area Chef) ─────────────────────────────────
function doOverwrite() {
  const code = document.getElementById('owCode')?.value;
  if (code !== OVERWRITE_CODE) { showToast('Wrong KIC PIN — access denied 🔒', 'error'); return; }
  const d = load();
  if (d[`d${currentDay}`]) {
    delete d[`d${currentDay}`]._done;
    delete d[`d${currentDay}`]._closeDone;
    delete d[`d${currentDay}`]._openDone;
  }
  save(d);
  showToast(`Day ${currentDay} unlocked — KIC can now edit ✓`, 'ok');
  currentShift = null; // reset to shift picker
  buildDayRail();
  renderDay();
}

// ── Photo ─────────────────────────────────────────────────────
function openPhotoModal(tid, label) {
  const data = load();
  if (data[`d${currentDay}`]?._done && !ALLOW_OVERWRITE) {
    showToast('Day submitted — cannot change photos', 'error'); return;
  }
  activePhotoTask = tid;
  document.getElementById('modalLabel').textContent = label;
  document.getElementById('photoModal').classList.add('open');
}
function closePhotoModal() {
  document.getElementById('photoModal').classList.remove('open');
  activePhotoTask = null;
}

document.getElementById('mbtnCamera').onclick = function() {
  closePhotoModal();
  const inp = document.getElementById('camInput');
  inp.value = '';
  // iOS fix: remove then re-add capture attribute
  inp.removeAttribute('capture');
  setTimeout(() => { inp.setAttribute('capture','environment'); inp.click(); }, 80);
};
document.getElementById('mbtnGallery').onclick = function() {
  closePhotoModal();
  const inp = document.getElementById('galInput');
  inp.value = '';
  inp.click();
};

function handlePhotoFile(file) {
  if (!file || !activePhotoTask) return;
  compressAndReturn(file, async function(dataUrl) {
    // Save locally first for instant display
    setVal(currentDay, activePhotoTask, 'photo', dataUrl);
    const taskId = activePhotoTask;
    activePhotoTask = null;
    renderDay();
    showToast('Photo saved ✓', 'ok');

    // Save compressed photo to Firebase Realtime Database
    const staffName = getStaffName();
    if (staffName && _db) {
      const dbRef = await uploadPhotoToFirebase(dataUrl, taskId, staffName, currentDay);
      if (dbRef) {
        setVal(currentDay, taskId, 'photoUrl', dbRef);
        showToast('Photo synced ✓', 'ok');
      }
    }
  });
}
document.getElementById('camInput').addEventListener('change', e => handlePhotoFile(e.target.files[0]));
document.getElementById('galInput').addEventListener('change', e => handlePhotoFile(e.target.files[0]));

// ── Persist info fields ───────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  window._selectShiftReady = selectShift;
  if (window._pendingShift) { selectShift(window._pendingShift); window._pendingShift = null; }
  // Auto-set to current Monday
  // Auto-set week to current Monday
  if (typeof getMonday === 'function') {
    const monday = getMonday(new Date());
    // Format as YYYY-MM-DD for date input
    const y = monday.getFullYear();
    const m = String(monday.getMonth()+1).padStart(2,'0');
    const d = String(monday.getDate()).padStart(2,'0');
    document.getElementById('fWeek').value = y + '-' + m + '-' + d;
  } else {
    const now = new Date();
    const day = now.getDay();
    const diff = now.getDate() - day + (day === 0 ? -6 : 1);
    now.setDate(diff);
    const y = now.getFullYear();
    const m = String(now.getMonth()+1).padStart(2,'0');
    const d = String(now.getDate()).padStart(2,'0');
    document.getElementById('fWeek').value = y + '-' + m + '-' + d;
  }
  ['fName','fOutlet','fWeek'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    const saved = localStorage.getItem('kic_info_' + ROLE + '_' + id);
    if (saved) el.value = saved;
    el.addEventListener('input', () => {
      localStorage.setItem('kic_info_' + ROLE + '_' + id, el.value);
      buildDayRail(); renderDay();
    });
  });
  buildDayRail();
  try { renderDay(); } catch(e) {
    document.getElementById('mainContent').innerHTML = '<div style="padding:20px;color:red;font-size:12px;">Error: ' + e.message + '</div>';
  }
});
</script>
