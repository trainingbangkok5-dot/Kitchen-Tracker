<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Superbowl — BOH Monthly Audit</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;font-size:14px;background:#f5f5f5;color:#1a1a1a}
.header{background:#fff;border-bottom:1px solid #e0e0e0;padding:1rem 1.5rem;position:sticky;top:0;z-index:50;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.header h1{font-size:17px;font-weight:700;margin-bottom:.75rem;color:#111}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:.75rem}
.meta input,.meta select{width:100%;font-size:13px;padding:7px 10px;border:1px solid #ccc;border-radius:6px;background:#fff;color:#111}
.score-bar{background:#f9f9f9;border:1px solid #e0e0e0;border-radius:10px;padding:.75rem 1rem;display:flex;align-items:center;gap:1rem}
.grade-badge{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;flex-shrink:0;border:2px solid rgba(0,0,0,.1)}
.score-info{flex:1}
.score-pct{font-size:22px;font-weight:700}
.score-sub{font-size:11px;color:#666;margin-top:2px}
.progress-track{height:7px;background:#e0e0e0;border-radius:4px;margin-top:6px}
.progress-fill{height:100%;border-radius:4px;transition:width .3s}
.section-nav{display:flex;gap:6px;padding:.75rem 1.5rem;overflow-x:auto;border-bottom:1px solid #e0e0e0;background:#fff;position:sticky;top:118px;z-index:40}
.section-nav::-webkit-scrollbar{height:4px}.section-nav::-webkit-scrollbar-thumb{background:#ccc;border-radius:2px}
.nav-btn{font-size:11px;padding:5px 12px;border:1px solid #ccc;border-radius:6px;background:#fff;color:#555;cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:Arial,sans-serif;font-weight:600}
.nav-btn:hover{background:#f0f0f0}
.nav-btn.active{background:#fff8e1;color:#e65100;border-color:#e65100}
.section-panel{padding:1.25rem 1.5rem;display:none;max-width:900px;margin:0 auto}
.section-panel.active{display:block}
.section-title{font-size:15px;font-weight:700;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between;color:#111}
.sec-score-pill{font-size:12px;background:#f0f0f0;border:1px solid #ddd;border-radius:6px;padding:3px 10px;color:#555;font-weight:700}
.item-card{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:.9rem 1rem;margin-bottom:.75rem}
.item-card.pass{border-left:4px solid #2e7d32}
.item-card.fail{border-left:4px solid #c62828}
.item-card.na{border-left:4px solid #757575}
.item-top{display:flex;align-items:flex-start;gap:.75rem}
.item-num{font-size:11px;font-weight:700;color:#888;min-width:22px;margin-top:2px}
.item-text{flex:1;font-size:13px;line-height:1.5}
.item-text strong{font-weight:700;display:block;margin-bottom:2px;color:#111}
.item-text span{color:#666;font-size:12px}
.item-score-badge{font-size:11px;color:#888;white-space:nowrap;flex-shrink:0;font-weight:700;background:#f5f5f5;padding:2px 8px;border-radius:5px;border:1px solid #e0e0e0}
.item-controls{display:flex;align-items:center;gap:6px;margin-top:.75rem;flex-wrap:wrap}
.status-btn{font-size:12px;padding:5px 13px;border:1px solid #ccc;border-radius:6px;background:#fff;color:#555;cursor:pointer;font-family:Arial,sans-serif;font-weight:700}
.status-btn:hover{background:#f5f5f5}
.status-btn.active-pass{background:#e8f5e9;color:#1b5e20;border-color:#2e7d32}
.status-btn.active-fail{background:#ffebee;color:#7f0000;border-color:#c62828}
.status-btn.active-na{background:#f5f5f5;color:#424242;border-color:#757575}
.comment-input{flex:1;min-width:140px;font-size:12px;padding:6px 9px;border:1px solid #ccc;border-radius:6px;background:#fff;color:#111;font-family:Arial,sans-serif}
.photo-label{font-size:12px;padding:5px 11px;border:1px solid #ccc;border-radius:6px;cursor:pointer;color:#555;display:inline-flex;align-items:center;gap:5px;background:#fff;font-weight:700;white-space:nowrap}
.photo-label:hover{background:#f5f5f5;border-color:#999}
.photo-input{display:none}
.photo-thumbs{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.thumb-wrap{position:relative;display:inline-block}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid #ddd;display:block;cursor:pointer}
.thumb:hover{opacity:.85}
.thumb-del{position:absolute;top:-6px;right:-6px;background:#c62828;color:#fff;border:2px solid #fff;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700}
.footer{background:#fff;padding:1rem 1.5rem;border-top:1px solid #e0e0e0;display:flex;gap:.75rem;justify-content:flex-end;position:sticky;bottom:0;z-index:40;box-shadow:0 -1px 4px rgba(0,0,0,.06)}
.btn-summary{font-size:13px;padding:8px 18px;border:1px solid #6a1b9a;border-radius:6px;background:#f3e5f5;cursor:pointer;color:#4a148c;font-weight:700;font-family:Arial,sans-serif}
.btn-excel{font-size:13px;padding:8px 18px;border:1px solid #2e7d32;border-radius:6px;background:#e8f5e9;cursor:pointer;color:#1b5e20;font-weight:700;font-family:Arial,sans-serif}
.btn-pdf{font-size:13px;padding:8px 18px;border:1px solid #b71c1c;border-radius:6px;background:#ffebee;cursor:pointer;color:#7f0000;font-weight:700;font-family:Arial,sans-serif}
.toast{display:none;position:fixed;bottom:80px;right:24px;font-size:13px;padding:10px 18px;border-radius:8px;font-weight:700;z-index:999;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.toast.show{display:block}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;align-items:center;justify-content:center}
.lightbox.open{display:flex}
.lightbox img{max-width:90vw;max-height:85vh;border-radius:8px}
.lightbox-close{position:fixed;top:16px;right:20px;color:#fff;font-size:28px;cursor:pointer;font-weight:700;background:none;border:none;z-index:201}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:12px;padding:1.5rem;width:600px;max-width:96vw;max-height:88vh;overflow-y:auto;box-shadow:0 4px 24px rgba(0,0,0,.18)}
.modal h2{font-size:16px;font-weight:700;margin-bottom:1rem;color:#111}
.summary-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #eee;font-size:13px}
.summary-row:last-child{border-bottom:none}
.pct-pill{font-size:11px;padding:3px 9px;border-radius:5px;font-weight:700}
.modal-close{float:right;background:none;border:none;font-size:22px;cursor:pointer;color:#888;font-weight:700}
.pdf-progress{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;align-items:center;justify-content:center}
.pdf-progress.open{display:flex}
.pdf-box{background:#fff;border-radius:12px;padding:2rem;text-align:center;width:300px}
.pdf-box p{font-size:14px;font-weight:700;margin-bottom:1rem;color:#111}
.pdf-track{height:8px;background:#e0e0e0;border-radius:4px;overflow:hidden}
.pdf-fill{height:100%;background:#e65100;border-radius:4px;transition:width .2s}
.pdf-box small{font-size:11px;color:#888;margin-top:.5rem;display:block}

.btn-save{font-size:13px;padding:8px 18px;border:1px solid #283593;border-radius:6px;background:#e8eaf6;cursor:pointer;color:#1a237e;font-weight:700;font-family:Arial,sans-serif;display:inline-flex;align-items:center;gap:6px}
.btn-save:hover{background:#c5cae9}
.btn-clear{font-size:11px;padding:5px 10px;border:1px solid #ccc;border-radius:6px;background:#fff;cursor:pointer;color:#888;font-weight:600;font-family:Arial,sans-serif}
.btn-clear:hover{background:#fce4ec;border-color:#e53935;color:#c62828}
.save-info{font-size:11px;color:#888;align-self:center;flex:1}
</style>
</head>
<body>
<div class="header">
  <h1>&#127944; Superbowl &mdash; BOH Internal Monthly Audit</h1>
  <div class="meta">
    <input id="auditor" placeholder="Auditor name" value="Sunshine Jade Rogel" />
    <input id="outlet" placeholder="Outlet / branch" />
    <input id="audit-date" type="date" />
    <select id="shift"><option value="">Select shift</option><option>Morning</option><option>Afternoon</option><option>Evening</option></select>
  </div>
  <div class="score-bar">
    <div class="grade-badge" id="grade-badge" style="background:#ffebee;color:#7f0000">D</div>
    <div class="score-info">
      <div class="score-pct"><span id="score-pct">0</span>% &nbsp;<span id="score-raw" style="font-size:14px;color:#888;font-weight:400">0 / 190</span></div>
      <div class="score-sub">Dubai Municipality Compliance Score</div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%;background:#c62828"></div></div>
    </div>
  </div>
</div>
<div class="section-nav" id="section-nav"></div>
<div id="sections-container"></div>
<div class="footer">
  <button class="btn-save" onclick="saveAudit()">&#128190; Save Progress</button>
  <span class="save-info" id="last-saved-label"></span>
  <button class="btn-clear" onclick="clearSave()" title="Clear saved data &amp; restart">&#128465; Reset</button>
  <button class="btn-summary" onclick="showSummary()">&#128202; Summary Report</button>
  <button class="btn-excel" onclick="exportExcel()">&#128218; Export to Excel</button>
  <button class="btn-pdf" onclick="exportPDF()">&#128196; Export PDF</button>
  <button class="btn-pdf" onclick="submitAuditToDashboard()" style="background:#E8F5E9;border-color:#2E7D32;color:#1B5E20;">📊 Submit to Dashboard</button>
</div>
<div id="toast" class="toast"></div>
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">&#x2715;</button>
  <img id="lightbox-img" src="" alt="Photo" onclick="event.stopPropagation()" />
</div>
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <button class="modal-close" onclick="document.getElementById('modal-overlay').classList.remove('open')">&#x2715;</button>
    <h2>&#128202; Superbowl BOH Audit Summary</h2>
    <div id="modal-body"></div>
  </div>
</div>
<div class="pdf-progress" id="pdf-progress">
  <div class="pdf-box">
    <p>&#128196; Generating PDF Report...</p>
    <div class="pdf-track"><div class="pdf-fill" id="pdf-bar" style="width:0%"></div></div>
    <small id="pdf-lbl">Preparing...</small>
  </div>
</div>
<script>
const ORIG_MAX = 190;
const SECTIONS=[
{id:'s1',title:'General Operational Compliance',items:[
{n:1,label:'Chef Uniform & Grooming',desc:'Staff were observed wearing clean, properly fitted uniforms with a bandana over a hairnet, stain-free aprons, neatly trimmed fingernails, well-groomed hair and beard, and appropriate chef shoes.',score:1},

{n:9,label:'Forms & Records',desc:'All required forms and checklists including wastage logs, staff-food consumption records, and manual temperature monitoring sheets are completed accurately, updated on time, and kept easily accessible for verification.',score:3},

{n:14,label:'Walk-In Chiller & Freezer',desc:'The walk-in chiller and freezer are clean, operating at the correct temperatures, well-organized, and properly logged. All products are clearly labeled with accurate expiry dates, free from expired items, and stored covered or wrapped as required.',score:5},

{n:8,label:'Cross-Contamination Control',desc:'Cross-contamination is effectively prevented by keeping raw and ready-to-eat items fully separated at every stage of storage, preparation, and handling.',score:5},

{id:'s3',title:'Maki, Call-Out & Dim Sum Section',items:[

{id:'s5',title:'Hot Food Preparation Area (Fryer & Wok)',items:[

const state={};
SECTIONS.forEach(s=>s.items.forEach(it=>{state[s.id+'_'+it.n]={status:null,comment:'',photos:[]};}));

function getGrade(p){
  if(p>=91)return{g:'A',col:'#1b5e20',bg:'#e8f5e9',fill:'#2e7d32',label:'Excellent'};
  if(p>=81)return{g:'B',col:'#e65100',bg:'#fff3e0',fill:'#ef6c00',label:'Good'};
  if(p>=71)return{g:'C',col:'#bf360c',bg:'#fbe9e7',fill:'#d84315',label:'Fair/Acceptable'};
  return{g:'D',col:'#7f0000',bg:'#ffebee',fill:'#c62828',label:'Poor'};
}

function calcScores(){
  let total=0;
  const secScores={};
  SECTIONS.forEach(s=>{
    let earned=0,max=0;
    s.items.forEach(it=>{
      const st=state[s.id+'_'+it.n];
      if(st.status!=='na'){max+=it.score;if(st.status==='pass')earned+=it.score;}
    });
    secScores[s.id]={earned,max};total+=earned;
  });
  const maxTotal=Object.values(secScores).reduce((a,v)=>a+v.max,0);
  return{total,maxTotal,secScores};
}

function updateScoreBar(){
  const{total,maxTotal,secScores}=calcScores();
  const pct=maxTotal>0?Math.round(total/maxTotal*100):0;
  const gr=getGrade(pct);
  const gb=document.getElementById('grade-badge');
  gb.textContent=gr.g;gb.style.background=gr.bg;gb.style.color=gr.col;
  document.getElementById('score-pct').textContent=pct;
  document.getElementById('score-raw').textContent=total+' / '+maxTotal+(maxTotal<ORIG_MAX?' (excl. N/A)':'');
  const pf=document.getElementById('progress-fill');
  pf.style.width=pct+'%';pf.style.background=gr.fill;
  SECTIONS.forEach(s=>{
    const el=document.getElementById('sec-score-'+s.id);
    if(el)el.textContent=secScores[s.id].earned+'/'+secScores[s.id].max;
  });
}

function setStatus(secId,n,status){
  const k=secId+'_'+n;
  state[k].status=status;
  document.getElementById('card-'+k).className='item-card '+(status||'');
  ['pass','fail','na'].forEach(s=>{document.getElementById('btn-'+s+'-'+k).className='status-btn'+(status===s?' active-'+s:'');});
  updateScoreBar();
}

function setComment(secId,n,val){state[secId+'_'+n].comment=val;}

function addPhotos(secId,n,files){
  const k=secId+'_'+n;
  Array.from(files).forEach(f=>{
    const r=new FileReader();
    r.onload=e=>{state[k].photos.push(e.target.result);renderThumbs(secId,n);};
    r.readAsDataURL(f);
  });
}
function removePhoto(secId,n,idx){state[secId+'_'+n].photos.splice(idx,1);renderThumbs(secId,n);}

function renderThumbs(secId,n){
  const k=secId+'_'+n;
  const el=document.getElementById('thumbs-'+k);
  el.innerHTML='';
  state[k].photos.forEach((src,i)=>{
    const wrap=document.createElement('div');wrap.className='thumb-wrap';
    const img=document.createElement('img');img.className='thumb';img.src=src;img.title='Click to enlarge';
    img.onclick=()=>openLightbox(src);
    const del=document.createElement('button');del.className='thumb-del';del.innerHTML='x';
    del.onclick=()=>removePhoto(secId,n,i);
    wrap.appendChild(img);wrap.appendChild(del);el.appendChild(wrap);
  });
  const lbl=document.getElementById('photo-label-'+k);
  if(lbl)lbl.textContent=state[k].photos.length>0?'📷 '+state[k].photos.length+' photo(s)':'📷 Add photo';
}

function openLightbox(src){document.getElementById('lightbox-img').src=src;document.getElementById('lightbox').classList.add('open');}
function closeLightbox(){document.getElementById('lightbox').classList.remove('open');}

function showToast(msg,bg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.background=bg||'#2e7d32';t.style.color='#fff';
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3500);
}

function buildUI(){
  const nav=document.getElementById('section-nav');
  const container=document.getElementById('sections-container');
  SECTIONS.forEach((s,si)=>{
    const nb=document.createElement('button');
    nb.className='nav-btn'+(si===0?' active':'');
    nb.textContent=(si+1)+'. '+s.title;nb.onclick=()=>switchSection(s.id);
    nav.appendChild(nb);
    const panel=document.createElement('div');
    panel.className='section-panel'+(si===0?' active':'');
    panel.id='panel-'+s.id;
    const maxS=s.items.reduce((a,it)=>a+it.score,0);
    panel.innerHTML='<div class="section-title">Section '+(si+1)+': '+s.title+'<span class="sec-score-pill" id="sec-score-'+s.id+'">0/'+maxS+'</span></div>';
    s.items.forEach(it=>{
      const k=s.id+'_'+it.n;
      const card=document.createElement('div');
      card.className='item-card';card.id='card-'+k;
      card.innerHTML='<div class="item-top"><div class="item-num">'+it.n+'</div><div class="item-text"><strong>'+it.label+'</strong><span>'+it.desc+'</span></div><div class="item-score-badge">Max: '+it.score+'pt'+(it.score>1?'s':'')+'</div></div>'
        +'<div class="item-controls">'
        +'<button id="btn-pass-'+k+'" class="status-btn" onclick="setStatus(\''+s.id+'\','+it.n+',\'pass\')">&#10004; Pass</button>'
        +'<button id="btn-fail-'+k+'" class="status-btn" onclick="setStatus(\''+s.id+'\','+it.n+',\'fail\')">&#10008; Fail</button>'
        +'<button id="btn-na-'+k+'" class="status-btn" onclick="setStatus(\''+s.id+'\','+it.n+',\'na\')">&#8212; N/A</button>'
        +'<input type="text" class="comment-input" placeholder="Comment / corrective action..." oninput="setComment(\''+s.id+'\','+it.n+',this.value)" />'
        +'<label class="photo-label" id="photo-label-'+k+'" for="photo-input-'+k+'">&#128247; Add photo</label>'
        +'<input type="file" class="photo-input" id="photo-input-'+k+'" accept="image/*" multiple onchange="addPhotos(\''+s.id+'\','+it.n+',this.files)" />'
        +'</div><div class="photo-thumbs" id="thumbs-'+k+'"></div>';
      panel.appendChild(card);
    });
    container.appendChild(panel);
  });
}

function switchSection(secId){
  document.querySelectorAll('.section-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-'+secId).classList.add('active');
  SECTIONS.forEach((s,si)=>{if(s.id===secId)document.querySelectorAll('.nav-btn')[si].classList.add('active');});
  window.scrollTo({top:0,behavior:'smooth'});
}

function showSummary(){
  const{total,maxTotal,secScores}=calcScores();

  const gr=getGrade(pct);
  const auditor=document.getElementById('auditor').value||'—';

  const shift=document.getElementById('shift').value||'—';
  let html='<div style="display:flex;align-items:center;gap:12px;margin-bottom:1rem;padding:.875rem 1rem;background:'+gr.bg+';border-radius:8px;border-left:4px solid '+gr.fill+'">'
    +'<div style="width:48px;height:48px;border-radius:50%;background:'+gr.fill+';color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex-shrink:0">'+gr.g+'</div>'
    +'<div><div style="font-size:18px;font-weight:700;color:'+gr.col+'">'+pct+'% &mdash; Grade '+gr.g+' ('+gr.label+')</div>'

  SECTIONS.forEach((s,si)=>{

    const col=sp>=91?'#1b5e20':sp>=71?'#e65100':'#7f0000';
    const bg=sp>=91?'#e8f5e9':sp>=71?'#fff3e0':'#ffebee';
    html+='<div class="summary-row"><span>'+(si+1)+'. '+s.title+'</span><span style="display:flex;align-items:center;gap:8px"><span style="font-size:12px;color:#888">'+ss.earned+'/'+ss.max+'</span><span class="pct-pill" style="background:'+bg+';color:'+col+'">'+sp+'%</span></span></div>';
  });
  const fails=[];
  SECTIONS.forEach(s=>s.items.forEach(it=>{const k=s.id+'_'+it.n;if(state[k].status==='fail')fails.push({section:s.title,label:it.label,comment:state[k].comment,photos:state[k].photos});}));
  if(fails.length){
    html+='<div style="margin-top:1rem;font-weight:700;font-size:13px;margin-bottom:.5rem;color:#c62828">Failed Items &mdash; Corrective Action Required</div>';
    fails.forEach(f=>{
      html+='<div style="margin-bottom:.5rem;padding:.6rem .875rem;background:#ffebee;border-radius:6px;border-left:3px solid #c62828">'
        +'<div style="font-size:12px;font-weight:700;color:#7f0000">'+f.section+' &mdash; '+f.label+'</div>'
        +'<div style="font-size:11px;color:#c62828;margin-top:2px">'+(f.comment||'No comment added')+'</div>'
        +(f.photos.length?'<div style="font-size:11px;color:#555;margin-top:2px">📷 '+f.photos.length+' photo(s) attached</div>':'')
        +'</div>';
    });
  } else {
    html+='<div style="margin-top:1rem;padding:.75rem;background:#e8f5e9;border-radius:6px;font-size:13px;color:#1b5e20;font-weight:700">&#10004; No failed items recorded.</div>';

  document.getElementById('modal-overlay').classList.add('open');

function exportExcel(){
  if(typeof XLSX==='undefined'){alert('Excel library not loaded.');return;}
  const wb=XLSX.utils.book_new();
  const auditor=document.getElementById('auditor').value||'';
  const outlet=document.getElementById('outlet').value||'';
  const auditDate=document.getElementById('audit-date').value||'';
  const shift=document.getElementById('shift').value||'';
  const{total,maxTotal,secScores}=calcScores();
  const pct=maxTotal>0?Math.round(total/maxTotal*100):0;
  const gr=getGrade(pct);
  const summaryData=[
    ['SUPERBOWL — BOH INTERNAL MONTHLY AUDIT'],[''],
    ['Auditor',auditor,'Date',auditDate],['Outlet',outlet,'Shift',shift],[''],
    ['OVERALL SCORE',total+' / '+maxTotal,'Compliance %',pct+'%','Grade',gr.g+' — '+gr.label],[''],
    ['SECTION SUMMARY'],['No.','Section','Max Score','Score Achieved','Percentage','Status'],
  ];
  SECTIONS.forEach((s,si)=>{
    const ss=secScores[s.id];const sp=ss.max>0?Math.round(ss.earned/ss.max*100):0;
    summaryData.push([si+1,s.title,ss.max,ss.earned,sp+'%',sp>=91?'Excellent':sp>=81?'Good':sp>=71?'Fair':'Poor']);
  });
  summaryData.push([''],['FAILED ITEMS'],['Section','Item','Comment','Photos']);
  let fc=0;
  SECTIONS.forEach(s=>s.items.forEach(it=>{
    const k=s.id+'_'+it.n;
    if(state[k].status==='fail'){summaryData.push([s.title,it.label,state[k].comment||'No comment',state[k].photos.length>0?state[k].photos.length+' photo(s)':'None']);fc++;}
  }));
  if(!fc)summaryData.push(['—','No failed items','','']);
  const ws=XLSX.utils.aoa_to_sheet(summaryData);
  ws['!cols']=[{wch:5},{wch:38},{wch:14},{wch:16},{wch:14},{wch:20}];
  XLSX.utils.book_append_sheet(wb,ws,'Summary');
  SECTIONS.forEach((s,si)=>{
    const rows=[['SUPERBOWL — BOH INTERNAL MONTHLY AUDIT'],['Section '+(si+1)+': '+s.title],
      ['Auditor: '+auditor,'','Outlet: '+outlet,'','Date: '+auditDate,'Shift: '+shift],[''],
      ['No.','Criteria','Description','Status','Score','Max Score','Comment','Photos']];
    s.items.forEach(it=>{
      const k=s.id+'_'+it.n;const d=state[k];
      rows.push([it.n,it.label,it.desc,d.status==='pass'?'PASS':d.status==='fail'?'FAIL':d.status==='na'?'N/A':'Not Audited',
        d.status==='pass'?it.score:0,it.score,d.comment||'',d.photos.length>0?d.photos.length+' photo(s)':'None']);
    });
    const ss=secScores[s.id];
    rows.push([''],['','TOTAL','',ss.max>0?Math.round(ss.earned/ss.max*100)+'%':'—',ss.earned,ss.max,'','']);
    const sheet=XLSX.utils.aoa_to_sheet(rows);
    sheet['!cols']=[{wch:5},{wch:28},{wch:48},{wch:13},{wch:8},{wch:10},{wch:35},{wch:14}];
    XLSX.utils.book_append_sheet(wb,sheet,('S'+(si+1)+'_'+s.title).substring(0,31).replace(/[:\\/?*\[\]]/g,''));
  });
  const ds=(auditDate||'').replace(/-/g,'');
  const os=outlet?'_'+outlet.replace(/\s+/g,'_'):'';
  XLSX.writeFile(wb,'Superbowl_BOH_Audit'+(ds?'_'+ds:'')+os+'.xlsx');
  showToast('✔ Excel downloaded!','#2e7d32');
}

  y=50;

  });
  y+=30;
  sf(11,'bold',[30,30,30]);doc.text('Section Summary',ML,y);y+=6;
  fr(ML,y,CW,7,50,50,50);
  sf(8,'bold',[255,255,255]);doc.text('Section',ML+2,y+5);doc.text('Score',ML+CW-42,y+5);doc.text('Max',ML+CW-28,y+5);doc.text('%',ML+CW-12,y+5);
  y+=7;
  SECTIONS.forEach((s,si)=>{

      sf(7,'bold',[100,100,100]);doc.text('Max: '+it.score+'pt'+(it.score>1?'s':''),ML+CW-14,y+5);
      let iy=y+10+descH+2;
      if(hasC){sf(7,'normal',[60,60,160]);doc.text('Comment: ',ML+19,iy);sf(7,'normal',[40,40,40]);doc.text(cLines,ML+40,iy);iy+=cLines.length*4+2;}
      if(st.photos.length>0){
        sf(7,'bold',[40,40,180]);doc.text('Photos ('+st.photos.length+'):',ML+19,iy+4);iy+=6;
        const pw=34,ph=32,gap=2;let px=ML+19;
        for(let pi=0;pi<st.photos.length;pi++){
          if(pi>0&&pi%4===0){px=ML+19;iy+=ph+gap;}
          try{doc.addImage(st.photos[pi],'JPEG',px,iy,pw,ph,'','FAST');}catch(e){fr(px,iy,pw,ph,200,200,200);}
          px+=pw+gap;
        }
        iy+=ph+4;
      }
      y+=iH+1;
    }
    cy(8);fr(ML,y,CW,7,235,235,235);
    sf(8,'bold',[60,60,60]);doc.text('Section Total: '+ss.earned+' / '+ss.max+'  ('+sp2+'%)',ML+2,y+4.5);y+=8;
  }
  sp(95,'Adding page numbers...');await new Promise(r=>setTimeout(r,10));
  const pages=doc.internal.getNumberOfPages();
  for(let i=1;i<=pages;i++){
    doc.setPage(i);sf(7,'normal',[180,180,180]);
    doc.text('Superbowl BOH Audit  |  Page '+i+' of '+pages+'  |  '+auditor+'  |  '+auditDate,W/2,292,{align:'center'});
  }
  const ds=(auditDate||'').replace(/-/g,'');
  const os=outlet!=='Not specified'?'_'+outlet.replace(/\s+/g,'_'):'';
  doc.save('Superbowl_BOH_Audit'+(ds?'_'+ds:'')+os+'.pdf');
  prog.classList.remove('open');bar.style.width='0%';
  showToast('✔ PDF downloaded with all photos!','#e65100');
}

/* ── SAVE / LOAD ─────────────────────────────────────────── */
const SAVE_KEY = (function(){
  const t=document.title||'audit';
  return 'audit_save_'+t.replace(/[^a-zA-Z0-9]/g,'_').toLowerCase();
})();

function saveAudit(){
  const payload={
    state: state,
    auditor: document.getElementById('auditor').value,
    outlet: (document.getElementById('outlet')||document.getElementById('location')||{value:''}).value,
    date: document.getElementById('audit-date').value,
    shift: document.getElementById('shift').value,
    savedAt: new Date().toISOString()
  };
  // Photos are already base64 in state — save all
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify(payload));
    const t=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    showToast('✔ Audit saved at '+t+' — data will be here when you reopen this file!','#283593');
    document.getElementById('last-saved-label').textContent='Last saved: '+t;
  } catch(e){
    showToast('⚠ Could not save — file may be too large (too many photos). Try removing some photos.','#c62828');
  }
}

function loadAudit(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return;
    const payload=JSON.parse(raw);
    // Restore form fields
    if(payload.auditor) document.getElementById('auditor').value=payload.auditor;
    const outletEl=document.getElementById('outlet')||document.getElementById('location');
    if(outletEl&&payload.outlet) outletEl.value=payload.outlet;
    if(payload.date) document.getElementById('audit-date').value=payload.date;
    if(payload.shift) document.getElementById('shift').value=payload.shift;
    // Restore state
    if(payload.state){
      Object.keys(payload.state).forEach(k=>{
        if(state[k]!==undefined){
          state[k].status = payload.state[k].status||null;
          state[k].comment = payload.state[k].comment||'';
          state[k].photos = payload.state[k].photos||[];
        }
      });
    }
    // Re-render all cards
    SECTIONS.forEach(s=>s.items.forEach(it=>{
      const k=s.id+'_'+it.n;
      if(state[k]&&state[k].status!==null){
        setStatus(s.id,it.n,state[k].status);
      }
      if(state[k]&&state[k].comment){
        const inp=document.querySelector('#card-'+k+' .comment-input');
        if(inp) inp.value=state[k].comment;
      }
      if(state[k]&&state[k].photos&&state[k].photos.length>0){
        renderThumbs(s.id,it.n);
      }
    }));
    updateScoreBar();
    const t=new Date(payload.savedAt).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
    document.getElementById('last-saved-label').textContent='Restored: '+t;
    showToast('✔ Previous audit restored!','#2e7d32');
  } catch(e){
    console.log('No saved data or load error:', e);
  }
}

function clearSave(){
  if(!confirm('Are you sure you want to clear all saved data and start fresh?')) return;
  localStorage.removeItem(SAVE_KEY);
  location.reload();
}


// ── Submit audit to shared dashboard ─────────────────────────────────────────
function submitAuditToDashboard() {
  const {total, maxTotal} = calcScores();
  const pct = maxTotal > 0 ? Math.round((total / maxTotal) * 100) : 0;
  const auditor  = document.getElementById('auditor')?.value || '—';
  const outlet   = (document.getElementById('outlet') || document.getElementById('location') || {value:'—'}).value || '—';
  const auditDate= document.getElementById('audit-date')?.value || new Date().toISOString().split('T')[0];
  const shift    = document.getElementById('shift')?.value || '—';
  const title    = document.title || '';
  const auditType= title.toLowerCase().includes('foh') ? 'FOH' : 'BOH';
  const outletKey= outlet.trim().toLowerCase().replace(/\s+/g,'_');

  try {
    const db = JSON.parse(localStorage.getItem('KIC_SHARED_DB_V2') || '{"submissions":[],"audits":[]}');
    if (!db.audits) db.audits = [];

    // Remove old audit for same outlet+type
    db.audits = db.audits.filter(a => !(a.outlet === outlet && a.auditType === auditType));

    db.audits.push({
      outlet,
      auditType,
      score: pct,
      rawScore: total,
      maxScore: maxTotal,
      auditor,
      auditDate,
      shift,
      submittedAt: new Date().toISOString()
    });

    localStorage.setItem('KIC_SHARED_DB_V2', JSON.stringify(db));
    showToast('✅ Audit submitted to dashboard! Score: ' + pct + '%', '#2e7d32');
  } catch(e) {
    showToast('⚠ Could not submit to dashboard: ' + e.message, '#c62828');
  }
}

buildUI();
updateScoreBar();
document.getElementById('audit-date').valueAsDate=new Date();
