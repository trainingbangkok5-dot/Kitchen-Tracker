// ── Firebase ─────────────────────────────────────────────────
let _db = null;
function initFirebase() {
  try {
    if (typeof firebase === 'undefined') { setTimeout(initFirebase, 100); return; }

// ── Toast ────────────────────────────────────────────────────
function showToast(msg, type) {

// ── Dubai Date ───────────────────────────────────────────────
function getDubaiDate() {
  const n=new Date(),u=n.getTime()+(n.getTimezoneOffset()*60000);
  return new Date(u+(4*3600000));
}
function getDubaiDateStr() {
  const d=getDubaiDate();
  return d.getFullYear()+'-'+(d.getMonth()<9?'0':'')+(d.getMonth()+1)+'-'+(d.getDate()<10?'0':'')+d.getDate();
}
function getDubaiHour() { return getDubaiDate().getHours(); }
function getTodayKey() {
  try {
    const hour=getDubaiHour();
    if(currentShift==='closing'&&hour<2){
      const d=getDubaiDate(); d.setDate(d.getDate()-1);
      return 'dt'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    }
    return 'dt'+getDubaiDateStr();
  } catch(e){ return 'dt'+new Date().toISOString().split('T')[0]; }
}
function getWeekStart() {
  const v = document.getElementById('fWeek')?.value;
  return v && v.length===10 ? v : getDubaiDateStr();
}

// ── Storage ──────────────────────────────────────────────────
function load() { try { return JSON.parse(localStorage.getItem(SK)||'{}'); } catch(e) { return {}; } }
function save(d) { try { localStorage.setItem(SK, JSON.stringify(d)); } catch(e) {} }
function getVal(day,tid,field) {
  const data=load(), dateKey=getTodayKey();
  return data[dateKey]?.[tid]?.[field] || data['d'+day]?.[tid]?.[field] || null;
}
function setVal(day,tid,field,val) {
  const d=load(), key=getTodayKey();
  if(!d[key]) d[key]={};
  if(!d[key][tid]) d[key][tid]={};
  d[key][tid][field]=val;
  save(d);
}

// Compress image to max 60KB before upload
function compressPhoto(dataUrl) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      const maxDim = 600;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = Math.round(h * maxDim/w); w = maxDim; }
        else { w = Math.round(w * maxDim/h); h = maxDim; }
      }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      let result = canvas.toDataURL('image/jpeg', 0.5);
      if (result.length > 60 * 1024 * 1.37) result = canvas.toDataURL('image/jpeg', 0.25);
      resolve(result);
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

// Convert data: URL to Blob — works on iOS/Android/OPPO
function dataURLtoBlob(dataUrl) {
  try {
    const parts = dataUrl.split(',');
    const mime = parts[0].match(/:(.*?);/)[1];
    const bstr = atob(parts[1]);
    let n = bstr.length;
    const u8arr = new Uint8Array(n);
    while (n--) u8arr[n] = bstr.charCodeAt(n);
    return new Blob([u8arr], { type: mime });
  } catch(e) { return null; }
}
async function uploadToCloudinary(dataUrl) {
  try {
    const blob = dataURLtoBlob(dataUrl);
    if (!blob) throw new Error('blob failed');
    const fd = new FormData();
    fd.append('file', blob, 'photo.jpg');
    fd.append('upload_preset', CLOUDINARY_PRESET);
    const r = await fetch('https://api.cloudinary.com/v1_1/'+CLOUDINARY_CLOUD+'/image/upload', {method:'POST', body:fd});
    const j = await r.json();
    return j.secure_url || null;
  } catch(e) { console.warn('Cloudinary upload failed:', e); return null; }
}
async function handlePhotoFile(file) {
  if(!file||!activePhotoTask) return;
  const tid=activePhotoTask; activePhotoTask=null;
  const reader=new FileReader();
  reader.onload=async e=>{
    const dataUrl=e.target.result;
    const compressed = await compressPhoto(dataUrl);
    // Find next empty photo slot
    let slotIdx=0;
    for(let pi=0;pi<5;pi++){
      const existing=getVal(currentDay,tid,'photo_'+pi)||(pi===0?getVal(currentDay,tid,'photo'):null);
      if(!existing){slotIdx=pi;break;} slotIdx=pi+1;
    }
    const slotKey=slotIdx===0?'photo':'photo_'+slotIdx;
    setVal(currentDay,tid,slotKey,compressed);
    renderDay();
    showToast('Uploading photo...','ok');
    try {
      const url=await uploadToCloudinary(compressed);
      if(url){
        const cloudKey=slotIdx===0?'photoUrl':'photoUrl_'+slotIdx;
        setVal(currentDay,tid,cloudKey,url);
        renderDay();
        showToast('Photo synced ✓','ok');
      } else { showToast('Photo saved locally only','warn'); }
    } catch(err){ showToast('Photo saved locally only','warn'); }
  };
  reader.readAsDataURL(file);
}

// ── Shift logic ───────────────────────────────────────────────
function selectShift(shift) {
  const hour = getDubaiHour();
  if (shift === 'opening') {
    const _openDone = !!load()[getTodayKey()]?._openDone;
    if (!(hour >= 7 && hour < 15) && !_openDone) {
      showToast('Opening shift is available 7:00 AM – 3:00 PM only ⏰', 'warn');
      return;
    }
  }
  if (shift === 'closing') {
    const isAfter3pm = hour >= 15 || hour < 2;
    if (!isAfter3pm) {
      const minsLeft = (15 - hour - 1) * 60 + (60 - new Date().getMinutes());
      showToast(`Closing opens at 3:00 PM until 2:00 AM — ${Math.floor(minsLeft/60)}h ${minsLeft%60}m remaining ⏰`, 'warn');
      return;
    }
  }
  currentShift = shift;
  const _sh=getDubaiHour(); let _sd=getDubaiDateStr();
  if(shift==='closing'&&_sh<2){const d2=getDubaiDate();d2.setDate(d2.getDate()-1);_sd=d2.getFullYear()+'-'+String(d2.getMonth()+1).padStart(2,'0')+'-'+String(d2.getDate()).padStart(2,'0');}
  const _wf=document.getElementById('fWeek'); if(_wf) _wf.textContent=_sd;
  localStorage.setItem('kic_info_'+ROLE+'_fWeek',_sd);
  document.getElementById('shiftScreen').style.display = 'none';
  renderDay();
}


function renderDay() {
  const name=getStaffName(), outlet=getOutlet();
  const container=document.getElementById('mainContent');
  if(!container) return;
  container.innerHTML='';

  const dayKey=getTodayKey();
  const data=load();
  const _doneVal = data[dayKey]?._done;
  // _done stores Dubai date string OR ISO - handle both
  const isDone = !!(_doneVal && (getDubaiDateStr() === _doneVal || getDubaiDateStr() === _doneVal.substring(0,10)));
  const _openDoneVal = data[dayKey]?._openDone;
  const openingDone = !!(_openDoneVal);
  const _closeDoneVal = data[dayKey]?._closeDone;
  const closingDone = !!(_closeDoneVal);

  // Show shift selector if no shift chosen
  if (!currentShift) {
    document.getElementById('shiftScreen').style.display='block';
    const hour=getDubaiHour();
    const closingOpen = hour>=15||hour<2;
    const closingBtn=document.getElementById('closingBtn');
    if(closingBtn) closingBtn.disabled=!closingOpen;
    const note=document.getElementById('shiftNote');
    if(note) note.textContent = closingOpen ? '' : `Closing opens at 3:00 PM until 2:00 AM`;
    document.getElementById('scoreFill').style.width='0%';
    document.getElementById('scorePct').textContent='0%';
    return;
  }
  document.getElementById('shiftScreen').style.display='none';

  // Back button
  const backBtn=document.createElement('button');
  backBtn.style.cssText='display:flex;align-items:center;gap:6px;margin:12px 16px 0;padding:6px 12px;border:1.5px solid #E0DDD4;border-radius:20px;font-size:12px;font-weight:600;color:#7B2D42;background:#fff;cursor:pointer;';
  backBtn.innerHTML='← Change Shift';
  backBtn.onclick=()=>{ currentShift=null; renderDay(); };
  container.appendChild(backBtn);

  const shiftSections = SECTIONS.filter(s=>s.shift===currentShift);
  let total=0, yes=0;

  shiftSections.forEach(section=>{
    const hdr=document.createElement('div');
    hdr.className='section-hdr';
    hdr.textContent=section.title;
    container.appendChild(hdr);

    section.tasks.forEach(task=>{
      total++;
      const val=getVal(currentDay,task.id,'yn');
      if(val==='yes') yes++;
      const photo=getVal(currentDay,task.id,'photo')||getVal(currentDay,task.id,'photoUrl');
      const comment=getVal(currentDay,task.id,'comment')||'';
      const ownerCls={'self':'ot-self','verify':'ot-verify'}[task.owner]||'ot-self';
      const isOpenSection = section.shift === 'opening';
      const isCloseSection = section.shift === 'closing';
      const sectionLocked = !ALLOW_OVERWRITE && ((isOpenSection && openingDone) || (isCloseSection && closingDone) || isDone);
      const commentDisabled = sectionLocked ? 'disabled' : '';

      // Show submitted banner at top of locked section (once)
      if (sectionLocked && ti === 0) {
        const lockBanner = document.createElement('div');
        lockBanner.style.cssText = 'background:#FEF9C3;border:1px solid #FDE68A;border-radius:8px;padding:8px 12px;margin-bottom:6px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:#92400E;';
        lockBanner.innerHTML = '🔒 This shift has been submitted and is locked. Only managers can edit via the dashboard.';
        container.appendChild(lockBanner);
      }
      const card=document.createElement('div');
      card.className='task-card'+(sectionLocked?' locked-card':'');
      card.innerHTML=`
        <div class="task-top">
          <span class="owner-tag ${ownerCls}">${task.ownerLbl}</span>
          <span class="task-text">${task.text}</span>
        </div>
        <div class="yn-row">
          <div class="yn yes ${val==='yes'?'on':''}" onclick="tapYN('${task.id}','yes',this)">✓ YES</div>
          <div class="yn no ${val==='no'?'on':''}" onclick="tapYN('${task.id}','no',this)">✗ NO</div>
          <div class="yn na ${val==='na'?'on':''}" onclick="tapYN('${task.id}','na',this)">N/A</div>
          ${task.photo?`<button class="photo-btn ${photo?'taken':''}" onclick="openPhotoModal('${task.id}')">${photo?'📷 ✓':'📷'}</button>`:''}
        </div>
        <textarea class="comment-box" rows="2" placeholder="Add comment (required for NO)..." onchange="setComment('${task.id}',this.value)">${comment}</textarea>
        ${photo&&photo.startsWith('http')?`
          <div style="margin-top:6px;display:inline-block;text-align:center;">
            <img src="${photo}" style="display:block;max-width:100px;max-height:80px;border-radius:8px;border:2px solid #22C55E;object-fit:cover;" onerror="this.parentNode.style.display='none'">
            <button onclick="removePhoto('${task.id}',0)" style="display:block;width:100%;margin-top:2px;padding:2px 6px;font-size:10px;font-weight:700;background:#FEE2E2;border:1px solid #FCA5A5;border-radius:4px;color:#B91C1C;cursor:pointer;">&#x1F5D1; Delete</button>
          </div>`:''}
      `;
      container.appendChild(card);
    });
  });

  // Score
  const pct=total>0?Math.round((yes/total)*100):0;
  document.getElementById('scoreFill').style.width=pct+'%';
  document.getElementById('scoreFill').style.background=pct>=95?'#22C55E':pct>=70?'#F59E0B':'#2E6DA4';
  document.getElementById('scorePct').textContent=pct+'%';

  // Score card — always visible
  {
    const opSections = SECTIONS.filter(s=>s.shift==='opening');
    const clSections = SECTIONS.filter(s=>s.shift==='closing');
    let oY2=0,oM2=0,cY2=0,cM2=0;
    opSections.forEach(s=>s.tasks.forEach(t=>{const v=getVal(currentDay,t.id,'yn');if(v&&v!=='na'){oM2++;if(v==='yes')oY2++;}}));
    clSections.forEach(s=>s.tasks.forEach(t=>{const v=getVal(currentDay,t.id,'yn');if(v&&v!=='na'){cM2++;if(v==='yes')cY2++;}}));
    const oPct=oM2>0?Math.round((oY2/oM2)*100):null;
    const cPct=cM2>0?Math.round((cY2/cM2)*100):null;
    // Total = all YES / all answered tasks
    const totalM=oM2+cM2, totalY=oY2+cY2;
    const totalPct=totalM>0?Math.round((totalY/totalM)*100):0;
    const totalPass=totalPct>=95;

    const sc=document.createElement('div');
    sc.className='score-card';
    sc.style.cssText='margin:12px 0;padding:12px;background:#fff;border-radius:12px;border:1px solid #E2E8F0;';
    sc.innerHTML=`
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px;">
        <div data-scorebox="opening" style="background:#EFF6FF;border-radius:10px;padding:10px 6px;text-align:center;">
          <div style="font-size:9px;font-weight:700;color:#64748B;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;">🌅 Opening</div>
          <div class="sb-pct" style="font-size:20px;font-weight:700;color:${oPct===null?'#94A3B8':oPct>=95?'#15803D':oPct>=70?'#D97706':'#B91C1C'}">${oPct!==null?oPct+'%':'—'}</div>
          <div class="sb-lbl" style="font-size:9px;color:${oPct===null?'#94A3B8':oPct>=95?'#15803D':'#B91C1C'};margin-top:2px;">${oPct===null?'Not submitted':oPct>=95?'✓ Pass':'✗ Below target'}</div>
        </div>
        <div data-scorebox="closing" style="background:#F0FDF4;border-radius:10px;padding:10px 6px;text-align:center;">
          <div style="font-size:9px;font-weight:700;color:#64748B;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;">🌙 Closing</div>
          <div class="sb-pct" style="font-size:20px;font-weight:700;color:${cPct===null?'#94A3B8':cPct>=95?'#15803D':cPct>=70?'#D97706':'#B91C1C'}">${cPct!==null?cPct+'%':'—'}</div>
          <div class="sb-lbl" style="font-size:9px;color:${cPct===null?'#94A3B8':cPct>=95?'#15803D':'#B91C1C'};margin-top:2px;">${cPct===null?'Not submitted':cPct>=95?'✓ Pass':'✗ Below target'}</div>
        </div>
        <div data-scorebox="total" style="background:${totalM===0?'#F8FAFC':totalPass?'#F0FDF4':'#FFF1F0'};border:2px solid ${totalM===0?'#E2E8F0':totalPass?'#22C55E':'#EF4444'};border-radius:10px;padding:10px 6px;text-align:center;">
          <div style="font-size:9px;font-weight:700;color:#64748B;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;">🏆 Total</div>
          <div class="sb-pct" style="font-size:20px;font-weight:700;color:${totalM===0?'#94A3B8':totalPass?'#15803D':'#B91C1C'}">${totalM>0?totalPct+'%':'—'}</div>
          <div class="sb-lbl" style="font-size:9px;color:${totalM===0?'#94A3B8':totalPass?'#15803D':'#B91C1C'};margin-top:2px;">${totalM===0?'No data':totalPass?'✓ Qualified':'✗ Not qualified'}</div>
        </div>
      </div>
    `;
    container.appendChild(sc);
  }

  // Submit button or locked message
  if(isDone&&!ALLOW_OVERWRITE) {
    const ow=document.createElement('div');
    ow.style.cssText='margin:8px 0;padding:14px;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:10px;text-align:center;';
    ow.innerHTML=`<div style="font-size:13px;font-weight:700;color:#1A3C5E;margin-bottom:6px;">🔒 Submitted — Awaiting OIC Verification</div>
      <div style="font-size:12px;color:#64748B;">OIC can verify and overwrite from the <strong>Master Dashboard</strong>.</div>`;
    container.appendChild(ow);
  } else if(!isDone) {
    const btn=document.createElement('button');
    btn.className='submit-btn';
    btn.textContent='📤 Submit '+( currentShift==='opening'?'Opening':'Closing')+' Checklist';
    btn.onclick=submitDay;
    container.appendChild(btn);
  }
}

function tapYN(tid, val, el) {
  const data=load(), dayKey=getTodayKey();
  if (!ALLOW_OVERWRITE) {
    const _shift = SECTIONS.find(s => s.tasks.some(t => t.id === tid))?.shift;
    const _openDone = data[dayKey]?._openDone;
    const _closeDone = data[dayKey]?._closeDone;
    const _done = data[dayKey]?._done;
    if (_done || (_shift === 'opening' && _openDone) || (_shift === 'closing' && _closeDone)) {
      showToast('Already submitted — cannot edit 🔒', 'error'); return;
    }
  }
  // Lock verify tasks — OIC fills via dashboard only
  const taskDef = SECTIONS.flatMap(s=>s.tasks).find(t=>t.id===tid);
  const _isSubmitted = !!(data[dayKey]?._openDone || data[dayKey]?._closeDone || data[dayKey]?._done);
  if (taskDef && taskDef.owner === 'verify' && _isSubmitted && !ALLOW_OVERWRITE) {
    showToast('Verify by OIC only — manager fills this via dashboard 🔒', 'error'); return;
  }
  setVal(currentDay,tid,'yn',val);
  el.closest('.yn-row').querySelectorAll('.yn').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  // Refresh score bar AND score boxes live
  let t=0,y=0,oY=0,oM=0,cY=0,cM=0;
  const _td = load()[getTodayKey()] || {};
  SECTIONS.forEach(s => {
    const isOpen = s.shift === 'opening';
    const isClose = s.shift === 'closing';
    s.tasks.forEach(tk => {
      const v = _td[tk.id]?.yn;
      // Only count answered tasks
      if (v && v !== 'na') {
        if (isOpen)  { oM++; if(v==='yes') oY++; }
        if (isClose) { cM++; if(v==='yes') cY++; }
        if (s.shift === currentShift) { t++; if(v==='yes') y++; }
      }
    });
  });
  const p    = t>0  ? Math.round((y/t)*100)   : 0;
  const oPct = oM>0 ? Math.round((oY/oM)*100) : null;
  const cPct = cM>0 ? Math.round((cY/cM)*100) : null;
  // Total = all YES / all answered tasks
  const tM   = oM+cM, tY = oY+cY;
  const totPct = tM>0 ? Math.round((tY/tM)*100) : 0;
  // Score bar
  document.getElementById('scoreFill').style.width = p+'%';
  document.getElementById('scoreFill').style.background = p>=95?'#22C55E':p>=70?'#F59E0B':'#2E6DA4';
  document.getElementById('scorePct').textContent = p+'%';
  // Score boxes live update
  document.querySelectorAll('[data-scorebox]').forEach(b => {
    const type = b.getAttribute('data-scorebox');
    const pct  = type==='opening'?oPct : type==='closing'?cPct : totPct;
    const isNull = pct===null;
    const pctEl = b.querySelector('.sb-pct');
    const lblEl = b.querySelector('.sb-lbl');
    if(pctEl){ pctEl.textContent=isNull?'—':pct+'%'; pctEl.style.color=isNull?'#94A3B8':pct>=95?'#15803D':pct>=70?'#D97706':'#B91C1C'; }
    if(lblEl){ lblEl.textContent=isNull?'Not submitted':pct>=95?'✓ Pass':'✗ Below target'; lblEl.style.color=isNull?'#94A3B8':pct>=95?'#15803D':'#B91C1C'; }
  });
}

function setComment(tid,val){ setVal(currentDay,tid,'comment',val); }

function submitDay() {
  const name=getStaffName(), outlet=getOutlet();
  if(!name){ showToast('Please enter your name first','warn'); return; }
  if(!outlet){ showToast('Please select your outlet first','warn'); return; }

  const shiftSections=SECTIONS.filter(s=>s.shift===currentShift);
  const unanswered=shiftSections.flatMap(s=>s.tasks).filter(t=>!getVal(currentDay,t.id,'yn'));
  if(unanswered.length){ showToast('Please answer all tasks first ('+unanswered.length+' remaining)','warn'); return; }

  // Photo check
  const hasPhotoForTask = (tid) => !!(getVal(currentDay,tid,'photo')||getVal(currentDay,tid,'photo_0')||getVal(currentDay,tid,'photoUrl'));
  const missingPhoto = shiftSections.flatMap(s=>s.tasks).filter(t=>t.photo&&!hasPhotoForTask(t.id));
  if(missingPhoto.length){ showToast('📷 Photo required for all tasks ('+missingPhoto.length+' missing)','warn'); return; }

  // NO comment check
  const missingComment=shiftSections.flatMap(s=>s.tasks).filter(t=>getVal(currentDay,t.id,'yn')==='no'&&!(getVal(currentDay,t.id,'comment')||'').trim());
  if(missingComment.length){ showToast('📝 Comment required for every NO answer','warn'); return; }

  const d=load(), dayKey=getTodayKey();
  if(!d[dayKey]) d[dayKey]={};
  d[dayKey]._done=getDubaiDateStr(); // Store Dubai date for reliable comparison
  d[dayKey]._shift=currentShift;
  save(d);

  // Calculate score
  let total=0, yes=0;
  shiftSections.forEach(s=>s.tasks.forEach(t=>{
    const v=getVal(currentDay,t.id,'yn');
    if(v&&v!=='na'){total++;if(v==='yes')yes++;}
  }));
  const pct=total>0?Math.round((yes/total)*100):0;

  // Build taskData
  const taskData={};
  const _tdNow=load()[getTodayKey()]||{};
  shiftSections.forEach(s=>s.tasks.forEach(t=>{
    const yn=_tdNow[t.id]?.yn||'';
    const comment=_tdNow[t.id]?.comment||'';
    const _allPhotos=[];
    ['photoUrl','photoUrl_1','photoUrl_2','photoUrl_3','photoUrl_4'].forEach(pk=>{
      const p=_tdNow[t.id]?.[pk]; if(p&&p.startsWith('http')&&!_allPhotos.includes(p)) _allPhotos.push(p);
    });
    const _hasLocal=['photo','photo_1','photo_2','photo_3','photo_4'].some(pk=>{const p=_tdNow[t.id]?.[pk];return p&&p.startsWith('data:');});
    taskData[`d1_${t.id}`]={day:1,section:s.title,task:t.text,owner:t.ownerLbl,yn,comment,
      photoUrl:_allPhotos[0]||'',photoUrls:_allPhotos,hasPhoto:_allPhotos.length>0||_hasLocal};
  }));

  const record={
    staffName:name, role:ROLE, roleLabel:ROLE_LABEL, outlet, week:getWeekStart(),
    verifiedBy: '', // Filled by OIC via dashboard
    shift:currentShift, day:currentDay, overallPct:pct, qualified:pct>=95,
    status: currentShift==='opening' ? 'opening_submitted' : 'closing_submitted',
    openingPct: currentShift==='opening' ? pct : null,
    closingPct: currentShift==='closing' ? pct : null,
    taskData, submittedAt:new Date().toISOString(), lastUpdated:new Date().toISOString(),
  };

  if(_db){
    const key=name.replace(/[^a-zA-Z0-9]/g,'_')+'_'+ROLE+'_'+(outlet||getOutlet()||'').replace(/[^a-zA-Z0-9]/g,'_')+'_'+getWeekStart().replace(/[^a-zA-Z0-9]/g,'_')+'_'+currentShift;
    _db.ref('submissions/'+key).set(record)
      .then(()=>showToast('Submitted ✓','ok'))
      .catch(e=>showToast('Submit failed: '+e.message,'error'));
  }

  showToast('Checklist submitted ✓','ok');
  renderDay();
}

function clearTodayData() {
  if(!confirm('Clear today\'s answers and photos?\n\nYour name and outlet will be kept.')) return;
  const d=load(),k=getTodayKey();
  if(d[k]){delete d[k];save(d);}
  currentShift=null;
  showToast('Today\'s checklist cleared ✓','ok');
  document.getElementById('shiftScreen').style.display='';
  renderDay();
}
function tryOverwrite() {
  const pin=document.getElementById('owPin')?.value?.trim();
  if(!pin){ showToast('Enter PIN','warn'); return; }
  if(checkOverwritePin(pin)){
    const d=load(), key=getTodayKey();
    if(d[key]) { delete d[key]._done; save(d); }
    showToast('Unlocked — you can now edit ✓','ok');
    renderDay();
  } else { showToast('Incorrect PIN 🔒','error'); }
}

// ── Init ─────────────────────────────────────────────────────
function removePhoto(taskId, idx) {
  if (!confirm('Remove this photo?')) return;
  const key = idx === 0 ? 'photo' : 'photo_' + idx;
  setVal(currentDay, taskId, key, '');
  setVal(currentDay, taskId, 'photoUrl', '');
  renderDay();
  showToast('Photo removed ✓', 'ok');
}

window.addEventListener('DOMContentLoaded', () => {
  // Auto-set Dubai date — locked, no user input
  const _dubaiToday = getDubaiDateStr();
  const _wf = document.getElementById('fWeek');
  if (_wf) { if (_wf.tagName === 'INPUT') _wf.value = _dubaiToday; else _wf.textContent = _dubaiToday; }
  localStorage.setItem('kic_info_' + ROLE + '_fWeek', _dubaiToday);
  // Auto-clear _done if it's from a different date (stale submission)
  try {
    const d = load();
    const todayKey = getTodayKey();
    Object.keys(d).forEach(k => {
      if (k !== todayKey && d[k] && d[k]._done) {
        // Keep old data but don't lock today's checklist
      }
    });
    // Clear stale _done — if stored date doesn't match today's Dubai date
    if (d[todayKey] && d[todayKey]._done) {
      const storedDate = d[todayKey]._done;
      const isToday = storedDate === getDubaiDateStr() || storedDate.substring(0,10) === getDubaiDateStr();
      const hasTasks = Object.keys(d[todayKey]).filter(k => !['_done','_shift','_start','_openDone','_closeDone'].includes(k)).length > 0;
      if (!isToday || !hasTasks) {
        delete d[todayKey]._done;
        delete d[todayKey]._openDone;
        delete d[todayKey]._closeDone;
        save(d);
        console.log('Cleared stale _done for', todayKey);
      }
    }
  } catch(e) {}

  ['fName','fOutlet'].forEach(id=>{
    const el=document.getElementById(id);
    if(!el) return;
    const saved=localStorage.getItem('bartender_info_'+id);
    if(saved) el.value=saved;
    el.addEventListener('input',()=>{
      localStorage.setItem('bartender_info_'+id, el.value);
      const name = document.getElementById('fName').value.trim();
      SK = name ? SK_BASE + '_' + name.replace(/[^a-zA-Z0-9]/g,'_').toLowerCase() : SK_BASE;
      renderDay();
    });
  });
  // Set SK per staff name on load
  const savedName = localStorage.getItem('bartender_info_fName') || '';
  if (savedName) SK = SK_BASE + '_' + savedName.replace(/[^a-zA-Z0-9]/g,'_').toLowerCase();
  renderDay();
});

// ── Midnight auto-reset (Dubai UTC+4) ───────────────────────
function scheduleNextMidnight() {
  const now = new Date();
  const dubaiNow = new Date(now.getTime() + (now.getTimezoneOffset()*60000) + (4*3600000));
  const next = new Date(dubaiNow); next.setHours(24,0,0,0);
  setTimeout(function() {
    const nd = getDubaiDateStr();
    const wf = document.getElementById('fWeek');
    if (wf) { if(wf.tagName==='INPUT') wf.value=nd; else wf.textContent=nd; }
    localStorage.setItem('kic_info_' + ROLE + '_fWeek', nd);
    currentShift = null; buildDayRail();
  
  // Visual lock on closing button before 3pm Dubai
  (function(){
    const _h = getDubaiHour ? getDubaiHour() : new Date().getHours();
    const _after3 = _h >= 15 || _h < 2;
    const _btnC = document.getElementById('closingBtn');
    if (_btnC && !_after3) {
      const _ml = (15-_h-1)*60+(60-new Date().getMinutes());
      _btnC.classList.add('locked');
      _btnC.title='Closing opens at 3:00 PM — '+Math.floor(_ml/60)+'h '+(_ml%60)+'m';
      _btnC.textContent='🌙 Closing (opens 3PM)';
    }
  })();
  try { renderDay(); } catch(e) {}
    showToast('📅 New day — ' + nd, 'ok');
    scheduleNextMidnight();
  }, next - dubaiNow);
}
scheduleNextMidnight();

// Warn before page refresh if checklist not submitted
window.addEventListener('beforeunload', function(e) {
  const data = load();
  const todayKey = getTodayKey();
  const isDone = !!data[todayKey]?._done;
  const hasAnswers = data[todayKey] && Object.keys(data[todayKey]).some(k => !k.startsWith('_'));
  if (hasAnswers && !isDone) {
    e.preventDefault();
    e.returnValue = 'You have unsaved progress. Your answers are saved locally but please submit before leaving.';
    return e.returnValue;
  }
});
