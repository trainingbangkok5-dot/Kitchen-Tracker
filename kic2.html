// ── Cloudinary Photo Upload ───────────────────────────────────

const CLOUDINARY_PRESET = 'culex_uploads';

async function uploadPhotoToFirebase(dataUrl, taskId, staffName, day) {
  try {
    if (!dataUrl) return null;
    const compressed = await compressToSize(dataUrl, 150);
    // Try Cloudinary first
    try {

// Retry pending photos when back online
async function retryPendingPhotos() {
  const pendingKey = 'pending_photos_' + ROLE;
  const pending = JSON.parse(localStorage.getItem(pendingKey) || '[]');
  if (!pending.length) return;
  showToast('Retrying ' + pending.length + ' pending photo(s)...', 'ok');
  const remaining = [];
  for (const p of pending) {
    try {
      const res = await fetch(p.dataUrl);
      const blob = await res.blob();
      const folder = 'culex/' + ROLE + '/' + (p.staffName||'unknown').replace(/[^a-zA-Z0-9]/g,'_');
      const fd = new FormData();
      fd.append('file', blob);
      fd.append('upload_preset', CLOUDINARY_PRESET);
      fd.append('folder', folder);
      const resp = await fetch('https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD + '/image/upload', {
        method: 'POST', body: fd
      });
      const data = await resp.json();
      if (data.secure_url) {
        console.log('Pending photo uploaded ✓');
      } else {
        remaining.push(p);
      }
    } catch(e) {
      remaining.push(p);
    }
  }
  localStorage.setItem(pendingKey, JSON.stringify(remaining));
  if (remaining.length === 0) showToast('All pending photos uploaded ✓', 'ok');
  else showToast(remaining.length + ' photo(s) still pending', 'warn');
}

// Compress image to target size in KB
function compressToSize(dataUrl, maxKB) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      // Scale down if too large
      const maxDim = 800;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = Math.round(h * maxDim/w); w = maxDim; }
        else { w = Math.round(w * maxDim/h); h = maxDim; }
      }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      // Try quality 0.7 first
      let result = canvas.toDataURL('image/jpeg', 0.7);
      if (result.length > maxKB * 1024 * 1.37) {
        result = canvas.toDataURL('image/jpeg', 0.4);
      }
      resolve(result);
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

// SHARED DATABASE — all checklists write to same localStorage key
// so master dashboard can read all submissions
// ══════════════════════════════════════════════════════════════
const SHARED_DB_KEY = 'KIC_SHARED_DB_V2';

function loadSharedDB() {
  try { return JSON.parse(localStorage.getItem(SHARED_DB_KEY)) || { submissions: [] }; }
  catch(e) { return { submissions: [] }; }
}
function saveSharedDB(db) {
  try { localStorage.setItem(SHARED_DB_KEY, JSON.stringify(db)); } catch(e) {}
}

function pushToMasterDashboard(record) {
  // record: { staffName, role, outlet, week, day, overallPct, qualified, submittedAt, verifiedBy }
  const db = loadSharedDB();
  // Find existing entry for this staff + week and update, or add new
  const idx = db.submissions.findIndex(
    s => s.staffName === record.staffName &&
         s.role === record.role &&
         s.week === record.week &&
         s.outlet === record.outlet
  );
  if (idx >= 0) {
    db.submissions[idx] = { ...db.submissions[idx], ...record };
  } else {
    db.submissions.push(record);
  }
  saveSharedDB(db);
}

// ── Cross-device Camera & Gallery ────────────────────────────
function prepareCamera() {
  const input = document.getElementById('camInput');
  if (!input) return;
  input.setAttribute('capture', 'environment');
  input.setAttribute('accept', 'image/*');
  input.value = '';
}
function prepareGallery() {
  const input = document.getElementById('galInput');
  if (!input) return;
  input.removeAttribute('capture');
  input.setAttribute('accept', 'image/*');
  input.value = '';
}
function triggerCamera() { prepareCamera(); document.getElementById('camInput')?.click(); }
function triggerGallery() { prepareGallery(); document.getElementById('galInput')?.click(); }

function iosPhotoFix(inputEl, onDataUrl) {
  inputEl.setAttribute('accept', 'image/*');
}

function compressAndReturn(file, callback) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const MAX = 600;
      let w = img.width, h = img.height;
      if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
      if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = function() { callback(ev.target.result); };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ── Day unlock logic — only unlock next day, not future days ─────────────────
function getTodayDayNumber(weekStartStr) {
  if (!weekStartStr) return 1;
  try {
    // Use local calendar date (midnight-based, not 24hr rolling)
    const now = new Date();
    const todayStr = now.getFullYear() + '-' + 
      String(now.getMonth()+1).padStart(2,'0') + '-' + 
      String(now.getDate()).padStart(2,'0');
    const today = new Date(todayStr + 'T00:00:00');
    const start = new Date(weekStartStr + 'T00:00:00');
    const diff = Math.floor((today - start) / (1000 * 60 * 60 * 24));
    return Math.min(Math.max(diff + 1, 1), 6);
  } catch(e) { return 1; }
}

function isDayUnlocked(dayNum, weekStartStr) {
  return true; // All days visible — correct day auto-selected
}

function getTodayDay(weekStartStr) {
  if (!weekStartStr) return 1;
  const start = new Date(weekStartStr + 'T00:00:00');
  const today = new Date();
  today.setHours(0,0,0,0);
  const diff = Math.floor((today - start) / 86400000);
  return Math.min(Math.max(diff + 1, 1), 6);
}

function showToast(msg, type) {
  let t = document.getElementById('_toast');
  if (!t) {
    t = document.createElement('div');
    t.id = '_toast';
    t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);padding:10px 18px;border-radius:30px;font-size:13px;font-weight:600;opacity:0;transition:all 0.3s;z-index:9999;white-space:nowrap;pointer-events:none;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.background = type === 'error' ? '#EF4444' : type === 'warn' ? '#F59E0B' : '#0F172A';
  t.style.color = '#fff';
  t.style.opacity = '1';
  t.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => {
    t.style.opacity = '0';
    t.style.transform = 'translateX(-50%) translateY(20px)';
  }, 2800);
}



// ── Auto-fill audit score for KIC's outlet ───────────────────────────────────
function getLatestAuditForOutlet(outlet) {
  if (!outlet) return null;
  try {
    const db = JSON.parse(localStorage.getItem('KIC_SHARED_DB_V2') || '{}');
    const audits = db.audits || [];
    const outletAudits = audits.filter(a =>
      a.outlet && a.outlet.trim().toLowerCase() === outlet.trim().toLowerCase()
    );
    if (outletAudits.length === 0) return null;
    // Get most recent
    return outletAudits.sort((a,b) => new Date(b.submittedAt) - new Date(a.submittedAt))[0];
  } catch(e) { return null; }
}

function showAuditBanner() {
  const outlet = document.getElementById('fOutlet')?.value?.trim();
  const audit = getLatestAuditForOutlet(outlet);
  let banner = document.getElementById('_auditBanner');
  if (!banner) {
    banner = document.createElement('div');
    banner.id = '_auditBanner';
    banner.style.cssText = 'margin:10px 16px 0;padding:10px 14px;border-radius:10px;font-size:12px;font-weight:600;';
    const content = document.getElementById('mainContent');
    if (content) content.parentNode.insertBefore(banner, content);
  }
  if (!outlet) {
    banner.style.display = 'none';
    return;
  }
  if (!audit) {
    banner.style.cssText += 'background:#FEF9C3;border:1px solid #FDE68A;color:#92400E;display:block;';
    banner.textContent = '⏳ ' + outlet + ' — No audit submitted yet (Pending)';
  } else {
    const pass = audit.score >= 80;
    banner.style.cssText += (pass
      ? 'background:#DCFCE7;border:1px solid #22C55E;color:#15803D;display:block;'
      : 'background:#FEE2E2;border:1px solid #EF4444;color:#B91C1C;display:block;');
    const d = new Date(audit.submittedAt).toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
    banner.textContent = (pass ? '✅' : '❌') + ' ' + outlet + ' ' + audit.auditType +
      ' Audit: ' + audit.score + '% (' + audit.rawScore + '/' + audit.maxScore + ' pts)' +
      ' — Auditor: ' + audit.auditor + ' — ' + d;
    // Also auto-set the auditor section task yn if score >= 80
    autoSetAuditorTask(audit.score);
  }
}

function autoSetAuditorTask(score) {
  // Find the aud1 task and auto-set it
  const val = score >= 80 ? 'yes' : 'no';
  setVal(currentDay, 'aud1', 'yn', val);
}


// ── Auto-reset: detect new week and start fresh cycle ────────
function getMonday(date) {
  const d = new Date(date);
  const day = d.getDay();
  // Sunday (0) = day 7 of current week, go back 6 days to Monday
  // Monday (1) = day 1, no change
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  d.setDate(diff);
  d.setHours(0,0,0,0);
  return d;
}


// ── Dubai Time (UTC+4) — defined first ───────────────────────
function getDubaiDate() {
  const now = new Date();
  const dubaiOffset = 4 * 60;
  const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
  return new Date(utc + (dubaiOffset * 60000));
}
function getDubaiDateStr() {
  const d = getDubaiDate();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function getDubaiHour() { return getDubaiDate().getHours(); }
// ─────────────────────────────────────────────────────────────
function getCurrentWeekStart() {
  return getDubaiDateStr(); // Always Dubai date
}

function checkAutoReset() {
  const weekField = document.getElementById('fWeek');
  if (!weekField) return;
  // Always force today's Dubai date
  const dubaiToday = getDubaiDateStr();
  weekField.value = dubaiToday;
  localStorage.setItem('kic_info_kic_fWeek', dubaiToday);
  buildDayRail();
  renderDay();
}

  try {
    const today = getDubaiDateStr();
    const d = load();
    let cleaned = false;
    Object.keys(d).forEach(key => {
      // Only remove old date-based keys older than 7 days — keep d1-d6 for compatibility
      if (/^dt\d{4}-\d{2}-\d{2}$/.test(key) && key !== 'dt' + today) {
        const diff = (new Date(today) - new Date(key.replace('dt',''))) / (1000*60*60*24);
        if (diff > 7) { delete d[key]; cleaned = true; }
      }
    });
    if (cleaned) save(d);
  } catch(e) {}
}

// ── Check Firebase reset flag ─────────────────────────────────
function checkResetFlag() {
  if (!_db) return; // Don't retry — only check when explicitly called with staff name
  const role   = ROLE;
  const outlet = (getOutlet ? getOutlet() : '') || '';
  const name   = (getStaffName ? getStaffName() : '') || '';
  // Require name and outlet before checking — avoids false resets on load
  if (!name || !outlet) return;
  // Only check specific key for this exact staff+outlet — not global role key
  const key = role + '_' + outlet.replace(/[^a-zA-Z0-9]/g,'_') + '_' + name.replace(/[^a-zA-Z0-9]/g,'_');
  _db.ref('reset_flags/' + key).once('value', snap => {
    if (!snap.exists()) return;
    const flag = snap.val();
    if (!flag || !flag.resetAt) return;
    const d = load();
    const lastCheck = d._lastResetCheck || '2000-01-01';
    if (flag.resetAt <= lastCheck) return; // Already processed
    // Clear local data
    localStorage.removeItem(SK);
    const fresh = { _lastResetCheck: flag.resetAt };
    save(fresh);
    showToast('Checklist reset by Admin ✓', 'ok');
    if (typeof renderDay === 'function') renderDay();
    if (typeof buildDayRail === 'function') buildDayRail();
  });
}
function getVal(day,tid,field) {
  const data = load();
  const dateKey = getTodayKey();
  return data[dateKey]?.[tid]?.[field] || data['d'+day]?.[tid]?.[field] || null;
}

function getValByDate(dateStr,tid,field) {
  try {
    const data = load();
    return data['dt'+dateStr]?.[tid]?.[field] || null;
  } catch(e) { return null; }
}
function setVal(day,tid,field,val) {
  const d=load();
  const key = getTodayKey(); // Use today's date as key
  if(!d[key]) d[key]={};
  if(!d[key][tid]) d[key][tid]={};
  d[key][tid][field]=val;
  save(d);
}


// ── Dubai Time (UTC+4) ────────────────────────────────────────
function getDubaiDate() {
  const now = new Date();
  const dubaiOffset = 4 * 60; // UTC+4 in minutes
  const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
  return new Date(utc + (dubaiOffset * 60000));
}
function getDubaiDateStr() {
  const d = getDubaiDate();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return y + '-' + m + '-' + dd;
}
function getDubaiHour() {
  return getDubaiDate().getHours();
}
function getWeekStart() { return document.getElementById('fWeek').value; }
function getStaffName() { return document.getElementById('fName').value.trim(); }
function getOutlet() { return document.getElementById('fOutlet').value.trim(); }
function getVerified() { return document.getElementById('fVerified').value.trim(); }

// ── Render day ────────────────────────────────────────────────
function renderDay() {
  const container = document.getElementById('mainContent');
  container.innerHTML = '';

  // Track start time for this day
  const dayKey = getTodayKey(); // Date-based key
  const dNow = load();
  if (!dNow[dayKey]) { dNow[dayKey] = {}; }
  // _start set at submit time

  const data = load();
  const isDone = !!data[dayKey]?._done;
  const weekStart = getWeekStart();
  const unlocked = isDayUnlocked(currentDay, weekStart);
  let total = 0, yes = 0;

  // All days accessible — no date lock

  SECTIONS.forEach((section, si) => {
    const hdr = document.createElement('div');
    hdr.className = 'section-hdr';
    hdr.textContent = section.title;
    container.appendChild(hdr);

    section.tasks.forEach((task, ti) => {
      total++;
      const val = getVal(currentDay, task.id, 'yn');
      if (val === 'yes') yes++;
      const photo = getVal(currentDay, task.id, 'photo');

      const card = document.createElement('div');
      card.className = 'task-card' + (isDone && !ALLOW_OVERWRITE ? ' locked-card' : '');
      if (ti === section.tasks.length - 1) card.style.borderRadius = '0 0 10px 10px';

      const ownerCls = {self:'ot-self',verify:'ot-verify',monitor:'ot-monitor',record:'ot-record',auditor:'ot-auditor'}[task.owner]||'ot-self';
      let photoHtml = '';
      if (task.photo) {
        photoHtml = `<div class="photo-row">
          <button class="photo-btn ${photo?'taken':''}" onclick="openPhotoModal('${task.id}','${task.text.substring(0,40).replace(/'/g,"")}')">
            ${photo ? '✓ Photo saved' : '📷 Tap to take photo'}
          </button>
          ${photo ? `<img class="photo-thumb" src="${photo}" alt="proof">` : ''}
        </div>`;
      }
      const cmnt = getVal(currentDay, task.id, 'comment') || '';
      card.innerHTML = `
        <div class="task-top">
          <span class="owner-tag ${ownerCls}">${task.ownerLbl}</span>
          <span class="task-text">${task.text}</span>
          ${task.translations ? '<div style="margin-top:6px;border-top:1px dashed #E2E8F0;padding-top:6px;">' + Object.entries(task.translations).map(([lang,txt]) => {
            const flags = {hi:'🇮🇳',ne:'🇳🇵',bn:'🇧🇩',ur:'🇵🇰',my:'🇲🇲',th:'🇹🇭'};
            const dir = (lang==='ur') ? 'rtl' : 'ltr';
            return '<div style="font-size:11px;color:#64748B;margin-top:3px;line-height:1.5;direction:'+dir+';text-align:'+(lang==='ur'?'right':'left')+';">'+(flags[lang]||'')+' '+txt+'</div>';
          }).join('') + '</div>' : ''}
        </div>
        <div class="yn-row">
          <div class="yn yes ${val==='yes'?'on':''}" onclick="tapYN('${task.id}','yes',this)">✓ YES</div>
          <div class="yn no ${val==='no'?'on':''}" onclick="tapYN('${task.id}','no',this)">✗ NO</div>
          <div class="yn na ${val==='na'?'on':''}" onclick="tapYN('${task.id}','na',this)">— N/A</div>
        </div>
        <textarea class="comment-field" rows="1" placeholder="Add comment (optional)..."
          onchange="setComment('${task.id}', this.value)"
          oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"
        >${cmnt}</textarea>
        ${photoHtml}`;
      container.appendChild(card);
    });
  });

  // Score
  const pct = total > 0 ? Math.round((yes/total)*100) : 0;
  document.getElementById('scoreFill').style.width = pct + '%';
  document.getElementById('scoreFill').style.background = pct>=95?'#22C55E':pct>=70?'#F59E0B':'#3B82F6';
  document.getElementById('scorePct').textContent = pct + '%';

  // Overall — only count submitted days for 6-day score
  let tY=0, tM=0;
  const allData = load();
  for (let d=1;d<=6;d++) {
    if (!allData[`d${d}`]?._done) continue; // skip unsubmitted days
    SECTIONS.forEach(s=>s.tasks.forEach(t=>{
      const v=getVal(d,t.id,'yn');
      if(v&&v!=='na'){tM++;if(v==='yes')tY++;}
    }));
  }
  const op = tM>0 ? Math.round((tY/tM)*100) : 0;
  const pass = op>=95;

  // Current day score — only answered tasks
  const curAnswered = yes > 0 || (isDone);
  const curScore = total > 0 ? Math.round((yes/total)*100) : 0;

  const sc = document.createElement('div');
  if (isDone) {
    // Show this day's score after submission
    const dayScore = total > 0 ? Math.round((yes/total)*100) : 0;
    const dayPass = dayScore >= 95;
    sc.className = `status-card ${dayPass?'pass':'fail'}`;
    sc.innerHTML = `<div class="sc-icon">${dayPass?'✅':'❌'}</div>
      <div class="sc-title">${dayPass?'Incentive Qualified!':'Keep going!'}</div>
      <div class="sc-score" style="color:${dayPass?'#15803D':'#B91C1C'}">${dayScore}%</div>
      <div class="sc-sub">Day ${currentDay} score (target: 95%)</div>`;
  } else if (yes > 0) {
    // Show live current day score while answering
    const dayPass = curScore>=95;
    sc.className = `status-card ${dayPass?'pass':'fail'}`;
    sc.innerHTML = `<div class="sc-icon">${dayPass?'✅':'❌'}</div>
      <div class="sc-title">${dayPass?'Great job!':'Keep going!'}</div>
      <div class="sc-score" style="color:${dayPass?'#15803D':'#B91C1C'}">${curScore}%</div>
      <div class="sc-sub">Day ${currentDay} score so far</div>`;
  } else {
    // No answers yet — show blank
    sc.className = 'status-card';
    sc.innerHTML = `<div class="sc-icon">📋</div>
      <div class="sc-title">Fill your checklist</div>
      <div class="sc-score" style="color:#94A3B8">0%</div>
      <div class="sc-sub">Day ${currentDay} score (target: 95%)</div>`;
  }
  container.appendChild(sc);

  // Submit button
  const btn = document.createElement('button');
  btn.className = 'submit-btn';
  if (isDone && !ALLOW_OVERWRITE) {
    btn.disabled = true;
    btn.textContent = `✓ Day ${currentDay} Submitted — Locked`;
    const msg = document.createElement('div');
    msg.className = 'synced-msg';
    msg.textContent = '✓ Submitted and synced to dashboard';
    container.appendChild(btn);
    container.appendChild(msg);
  } else if (isDone && ALLOW_OVERWRITE) {
    btn.disabled = true;
    btn.textContent = `✓ Day ${currentDay} Submitted`;
    container.appendChild(btn);
    // Overwrite panel
    const owp = document.createElement('div');
    owp.className = 'overwrite-panel';
    owp.innerHTML = `<div class="overwrite-title">🔓 Overwrite Access — Enter your role PIN</div>
      <input class="overwrite-input" id="owCode" type="password" placeholder="Enter overwrite code...">
      <button class="overwrite-btn" onclick="doOverwrite()">Unlock to Edit Day ${currentDay}</button>`;
    container.appendChild(owp);
    const msg2 = document.createElement('div');
    msg2.className = 'synced-msg';
    msg2.textContent = '✓ Submitted and synced to dashboard';
    container.appendChild(msg2);
  } else {
    btn.textContent = `Submit Day ${currentDay}`;
    btn.onclick = submitDay;
    container.appendChild(btn);
  }
}

// ── Tap YES/NO/NA ─────────────────────────────────────────────
function setComment(taskId, value) {
  setVal(currentDay, taskId, 'comment', value);
}

function tapYN(tid, val, el) {
  const data = load();
  const todayData = data[getTodayKey()] || {};
  if ((todayData._done || todayData._openDone) && !ALLOW_OVERWRITE) {
    showToast('Already submitted — cannot edit 🔒', 'error'); return;
  }
  setVal(currentDay, tid, 'yn', val);
  el.closest('.yn-row').querySelectorAll('.yn').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  // update score bar
  let t=0, y=0;
  SECTIONS.forEach(s=>s.tasks.forEach(tk=>{t++;if(getVal(currentDay,tk.id,'yn')==='yes')y++;}));
  const p=t>0?Math.round((y/t)*100):0;
  document.getElementById('scoreFill').style.width=p+'%';
  document.getElementById('scoreFill').style.background=p>=95?'#22C55E':p>=70?'#F59E0B':'#3B82F6';
  document.getElementById('scorePct').textContent=p+'%';
  // Update score card at bottom live
  const scCard = document.querySelector('.status-card');
  if (scCard) {
    const dayPass = p >= 95;
    if (y > 0) {
      scCard.className = `status-card ${dayPass?'pass':'fail'}`;
      scCard.innerHTML = '<div class="sc-icon">' + (dayPass?'✅':'❌') + '</div>'
        + '<div class="sc-title">' + (dayPass?'Great job!':'Keep going!') + '</div>'
        + '<div class="sc-score" style="color:' + (dayPass?'#15803D':'#B91C1C') + '">' + p + '%</div>'
        + '<div class="sc-sub">Today score so far</div>';
    }
  }
}


function fmtDateTime(iso) {
  if (!iso) return '—';
  try {
    const d = new Date(iso);
    const date = d.toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'});
    const time = d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:true});
    return date + ' ' + time;
  } catch(e) { return iso; }
}
function fmtTimeOnly(iso) {
  if (!iso) return '—';
  try {
    return new Date(iso).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:true});
  } catch(e) { return '—'; }
}

// ── Submit day ────────────────────────────────────────────────
function submitDay() {
  const name = getStaffName();
  if (!name) { showToast('Please enter your name first', 'warn'); document.getElementById('fName').focus(); return; }
  if (!getWeekStart()) { showToast('Please set the week starting date', 'warn'); return; }
  const d = load();
  if (!d[getTodayKey()]) d[getTodayKey()] = {};
  d[getTodayKey()]._start = new Date().toISOString();
  d[getTodayKey()]._done = new Date().toISOString();
  save(d);

  // Calc overall
  let tY=0, tM=0;
  for (let dd=1;dd<=6;dd++) {
    SECTIONS.forEach(s=>s.tasks.forEach(t=>{
      const v=getVal(dd,t.id,'yn');
      if(v&&v!=='na'){tM++;if(v==='yes')tY++;}
    }));
  }
  const op = tM>0?Math.round((tY/tM)*100):0;

  // Push to master dashboard
  const _fbRecord = {
    staffName:  name,
    role:       ROLE,
    roleLabel:  ROLE_LABEL,
    outlet:     getOutlet(),
    week:       getWeekStart(),
    verifiedBy: getVerified(),
    overallPct: op,
    qualified:  op>=95,
    day:        currentDay,
    startedAt:  d[getTodayKey()]?._start || new Date().toISOString(),
    photos: (function() {
      const photos = {};
      SECTIONS.forEach(s => s.tasks.forEach(t => {
        const url = getVal(currentDay, t.id, 'photoUrl');
        if (url) photos[t.id + '_day' + currentDay] = url;
      }));
      return photos;
    })(),
    taskData: (function() {
      const tasks = {};
      for (let dd=1; dd<=6; dd++) {
        SECTIONS.forEach(s => s.tasks.forEach(t => {
          const yn    = getVal(dd, t.id, 'yn');
          const photo = getVal(dd, t.id, 'photo'); // base64 local photo
          const pUrl  = getVal(dd, t.id, 'photoUrl'); // firebase url
          if (yn || photo || pUrl) {
            tasks[`d${dd}_${t.id}`] = {
              day: dd,
              section: s.title,
              task: t.text,
              owner: t.ownerLbl,
              yn: yn||'',
              photoUrl: pUrl || photo || '', // prefer firebase url, fall back to base64
            };
          }
        }));
      }
      return tasks;
    })(),
    submittedAt:new Date().toISOString(),
    lastUpdated:new Date().toISOString(),
  };
  pushToMasterDashboard(_fbRecord);
  pushToFirebase(_fbRecord);

  showToast(`Day ${currentDay} submitted ✓`, 'ok');
  buildDayRail();
  renderDay();
}

// ── Overwrite (KIC/Area Chef) ─────────────────────────────────
function doOverwrite() {
  const code = document.getElementById('owCode')?.value;
  if (!checkOverwritePin(code||'')) { showToast('Wrong PIN — access denied 🔒', 'error'); return; }
  const d = load();
  if (d[getTodayKey()]) delete d[getTodayKey()]._done;
  save(d);
  showToast('Day ${currentDay} unlocked — you can now edit', 'ok');
  buildDayRail();
  renderDay();
}

function handlePhotoFile(file) {
  if (!file || !activePhotoTask) return;
  const taskId = activePhotoTask;
  activePhotoTask = null;
  compressAndReturn(file, async function(dataUrl) {
    // Save locally first for instant display
    setVal(currentDay, taskId, 'photo', dataUrl);
    renderDay();
    showToast('Photo saved ✓', 'ok');

    // Save compressed photo to Firebase Realtime Database
    const staffName = getStaffName();
    if (staffName && _db) {
      const dbRef = await uploadPhotoToFirebase(dataUrl, taskId, staffName, currentDay);
      if (dbRef) {
        setVal(currentDay, taskId, 'photoUrl', dbRef);
        showToast('Photo synced ✓', 'ok');
      }
    }
  });
}
