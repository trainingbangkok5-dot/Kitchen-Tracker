const _db = firebase.database();

function pushToFirebase(record) {
  try {
    const key = (record.staffName||'unknown').replace(/[^a-zA-Z0-9]/g,'_')
              + '_' + record.role
              + '_' + (record.week||'').replace(/[^a-zA-Z0-9]/g,'_')
              + '_' + Date.now();
    _db.ref('submissions/' + key).set({
      ...record,
      lastUpdated: new Date().toISOString()
    }).then(() => {
      showToast('✓ Synced to dashboard', 'ok');
    }).catch(e => {
      console.warn('Firebase write failed:', e);
    });
  } catch(e) { console.warn('Firebase error:', e); }
}

function pushAuditToFirebase(record) {
  try {
    const key = (record.outlet||'unknown').replace(/[^a-zA-Z0-9]/g,'_')
              + '_' + record.auditType
              + '_' + (record.auditDate||'').replace(/[^a-zA-Z0-9]/g,'_');
    _db.ref('audits/' + key).set({
      ...record,
      lastUpdated: new Date().toISOString()
    }).catch(e => console.warn('Audit write failed:', e));

}

const state={};
SECTIONS.forEach(s=>s.items.forEach(it=>{state[s.id+'_'+it.n]={status:null,comment:'',photos:[]};}));

function getGrade(p){
  if(p>=91)return{g:'A',col:'#1b5e20',bg:'#e8f5e9',fill:'#2e7d32',label:'Excellent'};
  if(p>=81)return{g:'B',col:'#e65100',bg:'#fff3e0',fill:'#ef6c00',label:'Good'};
  if(p>=71)return{g:'C',col:'#bf360c',bg:'#fbe9e7',fill:'#d84315',label:'Fair/Acceptable'};
  return{g:'D',col:'#7f0000',bg:'#ffebee',fill:'#c62828',label:'Poor'};
}

/* N/A items are excluded from denominator so 100% is always achievable */
function calcScores(){
  let total=0;
  const secScores={};
  SECTIONS.forEach(s=>{
    let earned=0,max=0;
    s.items.forEach(it=>{
      const st=state[s.id+'_'+it.n];
      if(st.status!=='na'){
        max+=it.score;
        if(st.status==='pass') earned+=it.score;
      }
    });
    secScores[s.id]={earned,max};
    total+=earned;
  });
  const maxTotal=Object.values(secScores).reduce((a,v)=>a+v.max,0);
  return{total,maxTotal,secScores};
}

function updateScoreBar(){
  const{total,maxTotal,secScores}=calcScores();
  const pct=maxTotal>0?Math.round(total/maxTotal*100):0;
  const gr=getGrade(pct);
  const gb=document.getElementById('grade-badge');
  gb.textContent=gr.g;gb.style.background=gr.bg;gb.style.color=gr.col;
  document.getElementById('score-pct').textContent=pct;
  const naActive=maxTotal<ORIG_MAX;
  document.getElementById('score-raw').textContent=total+' / '+maxTotal+(naActive?' (excl. N/A)':'');
  const pf=document.getElementById('progress-fill');
  pf.style.width=pct+'%';pf.style.background=gr.fill;
  SECTIONS.forEach(s=>{
    const el=document.getElementById('sec-score-'+s.id);
    if(el)el.textContent=secScores[s.id].earned+'/'+secScores[s.id].max;
  });
}

function setStatus(secId,n,status){
  const k=secId+'_'+n;
  state[k].status=status;
  document.getElementById('card-'+k).className='item-card '+(status||'');
  ['pass','fail','na'].forEach(s=>{
    document.getElementById('btn-'+s+'-'+k).className='status-btn'+(status===s?' active-'+s:'');
  });
  updateScoreBar();
  showCorrectiveFields();
}

function setComment(secId,n,val){state[secId+'_'+n].comment=val;}

function addPhotos(secId,n,files){
  const k=secId+'_'+n;
  Array.from(files).forEach(f=>{
    const r=new FileReader();
    r.onload=e=>{state[k].photos.push(e.target.result);renderThumbs(secId,n);};
    r.readAsDataURL(f);
  });
}
function removePhoto(secId,n,idx){state[secId+'_'+n].photos.splice(idx,1);renderThumbs(secId,n);}

function renderThumbs(secId,n){
  const k=secId+'_'+n;
  const el=document.getElementById('thumbs-'+k);
  el.innerHTML='';
  state[k].photos.forEach((src,i)=>{
    const wrap=document.createElement('div');wrap.className='thumb-wrap';
    const img=document.createElement('img');img.className='thumb';img.src=src;img.title='Click to enlarge';
    img.onclick=()=>openLightbox(src);
    const del=document.createElement('button');del.className='thumb-del';del.innerHTML='x';
    del.onclick=()=>removePhoto(secId,n,i);
    wrap.appendChild(img);wrap.appendChild(del);el.appendChild(wrap);
  });
  const lbl=document.getElementById('photo-label-'+k);
  if(lbl)lbl.textContent=state[k].photos.length>0?'📷 '+state[k].photos.length+' photo(s)':'📷 Add photo';
}

function openLightbox(src){document.getElementById('lightbox-img').src=src;document.getElementById('lightbox').classList.add('open');}
function closeLightbox(){document.getElementById('lightbox').classList.remove('open');}

function showToast(msg,bg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.background=bg||'#2e7d32';t.style.color='#fff';
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3500);
}


function setCorrectiveAction(secId,n,val){
  const k=secId+'_'+n;
  if(!state[k])state[k]={status:'',score:0,comment:'',correctiveAction:'',deadline:'',responsible:'',photos:[]};
  state[k].correctiveAction=val;
}
function setDeadline(secId,n,val){
  const k=secId+'_'+n;
  if(!state[k])state[k]={status:'',score:0,comment:'',correctiveAction:'',deadline:'',responsible:'',photos:[]};
  state[k].deadline=val;
}
function setResponsible(secId,n,val){
  const k=secId+'_'+n;
  if(!state[k])state[k]={status:'',score:0,comment:'',correctiveAction:'',deadline:'',responsible:'',photos:[]};
  state[k].responsible=val;
}

function showCorrectiveFields(){
  // Show corrective fields only for FAIL items
  SECTIONS.forEach(s=>s.items.forEach(it=>{
    const k=s.id+'_'+it.n;
    const cr=document.getElementById('corrective-row-'+k);
    const dr=document.getElementById('deadline-row-'+k);
    if(cr&&dr){

function switchSection(secId){
  document.querySelectorAll('.section-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-'+secId).classList.add('active');
  SECTIONS.forEach((s,si)=>{if(s.id===secId)document.querySelectorAll('.nav-btn')[si].classList.add('active');});
  window.scrollTo({top:0,behavior:'smooth'});
}

  const auditor=document.getElementById('auditor').value||'Not specified';
  const outlet=document.getElementById('outlet').value||'Not specified';
  const auditDate=document.getElementById('audit-date').value||'Not specified';
    const{total,maxTotal,secScores}=calcScores();
  const pct=maxTotal>0?Math.round(total/maxTotal*100):0;
  const gr=getGrade(pct);
  const prog=document.getElementById('pdf-progress');
  const bar=document.getElementById('pdf-bar');
  const lbl=document.getElementById('pdf-lbl');
  prog.classList.add('open');
  function sp(p,msg){bar.style.width=p+'%';lbl.textContent=msg;}
  function hRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
  await new Promise(r=>setTimeout(r,50));
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const W=210,ML=12,CW=186;let y=0;
  function ap(){doc.addPage();y=12;}
  function cy(n){if(y+n>287)ap();}
  function sf(sz,st,c){doc.setFontSize(sz);doc.setFont('helvetica',st||'normal');doc.setTextColor(...(c||[30,30,30]));}
  function fr(x,fy,w,h,r,g,b){doc.setFillColor(r,g,b);doc.rect(x,fy,w,h,'F');}
  sp(5,'Building cover...');await new Promise(r=>setTimeout(r,10));
  fr(0,0,W,40,...hRgb('#1565c0'));
  sf(18,'bold',[255,255,255]);doc.text('Little Bangkok',ML,16);
  sf(11,'normal',[180,210,255]);doc.text('Front of House — Internal Monthly Audit Report',ML,24);
  sf(9,'normal',[150,190,255]);doc.text('Dubai Municipality Compliance Framework',ML,31);
  y=50;
  fr(ML,y,CW,24,...hRgb(gr.fill));
  sf(26,'bold',[255,255,255]);doc.text(gr.g,ML+8,y+19);
  sf(13,'bold',[255,255,255]);doc.text('Grade '+gr.g+' — '+gr.label,ML+22,y+11);
  sf(9,'normal',[255,255,255]);doc.text(pct+'% Compliance   |   '+total+' / '+maxTotal+' points'+(maxTotal<ORIG_MAX?' (excl. N/A)':''),ML+22,y+22);
  y+=30;
  const info=[['Auditor',auditor],['Outlet / Branch',outlet],['Audit Date',auditDate]];
  info.forEach(([lb,vl],i)=>{
    const ix=ML+(i%2)*(CW/2+2),iy=y+Math.floor(i/2)*12;
    fr(ix,iy,CW/2-2,12,245,245,245);
    sf(8,'bold',[120,120,120]);doc.text(lb.toUpperCase(),ix+3,iy+5);
    sf(10,'normal',[30,30,30]);doc.text(String(vl),ix+3,iy+10);
  });
  y+=30;
  sf(9,'bold',[30,30,30]);doc.text('Section Summary',ML,y);y+=6;
  fr(ML,y,CW,7,50,50,50);
  sf(8,'bold',[255,255,255]);doc.text('Section',ML+2,y+5);doc.text('Score',ML+CW-42,y+5);doc.text('Max',ML+CW-28,y+5);doc.text('%',ML+CW-12,y+5);
  y+=7;
  SECTIONS.forEach((s,si)=>{
    const ss=secScores[s.id];const sp2=ss.max>0?Math.round(ss.earned/ss.max*100):0;
    fr(ML,y,CW,6,...(si%2===0?[255,255,255]:[248,248,248]));
    sf(8,'normal',[30,30,30]);doc.text((si+1)+'. '+s.title.substring(0,38),ML+2,y+5);
    doc.text(''+ss.earned,ML+CW-42,y+5);doc.text(''+ss.max,ML+CW-28,y+5);
    const sc=sp2>=91?[30,120,30]:sp2>=71?[180,80,0]:[180,30,30];
    sf(8,'bold',sc);doc.text(sp2+'%',ML+CW-12,y+4);y+=6;
  });
  fr(ML,y,CW,8,30,30,30);
  sf(9,'bold',[255,255,255]);doc.text('TOTAL: '+total+' / '+maxTotal+'  ('+pct+'%)  Grade: '+gr.g,ML+2,y+5.5);y+=12;
  const fails=[];
  SECTIONS.forEach(s=>s.items.forEach(it=>{const k=s.id+'_'+it.n;if(state[k].status==='fail')fails.push({section:s.title,item:it,data:state[k]});}));
  if(fails.length){
    cy(12);sf(9,'bold',[180,30,30]);doc.text('Failed Items Requiring Corrective Action ('+fails.length+')',ML,y);y+=6;
    fails.forEach(fi=>{
      cy(14);fr(ML,y,3,10,180,30,30);fr(ML+3,y,CW-3,10,255,235,235);
      sf(8,'bold',[120,0,0]);doc.text(fi.section+' — '+fi.item.label,ML+6,y+4);
      sf(7,'normal',[160,40,40]);const cl=doc.splitTextToSize(fi.data.comment||'No comment',CW-10);doc.text(cl[0],ML+6,y+8);
      if(fi.data.photos.length){sf(7,'normal',[80,80,200]);doc.text('📷 '+fi.data.photos.length+' photo(s)',ML+CW-28,y+8);}
      y+=9;
    });
  }
  for(let si=0;si<SECTIONS.length;si++){
    const s=SECTIONS[si];
    sp(10+Math.round(si/SECTIONS.length*80),'Section '+(si+1)+'/'+SECTIONS.length+'...');
    await new Promise(r=>setTimeout(r,10));
    ap();
    fr(0,0,W,12,...hRgb('#1565c0'));
    sf(9,'bold',[255,255,255]);doc.text('Section '+(si+1)+': '+s.title,ML,8);
    const ss=secScores[s.id];const sp2=ss.max>0?Math.round(ss.earned/ss.max*100):0;
    doc.text('Score: '+ss.earned+'/'+ss.max+' ('+sp2+'%)',W-14-40,8);
    y=16;
    for(const it of s.items){
      const k=s.id+'_'+it.n;const st=state[k];
      const sLabel=st.status==='pass'?'PASS':st.status==='fail'?'FAIL':st.status==='na'?'N/A':'—';
      const sColor=st.status==='pass'?[30,120,30]:st.status==='fail'?[180,30,30]:[100,100,100];
      const rowBg=st.status==='pass'?[240,255,240]:st.status==='fail'?[255,240,240]:[250,250,250];
      const hasC=st.comment&&st.comment.trim();
      const cLines=hasC?doc.splitTextToSize(st.comment,CW-30):[];
      const dL=doc.splitTextToSize(it.desc,CW-40);
      const dShow=dL.slice(0,3);
      const descH=dShow.length*4;
      const pH=st.photos.length>0?Math.ceil(st.photos.length/4)*38+4:0;
      const iH=6+descH+(hasC?cLines.length*4+3:0)+pH+4;
      cy(iH+2);
      fr(ML,y,CW,iH,...rowBg);
      doc.setFillColor(...sColor);doc.rect(ML,y,16,iH,'F');
      sf(7,'bold',[255,255,255]);doc.text(sLabel,ML+1.5,y+iH/2+2.5);
      sf(8,'bold',[20,20,20]);doc.text(it.n+'. '+it.label,ML+19,y+5);
      sf(7,'normal',[80,80,80]);doc.text(dShow,ML+19,y+10);
      sf(7,'bold',[100,100,100]);doc.text('Max: '+it.score+'pt'+(it.score>1?'s':''),ML+CW-14,y+5);
      let iy=y+10+descH+2;
      if(hasC){sf(7,'normal',[60,60,160]);doc.text('Comment: ',ML+19,iy);sf(7,'normal',[40,40,40]);doc.text(cLines,ML+40,iy);iy+=cLines.length*4+2;}
      if(st.photos.length>0){
        sf(7,'bold',[40,40,180]);doc.text('Photos ('+st.photos.length+'):',ML+19,iy+4);iy+=6;
        const pw=34,ph=32,gap=2;let px=ML+19;
        for(let pi=0;pi<st.photos.length;pi++){
          if(pi>0&&pi%4===0){px=ML+19;iy+=ph+gap;}
          try{doc.addImage(st.photos[pi],'JPEG',px,iy,pw,ph,'','FAST');}catch(e){fr(px,iy,pw,ph,200,200,200);}
          px+=pw+gap;
        }
        iy+=ph+4;
      }
      y+=iH+1;
    }
    cy(8);fr(ML,y,CW,7,235,235,235);
    sf(8,'bold',[60,60,60]);doc.text('Section Total: '+ss.earned+' / '+ss.max+'  ('+sp2+'%)',ML+2,y+4.5);y+=8;
  }
  sp(95,'Adding page numbers...');await new Promise(r=>setTimeout(r,10));
  const pages=doc.internal.getNumberOfPages();
  for(let i=1;i<=pages;i++){
    doc.setPage(i);sf(7,'normal',[180,180,180]);
    doc.text('Little Bangkok FOH Audit  |  Page '+i+' of '+pages+'  |  '+auditor+'  |  '+auditDate,W/2,292,{align:'center'});
  }
  const ds=(auditDate||'').replace(/-/g,'');
  const os=outlet!=='Not specified'?'_'+outlet.replace(/\s+/g,'_'):'';
  doc.save('LittleBangkok_FOH_Audit'+(ds?'_'+ds:'')+os+'.pdf');
  prog.classList.remove('open');bar.style.width='0%';
  showToast('✔ PDF downloaded with all photos!','#b71c1c');
}

/* ── SAVE / LOAD ─────────────────────────────────────────── */
const SAVE_KEY = (function(){
  const t=document.title||'audit';
  return 'audit_save_'+t.replace(/[^a-zA-Z0-9]/g,'_').toLowerCase();
})();

function saveAudit(){
  const payload={
    state: state,
    auditor: document.getElementById('auditor').value,
    outlet: (document.getElementById('outlet')||document.getElementById('location')||{value:''}).value,
    date: document.getElementById('audit-date').value,
    
    savedAt: new Date().toISOString()
  };
  // Photos are already base64 in state — save all
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify(payload));
    const t=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    showToast('✔ Audit saved at '+t+' — data will be here when you reopen this file!','#283593');
    document.getElementById('last-saved-label').textContent='Last saved: '+t;
  } catch(e){
    showToast('⚠ Could not save — file may be too large (too many photos). Try removing some photos.','#c62828');
  }
}

function loadAudit(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return;
    const payload=JSON.parse(raw);
    // Restore form fields
    if(payload.auditor) document.getElementById('auditor').value=payload.auditor;
    const outletEl=document.getElementById('outlet')||document.getElementById('location');
    if(outletEl&&payload.outlet) outletEl.value=payload.outlet;
    if(payload.date) document.getElementById('audit-date').value=payload.date;
    
    // Restore state
    if(payload.state){
      Object.keys(payload.state).forEach(k=>{
        if(state[k]!==undefined){
          state[k].status = payload.state[k].status||null;
          state[k].comment = payload.state[k].comment||'';
          state[k].photos = payload.state[k].photos||[];
          state[k].correctiveAction = payload.state[k].correctiveAction||'';
          state[k].deadline = payload.state[k].deadline||'';
          state[k].responsible = payload.state[k].responsible||'';
        }
      });
    }
    // Re-render all cards
    SECTIONS.forEach(s=>s.items.forEach(it=>{
      const k=s.id+'_'+it.n;
      if(state[k]&&state[k].status!==null){
        setStatus(s.id,it.n,state[k].status);
      }
      if(state[k]&&state[k].comment){
        const inp=document.querySelector('#card-'+k+' .comment-input');
        if(inp) inp.value=state[k].comment;
      }
      if(state[k]&&state[k].correctiveAction){
        const ca=document.querySelector('#corrective-row-'+k+' .corrective-input');
        if(ca) ca.value=state[k].correctiveAction;
      }
      if(state[k]&&state[k].deadline){
        const dl=document.getElementById('deadline-'+k);
        if(dl) dl.value=state[k].deadline;
      }
      if(state[k]&&state[k].responsible){
        const rs=document.querySelector('#deadline-row-'+k+' .responsible-input');
        if(rs) rs.value=state[k].responsible;
      }
      if(state[k]&&state[k].photos&&state[k].photos.length>0){
        renderThumbs(s.id,it.n);
      }
    }));
    updateScoreBar();
    const t=new Date(payload.savedAt).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
    document.getElementById('last-saved-label').textContent='Restored: '+t;
    showToast('✔ Previous audit restored!','#2e7d32');
  } catch(e){
    console.log('No saved data or load error:', e);
  }
}

function clearSave(){
  if(!confirm('Are you sure you want to clear all saved data and start fresh?')) return;
  localStorage.removeItem(SAVE_KEY);
  location.reload();
}


// ── Submit audit to shared dashboard ─────────────────────────────────────────
function submitAuditToDashboard() {
  const {total, maxTotal} = calcScores();
  const pct = maxTotal > 0 ? Math.round((total / maxTotal) * 100) : 0;
  const auditor  = document.getElementById('auditor')?.value || '—';
  const outlet   = (document.getElementById('outlet') || document.getElementById('location') || {value:''}).value || ''; if(!outlet){ showToast('⚠ Please select an outlet before submitting!','#c62828'); return; }
  const auditDate= document.getElementById('audit-date')?.value || new Date().toISOString().split('T')[0];
    const title    = document.title || '';
  const auditType= title.toLowerCase().includes('foh') ? 'FOH' : 'BOH';
  const outletKey= outlet.trim().toLowerCase().replace(/\s+/g,'_');

  try {
    const db = JSON.parse(localStorage.getItem('KIC_SHARED_DB_V2') || '{"submissions":[],"audits":[]}');
    if (!db.audits) db.audits = [];

    // Remove old audit for same outlet+type
    db.audits = db.audits.filter(a => !(a.outlet === outlet && a.auditType === auditType));

    db.audits.push({
      outlet,
      auditType,
      score: pct,
      rawScore: total,
      maxScore: maxTotal,
      auditor,
      auditDate,
      submittedAt: new Date().toISOString()
    });

    localStorage.setItem('KIC_SHARED_DB_V2', JSON.stringify(db));
    // Collect all photos from audit items
    const photos = {};
    document.querySelectorAll('.thumb').forEach((img, i) => {
      if (img.src && img.src.startsWith('data:')) {
        photos['photo_' + i] = img.src;
      }
    });
    
    // Collect corrective actions for failed items
    const correctiveActions = [];
    SECTIONS.forEach(s=>s.items.forEach(it=>{
      const k=s.id+'_'+it.n;
      if(state[k].status==='fail'){
        correctiveActions.push({
          section: s.title, item: it.n, criteria: it.label,
          observation: state[k].comment||'',
          correctiveAction: state[k].correctiveAction||'',
          responsible: state[k].responsible||'',
          deadline: state[k].deadline||'',
        });
      }
    }));
    pushAuditToFirebase({outlet, auditType, score:pct, rawScore:total, maxScore:maxTotal, auditor, auditDate, submittedAt:new Date().toISOString(), photos, correctiveActions, outletKey: outlet.replace(/\s+/g,'_').toLowerCase()});
    showToast('✅ Audit submitted! Score: ' + pct + '% — KIC dashboard updated', '#2e7d32');
    console.log('Audit submitted to Firebase:', {outlet, auditType, score:pct});
  } catch(e) {
    showToast('⚠ Could not submit to dashboard: ' + e.message, '#c62828');
  }
}

buildUI();
loadAudit();
updateScoreBar();
showCorrectiveFields();
if(!document.getElementById('audit-date').value){
  document.getElementById('audit-date').valueAsDate=new Date();
}
</script>
