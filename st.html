// Update photo ref in existing Firebase submission after async upload completes
async function updatePhotoInSubmission(staffName, taskId, dbRef) {
  if (!_db || !staffName) return;
  try {
    const snap = await _db.ref('submissions').orderByChild('staffName').equalTo(staffName).limitToLast(5).once('value');
    if (!snap.exists()) return;
    const updates = {};
    snap.forEach(child => {
      const sub = child.val();
      if (sub.role === ROLE && sub.week === getWeekStart() && sub.taskData) {
        Object.keys(sub.taskData).forEach(k => {
          if (k.endsWith('_' + taskId)) {
            updates['submissions/' + child.key + '/taskData/' + k + '/photoUrl'] = dbRef;
          }
        });
      }
    });
    if (Object.keys(updates).length > 0) {
      await _db.ref().update(updates);
    }
  } catch(e) { console.warn('updatePhotoInSubmission failed:', e); }
}

// Init Firebase
let _db = null;
function initFirebase() {
  try {
    if (typeof firebase === 'undefined') { setTimeout(initFirebase, 100); return; }
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    _db = firebase.database();
  } catch(e) { console.error('Firebase init error:', e); }
}
initFirebase();

function pushToFirebase(record) {
  if (!_db) { setTimeout(()=>pushToFirebase(record), 500); return; }
  try {
    const key = (record.staffName||'unknown').replace(/[^a-zA-Z0-9]/g,'_')
              + '_' + record.role
              + '_' + (record.week||'').replace(/[^a-zA-Z0-9]/g,'_')
              + (record.day ? '_d' + record.day : '');
    const cleanRecord = { ...record };
    if (cleanRecord.taskData) {
      const cleanTasks = {};
      Object.entries(cleanRecord.taskData).forEach(([k, t]) => {
        cleanTasks[k] = { ...t };
        if (cleanTasks[k].photoUrl && cleanTasks[k].photoUrl.startsWith('data:')) {
          cleanTasks[k].photoUrl = '';
        }
      });
      cleanRecord.taskData = cleanTasks;
    }
    _db.ref('submissions/' + key).set({
      ...cleanRecord,
      lastUpdated: new Date().toISOString()
    }).then(() => {
      showToast('✓ Synced to dashboard', 'ok');
    }).catch(e => {
      console.warn('Firebase write failed:', e);
      showToast('⚠ Sync failed: ' + e.message, 'error');
    });
  } catch(e) {
    console.warn('Firebase error:', e);
    showToast('⚠ Firebase error: ' + e.message, 'error');
  }
}


const CLOUDINARY_CLOUD = 'db94rgiil';
const CLOUDINARY_PRESET = 'culex_uploads';

async function uploadPhotoToFirebase(dataUrl, taskId, staffName, day) {
  try {
    if (!dataUrl) return null;
    const compressed = await compressToSize(dataUrl, 150);
    // Try Cloudinary first
    try {
      const res = await fetch(compressed);
      const blob = await res.blob();
      const folder = 'culex/' + ROLE + '/' + (staffName||'unknown').replace(/[^a-zA-Z0-9]/g,'_');
      const fd = new FormData();
      fd.append('file', blob);
      fd.append('upload_preset', CLOUDINARY_PRESET);
      fd.append('folder', folder);
      const resp = await fetch('https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD + '/image/upload', {
        method: 'POST', body: fd
      });
      const data = await resp.json();
      if (data.secure_url) {
        console.log('Photo uploaded to Cloudinary ✓');
        return data.secure_url;
      }
    } catch(cloudErr) {
      console.warn('Cloudinary unavailable, saving locally:', cloudErr);
    }
    // Fallback — save base64 locally, queue for retry
    showToast('Cloud unavailable — photo saved locally 📱', 'warn');
    const pendingKey = 'pending_photos_' + ROLE;
    const pending = JSON.parse(localStorage.getItem(pendingKey) || '[]');
    const photoEntry = {
      dataUrl: compressed,
      taskId, staffName, day,
      savedAt: new Date().toISOString()
    };
    pending.push(photoEntry);
    localStorage.setItem(pendingKey, JSON.stringify(pending));
    // Return compressed base64 as fallback so photo shows immediately
    return compressed;
  } catch(e) {
    console.warn('Photo save failed completely:', e);
    return null;
  }
}

// Retry pending photos when back online
async function retryPendingPhotos() {
  const pendingKey = 'pending_photos_' + ROLE;
  const pending = JSON.parse(localStorage.getItem(pendingKey) || '[]');
  if (!pending.length) return;
  showToast('Retrying ' + pending.length + ' pending photo(s)...', 'ok');
  const remaining = [];
  for (const p of pending) {
    try {
      const res = await fetch(p.dataUrl);
      const blob = await res.blob();
      const folder = 'culex/' + ROLE + '/' + (p.staffName||'unknown').replace(/[^a-zA-Z0-9]/g,'_');
      const fd = new FormData();
      fd.append('file', blob);
      fd.append('upload_preset', CLOUDINARY_PRESET);
      fd.append('folder', folder);
      const resp = await fetch('https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD + '/image/upload', {
        method: 'POST', body: fd
      });
      const data = await resp.json();
      if (data.secure_url) {
        console.log('Pending photo uploaded ✓');
      } else {
        remaining.push(p);
      }
    } catch(e) {
      remaining.push(p);
    }
  }
  localStorage.setItem(pendingKey, JSON.stringify(remaining));
  if (remaining.length === 0) showToast('All pending photos uploaded ✓', 'ok');
  else showToast(remaining.length + ' photo(s) still pending', 'warn');
}

// Auto-retry when online
window.addEventListener('online', retryPendingPhotos);

// Get the predictable db: photo ref for a task (matches uploadPhotoToFirebase key)
function getPhotoDbRef(staffName, day, taskId) {
  const key = (staffName||'unknown').replace(/[^a-zA-Z0-9]/g,'_')
            + '_' + ROLE + '_'
            + (getWeekStart()||'').replace(/[^a-zA-Z0-9]/g,'_');
  return 'db:' + key + '/d' + day + '_' + taskId;
}

function compressToSize(dataUrl, maxKB) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      const maxDim = 800;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = Math.round(h * maxDim/w); w = maxDim; }
        else { w = Math.round(w * maxDim/h); h = maxDim; }
      }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      let result = canvas.toDataURL('image/jpeg', 0.7);
      if (result.length > maxKB * 1024 * 1.37) result = canvas.toDataURL('image/jpeg', 0.4);
      resolve(result);
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

function pushAuditToFirebase(record) {

}


// ══════════════════════════════════════════════════════════════
// SHARED DATABASE — all checklists write to same localStorage key
// so master dashboard can read all submissions
// ══════════════════════════════════════════════════════════════
const SHARED_DB_KEY = 'KIC_SHARED_DB_V2';

function loadSharedDB() {
  try { return JSON.parse(localStorage.getItem(SHARED_DB_KEY)) || { submissions: [] }; }
  catch(e) { return { submissions: [] }; }
}
function saveSharedDB(db) {
  try { localStorage.setItem(SHARED_DB_KEY, JSON.stringify(db)); } catch(e) {}
}

function pushToMasterDashboard(record) {
  // record: { staffName, role, outlet, week, day, overallPct, qualified, submittedAt, verifiedBy }
  const db = loadSharedDB();
  // Find existing entry for this staff + week and update, or add new
  const idx = db.submissions.findIndex(
    s => s.staffName === record.staffName &&
         s.role === record.role &&
         s.week === record.week &&
         s.outlet === record.outlet
  );
  if (idx >= 0) {
    db.submissions[idx] = { ...db.submissions[idx], ...record };
  } else {
    db.submissions.push(record);
  }
  saveSharedDB(db);
}

function compressAndReturn(file, callback) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const MAX = 600;
      let w = img.width, h = img.height;
      if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
      if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = function() { callback(ev.target.result); };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ── Day unlock logic — only unlock next day, not future days ─────────────────
function getTodayDayNumber(weekStartStr) {
  if (!weekStartStr) return 1;
  try {
    // Use local calendar date (midnight-based, not 24hr rolling)
    const now = new Date();
    const todayStr = now.getFullYear() + '-' + 
      String(now.getMonth()+1).padStart(2,'0') + '-' + 
      String(now.getDate()).padStart(2,'0');
    const today = new Date(todayStr + 'T00:00:00');
    const start = new Date(weekStartStr + 'T00:00:00');
    const diff = Math.floor((today - start) / (1000 * 60 * 60 * 24));
    return Math.min(Math.max(diff + 1, 1), 6);
  } catch(e) { return 1; }
}

function isDayUnlocked(dayNum, weekStartStr) {
  if (!weekStartStr) return dayNum === 1;
  return dayNum <= getTodayDayNumber(weekStartStr);
}

function showToast(msg, type) {
  let t = document.getElementById('_toast');
  if (!t) {
    t = document.createElement('div');
    t.id = '_toast';
    t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);padding:10px 18px;border-radius:30px;font-size:13px;font-weight:600;opacity:0;transition:all 0.3s;z-index:9999;white-space:nowrap;pointer-events:none;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.background = type === 'error' ? '#EF4444' : type === 'warn' ? '#F59E0B' : '#0F172A';
  t.style.color = '#fff';
  t.style.opacity = '1';
  t.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => {
    t.style.opacity = '0';
    t.style.transform = 'translateX(-50%) translateY(20px)';
  }, 2800);
}



// ── Auto-reset: detect new week and start fresh cycle ────────
function getMonday(date) {
  const d = new Date(date);
  const day = d.getDay();
  // Sunday (0) = day 7 of current week, go back 6 days to Monday
  // Monday (1) = day 1, no change
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  d.setDate(diff);
  d.setHours(0,0,0,0);
  return d;
}

    const now = new Date();
    const hourNow = getDubaiHour();
    const isAfter3pm = hourNow >= 15 || hourNow < 2;
    if (!isAfter3pm) {
      const minsLeft = (15 - hourNow - 1) * 60 + (60 - now.getMinutes());
      showToast(`Closing opens at 3:00 PM until 2:00 AM — ${Math.floor(minsLeft/60)}h ${minsLeft%60}m remaining ⏰`, 'warn');
      return;
    }
  }
  currentShift = shift;
  window._selectShiftReady = null;
  window._pendingShift = null;
  const btnO = document.getElementById('btnOpenShift');
  const btnC = document.getElementById('btnCloseShift');
  if (btnO) btnO.style.cssText = shift==='opening'
    ? 'flex:1;padding:8px;border-radius:8px;border:2px solid #fff;background:rgba(255,255,255,0.9);color:#1A4731;font-size:12px;font-weight:700;cursor:pointer;'
    : 'flex:1;padding:8px;border-radius:8px;border:2px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.1);color:#fff;font-size:12px;font-weight:700;cursor:pointer;';
  if (btnC) btnC.style.cssText = shift==='closing'
    ? 'flex:1;padding:8px;border-radius:8px;border:2px solid #22C55E;background:rgba(34,197,94,0.25);color:#fff;font-size:12px;font-weight:700;cursor:pointer;'
    : 'flex:1;padding:8px;border-radius:8px;border:2px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.1);color:#fff;font-size:12px;font-weight:700;cursor:pointer;';
  renderDay();
}

// ── Render day ────────────────────────────────────────────────
function renderDay() {
  const container = document.getElementById('mainContent');
  container.innerHTML = '';

  // Track start time for this day
  const dayKey = getTodayKey(); // Date-based key
  const dNow = load();
  if (!dNow[dayKey]) { dNow[dayKey] = {}; }
  // _start set at submit time

  const data = load();
  const isDone = !!data[dayKey]?._closeDone || !!data[dayKey]?._done;
  const openingDone2 = !!data[dayKey]?._openDone;
  const closingDone  = !!data[dayKey]?._closeDone;
  const weekStart = getWeekStart();
  const unlocked  = !weekStart || isDayUnlocked(currentDay, weekStart);
  let total = 0, yes = 0;

  if (!unlocked) {
    const locked = document.createElement('div');
    locked.className = 'locked-msg';
    locked.textContent = `🔒 Day ${currentDay} is not available yet. It will unlock on the correct date.`;
    container.appendChild(locked);
    return;
  }

  // Show shift picker if no shift selected
  if (!currentShift) {
    const nowH = getDubaiHour();
    const isAfter3pm = nowH >= 15 || nowH < 2;
    const openerName = data[dayKey]?._openerName || '';
    let closingBtnStyle, closingBtnLabel, closingSubNote;
    if (closingDone) {
      closingBtnStyle='background:linear-gradient(135deg,#1A4731,#16A34A);color:#fff;cursor:pointer;';
      closingBtnLabel='🌙 Closing Shift ✓'; closingSubNote='';
    } else if (isAfter3pm) {
      closingBtnStyle='background:linear-gradient(135deg,#1A4731,#16A34A);color:#fff;cursor:pointer;';
      closingBtnLabel='🌙 Closing Shift';
      closingSubNote='<div style="font-size:11px;color:#15803D;margin-top:4px;">✓ Available now</div>';
    } else {
      const minsLeft = (15 - nowH - 1) * 60 + (60 - new Date().getMinutes());
      closingBtnStyle='background:#E2E8F0;color:#94A3B8;cursor:not-allowed;';
      closingBtnLabel='🌙 Closing Shift ⏰';
      closingSubNote=`<div style="font-size:11px;color:#94A3B8;margin-top:4px;">Opens at 3:00 PM until 2:00 AM — ${Math.floor(minsLeft/60)}h ${minsLeft%60}m remaining</div>`;
    }
    const screen = document.createElement('div');
    screen.style.cssText='padding:24px 16px;text-align:center;';
    screen.innerHTML=`
      <div style="font-size:32px;margin-bottom:8px;">👋</div>
      <h2 style="font-size:16px;font-weight:700;color:#1A4731;margin-bottom:6px;">Which shift are you on?</h2>
      <p style="font-size:13px;color:#64748B;margin-bottom:20px;">Tap your shift to load the correct tasks</p>
      <button onclick="selectShift('opening')" style="display:block;width:100%;padding:18px;border-radius:14px;border:none;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:12px;background:linear-gradient(135deg,#1A4731,#16A34A);color:#fff;">
        🌅 Opening Shift ${openingDone2 ? '✓' : ''}
      </button>
      <button onclick="selectShift('closing')" style="display:block;width:100%;padding:18px;border-radius:14px;border:none;font-size:15px;font-weight:700;margin-bottom:4px;${closingBtnStyle}">
        ${closingBtnLabel}
      </button>
      ${closingSubNote}
      ${openerName ? `<p style="font-size:11px;color:#64748B;margin-top:12px;">Opening submitted by <b>${openerName}</b></p>` : ''}
    `;
    container.appendChild(screen);
    return;
  }

  SECTIONS.forEach((section, si) => {
    const isOpenSection  = si === 0;
    const isCloseSection = si === 1;
    if (currentShift === 'opening' && isCloseSection) return;
    // Closing shift: only show closing tasks
    if (currentShift === 'closing' && isOpenSection) return;

    const hdr = document.createElement('div');
    hdr.className = 'section-hdr';
    hdr.innerHTML = section.title + (currentShift==='closing' && isOpenSection
      ? ' <span style="font-size:10px;background:rgba(255,255,255,0.2);padding:1px 7px;border-radius:10px;margin-left:6px;">READ ONLY</span>' : '');
    container.appendChild(hdr);

    const openingSubmitted = !!data[dayKey]?._openDone;
    const closingSubmitted = !!data[dayKey]?._closeDone;
    const sectionReadOnly  = currentShift==='closing' && isOpenSection;

    section.tasks.forEach((task, ti) => {
      const sectionLocked = (isOpenSection && openingSubmitted && !ALLOW_OVERWRITE) || sectionReadOnly
                          || (isCloseSection && closingSubmitted && !ALLOW_OVERWRITE);
      total++;
      const val = getVal(currentDay, task.id, 'yn');
      if (val === 'yes') yes++;
      const photo = getVal(currentDay, task.id, 'photo');

      const card = document.createElement('div');
      card.className = 'task-card' + (sectionLocked ? ' locked-card' : '');
      if (ti === section.tasks.length - 1) card.style.borderRadius = '0 0 10px 10px';

      const ownerCls = {self:'ot-self',verify:'ot-verify',monitor:'ot-monitor',record:'ot-record',auditor:'ot-auditor'}[task.owner]||'ot-self';
      let photoHtml = '';
      if (task.photo) {
        const photos = [];
        const seenUrls = new Set();
        const legacyPhoto = getVal(currentDay, task.id, 'photo');
        if (legacyPhoto && !seenUrls.has(legacyPhoto)) { seenUrls.add(legacyPhoto); photos.push(legacyPhoto); }
        for (let pi = 1; pi < 5; pi++) {
          const p = getVal(currentDay, task.id, 'photo_' + pi);
          if (p && !seenUrls.has(p)) { seenUrls.add(p); photos.push(p); }
        }
        const thumbsHtml = photos.map((p,i) => `<img class="photo-thumb" src="${p}" alt="proof" style="cursor:pointer;" onclick="removePhoto('${task.id}',${i})">`).join('');
        photoHtml = `<div class="photo-row" style="flex-wrap:wrap;">
          <button class="photo-btn ${photos.length>0?'taken':''}" onclick="openPhotoModal('${task.id}','${task.text.substring(0,40).replace(/'/g,"")}')">
            ${photos.length>0 ? '📷 '+photos.length+' photo'+(photos.length>1?'s':'')+' saved  +add' : '📷 Tap to take photo'}
          </button>
          ${thumbsHtml}
        </div>`;
      }
      const comment = getVal(currentDay, task.id, 'comment') || '';
      const commentDisabled = sectionLocked ? 'disabled' : '';
      card.innerHTML = `
        <div class="task-top">
          <span class="owner-tag ${ownerCls}">${task.ownerLbl}</span>
          <span class="task-text">${task.text}</span>
          ${task.translations ? '<div style="margin-top:6px;border-top:1px dashed #E2E8F0;padding-top:6px;">' + Object.entries(task.translations).map(([lang,txt]) => {
            const flags = {hi:'🇮🇳',ne:'🇳🇵',bn:'🇧🇩',ur:'🇵🇰',my:'🇲🇲',th:'🇹🇭'};
            const dir = (lang==='ur') ? 'rtl' : 'ltr';
            return '<div style="font-size:11px;color:#64748B;margin-top:3px;line-height:1.5;direction:'+dir+';text-align:'+(lang==='ur'?'right':'left')+';">'+(flags[lang]||'')+' '+txt+'</div>';
          }).join('') + '</div>' : ''}
        </div>
        <div class="yn-row">
          <div class="yn yes ${val==='yes'?'on':''}" onclick="tapYN('${task.id}','yes',this)">✓ YES</div>
          <div class="yn no ${val==='no'?'on':''}" onclick="tapYN('${task.id}','no',this)">✗ NO</div>
          <div class="yn na ${val==='na'?'on':''}" onclick="tapYN('${task.id}','na',this)">— N/A</div>
        </div>
        <textarea class="comment-field" rows="1" placeholder="Add comment (optional)..." ${commentDisabled}
          onchange="setComment('${task.id}', this.value)"
          oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"
        >${comment}</textarea>
        ${photoHtml}`;
      container.appendChild(card);
    });

    // Submit Opening button
    if (isOpenSection && currentShift === 'opening') {
      const openDoneFlag = !!data[dayKey]?._openDone;
      const wasOverwritten = !!data[dayKey]?._overwritten;
      if (!openDoneFlag) {
        const openBtn = document.createElement('button');
        openBtn.className = 'submit-btn';
        openBtn.style.cssText = 'margin:10px 0;background:#16A34A;';
        openBtn.textContent = wasOverwritten ? '💾 Resubmit Opening Tasks ✓' : 'Submit Opening Tasks ✓';
        openBtn.onclick = submitOpening;
        container.appendChild(openBtn);
      } else {
        const openDoneMsg = document.createElement('div');
        openDoneMsg.className = 'synced-msg';
        openDoneMsg.style.cssText = 'margin:8px 0;padding:8px;background:#DCFCE7;border-radius:8px;';
        openDoneMsg.textContent = '✓ Opening Submitted — ' + new Date(data[getTodayKey()]._openDone).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
        container.appendChild(openDoneMsg);
        // Overwrite panel for opening
        const owpO = document.createElement('div');
        owpO.className = 'overwrite-panel';
        owpO.innerHTML = `<div class="overwrite-title">🔓 Overwrite Access — Enter your role PIN</div>
          <div style="font-size:11px;color:#B91C1C;margin-bottom:8px;">KIC / Area Chef / Admin PIN to unlock and edit</div>
          <input class="overwrite-input" id="owCodeO" type="password" placeholder="Enter PIN...">
          <button class="overwrite-btn" onclick="doOverwrite()">Unlock to Edit Opening</button>`;
        container.appendChild(owpO);
      }
    }
  });

  // Score bar — today's shift score
  const pct = total > 0 ? Math.round((yes/total)*100) : 0;
  document.getElementById('scoreFill').style.width = pct + '%';
  document.getElementById('scoreFill').style.background = pct>=95?'#22C55E':pct>=70?'#F59E0B':'#3B82F6';
  document.getElementById('scorePct').textContent = pct + '%';

  // 6-day scores — split by opening and closing
  let rdoY=0,rdoM=0,rdcY=0,rdcM=0;
  for(let d=1;d<=6;d++){
    SECTIONS.forEach((s,si)=>{s.tasks.forEach(t=>{
      const v=getVal(d,t.id,'yn');
      if(v&&v!=='na'){
        if(si===0){rdoM++;if(v==='yes')rdoY++;}
        else{rdcM++;if(v==='yes')rdcY++;}
      }
    });});
  }
  const rdOpO=rdoM>0?Math.round((rdoY/rdoM)*100):null;
  const rdOpC=rdcM>0?Math.round((rdcY/rdcM)*100):null;
  const rdTM=rdoM+rdcM, rdTY=rdoY+rdcY;
  const rdOp=rdTM>0?Math.round((rdTY/rdTM)*100):0;
  const pass = rdOp>=95;

  const sc = document.createElement('div');
  sc.className = `status-card ${rdTM>0?(pass?'pass':'fail'):''}`;
  sc.innerHTML = `
    <div class="sc-icon">${rdTM===0?'📋':pass?'✅':'❌'}</div>
    <div class="sc-title">${rdTM===0?'Fill your checklist':pass?'Incentive Qualified!':'Keep going!'}</div>
    <div class="sc-score" style="color:${rdTM===0?'#94A3B8':pass?'#15803D':'#B91C1C'}">${rdTM>0?rdOp+'%':'—'}</div>
    <div class="sc-sub">6-day overall score (target: 95%)</div>
    ${rdTM>0?`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px;">
      <div style="background:#EFF6FF;border-radius:8px;padding:8px;text-align:center;">
        <div style="font-size:10px;font-weight:700;color:#64748B;text-transform:uppercase;">🌅 Opening</div>
        <div style="font-size:18px;font-weight:700;color:${rdOpO>=95?'#15803D':rdOpO>=70?'#92400E':'#B91C1C'}">${rdOpO!==null?rdOpO+'%':'—'}</div>
      </div>
      <div style="background:#F0FDF4;border-radius:8px;padding:8px;text-align:center;">
        <div style="font-size:10px;font-weight:700;color:#64748B;text-transform:uppercase;">🌙 Closing</div>
        <div style="font-size:18px;font-weight:700;color:${rdOpC>=95?'#15803D':rdOpC>=70?'#92400E':'#B91C1C'}">${rdOpC!==null?rdOpC+'%':'—'}</div>
      </div>
      <div style="background:${rdOp>=95?'#F0FDF4':'#FFF1F0'};border:2px solid ${rdOp>=95?'#22C55E':'#EF4444'};border-radius:8px;padding:8px;text-align:center;">
        <div style="font-size:10px;font-weight:700;color:#64748B;text-transform:uppercase;">🏆 Total</div>
        <div style="font-size:18px;font-weight:700;color:${rdOp>=95?'#15803D':'#B91C1C'}">${rdOp}%</div>
      </div>
    </div>`:''}
  `;
  container.appendChild(sc);

  // Submit closing button
  if (currentShift === 'closing') {
    const btn = document.createElement('button');
    btn.className = 'submit-btn';
    if (closingDone) {
      btn.disabled = true;
      btn.textContent = `✓ Day ${currentDay} Fully Submitted — Locked`;
      container.appendChild(btn);
      const msg = document.createElement('div');
      msg.className = 'synced-msg';
      msg.textContent = '✓ Submitted and synced to dashboard';
      container.appendChild(msg);
      // KIC overwrite panel
      const owp = document.createElement('div');
      owp.className = 'overwrite-panel';
      owp.innerHTML = `<div class="overwrite-title">🔓 Overwrite Access — Enter your role PIN (KIC / Area Chef / Admin)</div>
        <div style="font-size:11px;color:#B91C1C;margin-bottom:8px;">Enter KIC PIN to unlock and edit Day ${currentDay}</div>
        <input class="overwrite-input" id="owCode" type="password" placeholder="Enter KIC PIN...">
        <button class="overwrite-btn" onclick="doOverwrite()">Unlock to Edit Day ${currentDay}</button>`;
      container.appendChild(owp);
    } else {
      const wasOvr = !!data[dayKey]?._overwritten;
      btn.textContent = wasOvr ? '💾 Resubmit Closing Tasks ✓' : 'Submit Closing Tasks ✓';
      btn.onclick = submitDay;
      container.appendChild(btn);
    }
  }
}

// ── Tap YES/NO/NA ─────────────────────────────────────────────
function setComment(taskId, value) {
  setVal(currentDay, taskId, 'comment', value);
}

function tapYN(tid, val, el) {
  const data = load();
  const todayData = data[getTodayKey()] || {};
  const isClosing = currentShift === 'closing';
  const lockOpening = (todayData._openDone || todayData._done) && !isClosing && !ALLOW_OVERWRITE;
  const lockClosing = todayData._closeDone && isClosing && !ALLOW_OVERWRITE;
  if (lockOpening || lockClosing) {
    showToast('Already submitted — cannot edit 🔒', 'error'); return;
  }
  setVal(currentDay, tid, 'yn', val);
  el.closest('.yn-row').querySelectorAll('.yn').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  // update score bar — only count current shift tasks
  let t=0, y=0;
  const shiftSections = currentShift === 'closing' ? [SECTIONS[1]] : [SECTIONS[0]];
  shiftSections.forEach(s=>s.tasks.forEach(tk=>{t++;if(getVal(1,tk.id,'yn')==='yes')y++;}));
  const p=t>0?Math.round((y/t)*100):0;
  document.getElementById('scoreFill').style.width=p+'%';
  document.getElementById('scorePct').textContent=p+'%';
}


function fmtDateTime(iso) {
  if (!iso) return '—';
  try {
    const d = new Date(iso);
    const date = d.toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'});
    const time = d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:true});
    return date + ' ' + time;
  } catch(e) { return iso; }
}
function fmtTimeOnly(iso) {
  if (!iso) return '—';
  try {
    return new Date(iso).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:true});
  } catch(e) { return '—'; }
}

// ── Submit day ────────────────────────────────────────────────
function submitOpening() {
  const name = getStaffName();
  if (!name) { showToast('Please enter your name first', 'warn'); document.getElementById('fName').focus(); return; }
  if (!getOutlet()) { showToast('Please select an outlet', 'warn'); return; }
  if (!getWeekStart()) { showToast('Please set the week starting date', 'warn'); return; }
  const openingTasks = SECTIONS[0].tasks;
  const unanswered = openingTasks.filter(t => !getVal(currentDay, t.id, 'yn'));
  if (unanswered.length > 0) { showToast('Please answer all Opening Tasks first', 'warn'); return; }
  // Mandatory photo check
  const hasPhotoForTask = (tid) => !!(getVal(currentDay, tid, 'photo') || getVal(currentDay, tid, 'photo_0') || getVal(currentDay, tid, 'photoUrl'));
  const missingPhoto = openingTasks.filter(t => t.photo && !hasPhotoForTask(t.id));
  if (missingPhoto.length > 0) { showToast('📷 Photo required for all opening tasks before submitting', 'warn'); return; }
  const d = load();
  const todayKey = getTodayKey();
  if (!d[todayKey]) d[todayKey] = {};
  d[todayKey]._start      = new Date().toISOString();
  d[todayKey]._openDone   = new Date().toISOString();
  delete d[todayKey]._overwritten;
  d[todayKey]._openerName = name;
  save(d);

  // Push opening to Firebase with taskData
  let oY2=0,oM2=0;
  const openingTaskData = {};
  SECTIONS[0].tasks.forEach(t=>{
    const yn   = getVal(currentDay, t.id, 'yn');
    const pUrl = getVal(currentDay, t.id, 'photoUrl');
    const photo= getVal(currentDay, t.id, 'photo');
    if(yn&&yn!=='na'){oM2++;if(yn==='yes')oY2++;}
    if(yn) openingTaskData['d'+currentDay+'_'+t.id]={
      day:currentDay, section:SECTIONS[0].title, task:t.text, owner:t.ownerLbl,
      yn:yn||'', photoUrl:pUrl || (photo ? getPhotoDbRef(name, currentDay, t.id) : '')
    };
  });
  const startedAt = (load()[`d${currentDay}`] || {})._start || new Date().toISOString();
  const opO2=oM2>0?Math.round((oY2/oM2)*100):0;
  pushToFirebase({
    staffName:   name, role:ROLE, roleLabel:ROLE_LABEL,
    outlet:      getOutlet(), week:getWeekStart(),
    overallPct:  opO2, openingPct:opO2, closingPct:null,
    qualified:   false, day:currentDay, status:'opening_submitted',
    startedAt:   startedAt,
    submittedAt: new Date().toISOString(), lastUpdated:new Date().toISOString(),
    taskData:    openingTaskData,
  });
  showToast('Opening tasks submitted ✓', 'ok');
  currentShift = null;
  buildDayRail(); renderDay();
}

function submitDay() {
  const name = getStaffName();
  if (!name) { showToast('Please enter your name first', 'warn'); document.getElementById('fName').focus(); return; }
  if (!getOutlet()) { showToast('Please select an outlet', 'warn'); return; }
  if (!getWeekStart()) { showToast('Please set the week starting date', 'warn'); return; }
  const closingTasks = SECTIONS[1].tasks;
  const unanswered = closingTasks.filter(t => !getVal(currentDay, t.id, 'yn'));
  if (unanswered.length > 0) { showToast('Please answer all Closing Tasks first', 'warn'); return; }
  const hasPhotoForClosingTask = (tid) => !!(getVal(currentDay, tid, 'photo') || getVal(currentDay, tid, 'photo_0') || getVal(currentDay, tid, 'photoUrl'));
  const missingClosingPhoto = closingTasks.filter(t => t.photo && !hasPhotoForClosingTask(t.id));
  if (missingClosingPhoto.length > 0) { showToast('📷 Photo required for all closing tasks before submitting', 'warn'); return; }
  const d = load();
  const todayKey2 = getTodayKey();
  if (!d[todayKey2]) d[todayKey2] = {};
  d[todayKey2]._closeDone  = new Date().toISOString();
  d[todayKey2]._closerName = name;
  d[todayKey2]._start = new Date().toISOString();
  d[todayKey2]._done       = new Date().toISOString();
  save(d);

  // Calc overall — split by opening and closing
  let tY=0,tM=0,oY=0,oM=0,cY=0,cM=0;
  for(let dd=1;dd<=6;dd++){
    SECTIONS.forEach((s,si)=>s.tasks.forEach(t=>{
      const v=getVal(dd,t.id,'yn');
      if(v&&v!=='na'){
        tM++;if(v==='yes')tY++;
        if(si===0){oM++;if(v==='yes')oY++;}
        else{cM++;if(v==='yes')cY++;}
      }
    }));
  }
  const op=tM>0?Math.round((tY/tM)*100):0;
  const opO=oM>0?Math.round((oY/oM)*100):null;
  const opC=cM>0?Math.round((cY/cM)*100):null;

  // Push to master dashboard
  const _fbRecord = {
    staffName:  name,
    role:       ROLE,
    roleLabel:  ROLE_LABEL,
    outlet:     getOutlet(),
    week:       getWeekStart(),
    verifiedBy: '',
    overallPct:   op,
    openingPct:   opO,
    closingPct:   opC,
    qualified:    op>=95,
    taskData: (function() {
      const tasks = {};
      for (let dd=1; dd<=6; dd++) {
        SECTIONS.forEach(s => s.tasks.forEach(t => {
          const yn   = getVal(dd, t.id, 'yn');
          const pUrl = getVal(dd, t.id, 'photoUrl');
          const photo= getVal(dd, t.id, 'photo');
          if (yn) tasks['d'+dd+'_'+t.id] = {
            day:dd, section:s.title, task:t.text, owner:t.ownerLbl,
            yn:yn||'', photoUrl:pUrl || (photo ? getPhotoDbRef(name, currentDay, t.id) : '')
          };
        }));
      }
      return tasks;
    })(),
    day:        currentDay,
    startedAt:  d[getTodayKey()]?._start || new Date().toISOString(),
    photos: (function() {
      const photos = {};
      SECTIONS.forEach(s => s.tasks.forEach(t => {
        const url = getVal(currentDay, t.id, 'photoUrl');
        if (url) photos[t.id + '_day' + currentDay] = url;
      }));
      return photos;
    })(),
    // Store full task responses for dashboard detail view
    taskData: (function() {
      const tasks = {};
      for (let dd=1; dd<=6; dd++) {
        SECTIONS.forEach(s => s.tasks.forEach(t => {
          const yn    = getVal(dd, t.id, 'yn');
          const photo = getVal(dd, t.id, 'photo'); // base64 local photo
          const pUrl  = getVal(dd, t.id, 'photoUrl'); // firebase url
          if (yn || photo || pUrl) {
            tasks[`d${dd}_${t.id}`] = {
              day: dd,
              section: s.title,
              task: t.text,
              owner: t.ownerLbl,
              yn: yn||'',
              comment: getVal(dd, t.id, 'comment')||'',
              photoUrl: pUrl || (photo ? getPhotoDbRef(name || getStaffName(), dd, t.id) : ''), // prefer firebase url, fall back to db ref
            };
          }
        }));
      }
      return tasks;
    })(),
    submittedAt:new Date().toISOString(),
    lastUpdated:new Date().toISOString(),
  };
  pushToMasterDashboard(_fbRecord);
  pushToFirebase(_fbRecord);

  showToast(`Day ${currentDay} submitted ✓`, 'ok');
  buildDayRail();
  renderDay();
}

// ── Overwrite (KIC/Area Chef) ─────────────────────────────────
function doOverwrite() {
  const code = (document.getElementById('owCode')?.value || document.getElementById('owCodeO')?.value || '').trim();
  if (!checkOverwritePin(code)) { showToast('Wrong PIN — access denied 🔒', 'error'); return; }
  const d = load();
  if (d[getTodayKey()]) {
    delete d[getTodayKey()]._done;
    delete d[getTodayKey()]._closeDone;
    delete d[getTodayKey()]._openDone;
    d[getTodayKey()]._overwritten = true;
    d[getTodayKey()]._overwrittenAt = new Date().toISOString();
  }
  save(d);
  showToast(`Day ${currentDay} unlocked — edit tasks then Resubmit ✓`, 'ok');
  currentShift = null;
  buildDayRail();
  renderDay();
}

function resubmitAfterOverwrite() {
  const shift = currentShift || 'opening';
  if (shift === 'opening') {
    submitOpening();
  } else {
    submitDay();
  }
}

// ── Photo ─────────────────────────────────────────────────────
function openPhotoModal(tid, label) {
  const data = load();
  if (data[getTodayKey()]?._done && !ALLOW_OVERWRITE) {
    showToast('Day submitted — cannot change photos', 'error'); return;
  }
  activePhotoTask = tid;
  document.getElementById('modalLabel').textContent = label;
  document.getElementById('photoModal').classList.add('open');
}
function closePhotoModal() {
  document.getElementById('photoModal').classList.remove('open');
  activePhotoTask = null;
}



function handlePhotoFile(file) {
  if (!file || !activePhotoTask) return;
  const taskId = activePhotoTask;
  activePhotoTask = null;
  closePhotoModal();
  compressAndReturn(file, async function(dataUrl) {
    // Multi-photo: find next empty slot
    let slotIdx = 0;
    for (let pi = 0; pi < 5; pi++) {
      const existing = getVal(currentDay, taskId, 'photo_' + pi) || (pi===0 ? getVal(currentDay, taskId, 'photo') : null);
      if (!existing) { slotIdx = pi; break; }
      slotIdx = pi + 1;
    }
    const slotKey = slotIdx === 0 ? 'photo' : 'photo_' + slotIdx;
    setVal(currentDay, taskId, slotKey, dataUrl);
    renderDay();
    showToast('Photo saved ✓', 'ok');
    const staffName = getStaffName();
    if (staffName && _db) {
      const dbRef = await uploadPhotoToFirebase(dataUrl, taskId, staffName, currentDay);
      if (dbRef) {
        setVal(currentDay, taskId, 'photoUrl', dbRef);
        showToast('Photo synced ✓', 'ok');
        updatePhotoInSubmission(staffName, taskId, dbRef);
      }
    }
  });
}
// Photo input listeners moved to DOMContentLoaded

// ── Persist info fields ───────────────────────────────────────
function removePhoto(taskId, idx) {
  if (!confirm('Remove this photo?')) return;
  const key = idx === 0 ? 'photo' : 'photo_' + idx;
  setVal(currentDay, taskId, key, '');
  // Shift remaining photos down
  for (let pi = idx; pi < 4; pi++) {
    const nextKey = (pi+1) === 1 ? 'photo' : 'photo_' + (pi+1);
    const currentKey = pi === 0 ? 'photo' : 'photo_' + pi;
    const nextVal = getVal(currentDay, taskId, (pi+1) === 1 ? 'photo' : 'photo_' + (pi+1)) || '';
    setVal(currentDay, taskId, currentKey, nextVal);
    setVal(currentDay, taskId, nextKey, '');
  }

window.addEventListener('DOMContentLoaded', () => {
  checkAutoReset(); // Set Dubai date immediately
  // Handle any shift tap that happened before script loaded
  window._selectShiftReady = selectShift;
  if (window._pendingShift) { selectShift(window._pendingShift); window._pendingShift = null; }

  // Photo input listeners
  // Photo inputs - direct label approach works on all devices
  renderDay();
}

['camInput','galInput'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('change', function(e) {
      const file = e.target.files && e.target.files[0];
      if (file) {
        handlePhotoFile(file);
        setTimeout(() => { this.value = ''; }, 500);
      }
    });
    el.addEventListener('cancel', function() { this.value = ''; });
  });
  // Auto-set to current Monday
  // Auto-set week to current Monday
  if (typeof getMonday === 'function') {
    const monday = getMonday(new Date());
    // Format as YYYY-MM-DD for date input
    const y = monday.getFullYear();
    const m = String(monday.getMonth()+1).padStart(2,'0');
    const d = String(monday.getDate()).padStart(2,'0');
    document.getElementById('fWeek').value = y + '-' + m + '-' + d;
  } else {
    const now = new Date();
    const day = now.getDay();
    const diff = now.getDate() - day + (day === 0 ? -6 : 1);
    now.setDate(diff);
    const y = now.getFullYear();
    const m = String(now.getMonth()+1).padStart(2,'0');
    const d = String(now.getDate()).padStart(2,'0');
    document.getElementById('fWeek').value = y + '-' + m + '-' + d;
  }
  ['fName','fOutlet','fWeek'].forEach(id => {
    const el = document.getElementById(id);
    const saved = localStorage.getItem('kic_info_' + ROLE + '_' + id);
    if (saved) el.value = saved;
    el.addEventListener('input', () => {
      localStorage.setItem('kic_info_' + ROLE + '_' + id, el.value);
      const name = document.getElementById('fName').value.trim();
      SK = name ? SK_BASE + '_' + name.replace(/[^a-zA-Z0-9]/g,'_').toLowerCase() : SK_BASE;
      buildDayRail(); renderDay();
    });
  });
  buildDayRail();
  try { renderDay(); } catch(e) { 
    document.getElementById('mainContent').innerHTML = '<div style="padding:20px;color:red;font-size:12px;background:#fff;">Error: ' + e.message + '<br>' + e.stack + '</div>';
  }
});
