<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="app-version" content="20260714160000">
<title>Culex Backup</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#1B3A6B;padding:18px;color:#111;min-height:100vh}
.card{max-width:640px;margin:0 auto;background:#fff;border-radius:14px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,.2)}
h1{font-size:21px;color:#1B3A6B;margin-bottom:5px}
.sub{font-size:12px;color:#7a8699;margin-bottom:20px}
.note{background:#eef3fb;border:1px solid #c9d9ef;border-radius:9px;padding:12px 14px;font-size:12px;color:#1B3A6B;line-height:1.65;margin-bottom:20px}
.note b{display:block;margin-bottom:3px}
.db{border:1px solid #e4e8ef;border-radius:10px;padding:14px;margin-bottom:10px}
.db-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.db-name{font-size:14px;font-weight:700;color:#1B3A6B}
.db-id{font-size:11px;color:#8a99b3;font-family:monospace}
.nodes{font-size:12px;color:#5a6b87;line-height:1.7}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:5px;margin:2px 4px 2px 0;background:#f1f4f9;color:#33415c}
.pill.ok{background:#e8f5ec;color:#1b7f3b}
.pill.no{background:#fdecec;color:#c62828}
button{width:100%;padding:15px;border:0;border-radius:9px;background:#1B3A6B;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:8px}
button:hover{background:#2E5FA3}
button:disabled{background:#b8c2d4;cursor:wait}
.stat{font-size:13px;padding:12px 14px;border-radius:9px;margin-top:16px;font-weight:700;display:none}
.ok{background:#e8f5ec;color:#1b7f3b}
.no{background:#fdecec;color:#c62828}
</style>
</head>
<body>
<div class="card">
  <h1>Culex Backup</h1>
  <div class="sub">Downloads a full copy of every Culex database as one file.</div>

  <div class="note">
    <b>Run this every week. Keep the files.</b>
    If anything is ever lost or overwritten, the most recent backup restores it. Store the files somewhere safe &mdash; Google Drive, or a folder you keep.
  </div>

  <div id="dbs"></div>

  <button id="go" onclick="backupAll()">Download full backup</button>
  <div id="stat" class="stat"></div>
</div>

<script>
var DBS = [
  { name:'BOH — Kitchen Tracker', id:'kitchen-tracker-35293',
    url:'https://kitchen-tracker-35293-default-rtdb.firebaseio.com' },
  { name:'FOH — Culex FOH', id:'culex-foh',
    url:'https://culex-foh-default-rtdb.asia-southeast1.firebasedatabase.app' },
  { name:'Maintenance', id:'culex-maintenance',
    url:'https://culex-maintenance-default-rtdb.asia-southeast1.firebasedatabase.app' }
];

function human(n){
  if(n < 1024) return n + ' B';
  if(n < 1048576) return (n/1024).toFixed(1) + ' KB';
  return (n/1048576).toFixed(1) + ' MB';
}

function renderDBs(){
  document.getElementById('dbs').innerHTML = DBS.map(function(d,i){
    return '<div class="db"><div class="db-top">'
         + '<span class="db-name">' + d.name + '</span>'
         + '<span class="db-id">' + d.id + '</span></div>'
         + '<div class="nodes" id="n' + i + '"><span class="pill">not checked</span></div></div>';
  }).join('');
}

function fetchDB(d){
  return fetch(d.url + '/.json?_cb=' + Date.now(), { cache:'no-store' })
    .then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
}

function backupAll(){
  var btn = document.getElementById('go');
  var st  = document.getElementById('stat');
  btn.disabled = true;
  btn.textContent = 'Backing up...';
  st.style.display = 'none';

  var out = { backedUpAt: new Date().toISOString(), databases: {} };
  var errs = [];

  Promise.all(DBS.map(function(d,i){
    return fetchDB(d).then(function(data){
      out.databases[d.id] = data;
      var keys = data ? Object.keys(data) : [];
      document.getElementById('n'+i).innerHTML = keys.length
        ? keys.map(function(k){
            var n = data[k] && typeof data[k]==='object' ? Object.keys(data[k]).length : 1;
            return '<span class="pill ok">' + k + ' (' + n + ')</span>';
          }).join('')
        : '<span class="pill no">empty</span>';
    }).catch(function(e){
      errs.push(d.name + ': ' + e.message);
      out.databases[d.id] = { ERROR: e.message };
      document.getElementById('n'+i).innerHTML =
        '<span class="pill no">could not read</span>';
    });
  })).then(function(){
    var txt  = JSON.stringify(out, null, 1);
    var blob = new Blob([txt], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'culex-backup-' + new Date().toISOString().slice(0,10) + '.json';
    a.click();

    btn.disabled = false;
    btn.textContent = 'Download full backup';
    st.style.display = 'block';
    if(errs.length){
      st.className = 'stat no';
      st.textContent = 'Backup saved (' + human(txt.length) + ') but some databases failed: ' + errs.join('; ');
    } else {
      st.className = 'stat ok';
      st.textContent = 'Backup saved — ' + human(txt.length) + '. Keep this file somewhere safe.';
    }
  });
}

renderDBs();
</script>
</body>
</html>
