// Update photo ref in existing Firebase submission after async upload completes
async function updatePhotoInSubmission(staffName, taskId, dbRef, slotIdx) {
  if (!_db || !staffName) return;
  try {
    // Save to the correct slot key — same as local storage
    const photoKey = (slotIdx === undefined || slotIdx === 0) ? 'photoUrl' : 'photoUrl_' + slotIdx;
    const snap = await _db.ref('submissions').orderByChild('staffName').equalTo(staffName).limitToLast(5).once('value');
    if (!snap.exists()) return;
    const updates = {};
    snap.forEach(child => {
      const sub = child.val();
      if (sub.role === ROLE && sub.week === getWeekStart() && sub.taskData) {
        Object.keys(sub.taskData).forEach(k => {
          if (k === 'd1_' + taskId || k.endsWith('_' + taskId)) {
            updates['submissions/' + child.key + '/taskData/' + k + '/' + photoKey] = dbRef;
            // Also rebuild photoUrls array from all current URL slots
            const existing = sub.taskData[k] || {};
            const allUrls = [];
            ['photoUrl','photoUrl_1','photoUrl_2','photoUrl_3','photoUrl_4'].forEach((pk, idx) => {
              // For the current slot, use the new dbRef; for others use existing value
              const slotKey2 = idx === 0 ? 'photoUrl' : 'photoUrl_' + idx;
              const url = slotKey2 === photoKey ? dbRef : (existing[pk] || '');
              if (url && url.startsWith('http')) allUrls.push(url);
            });
            if (allUrls.length > 0) {
              updates['submissions/' + child.key + '/taskData/' + k + '/photoUrls'] = allUrls;
            }
          }
        });
      }
    });
    if (Object.keys(updates).length > 0) {
      await _db.ref().update(updates);
    }
  } catch(e) { console.warn('updatePhotoInSubmission failed:', e); }
}

// Init Firebase — wait for SDK to be ready
let _db = null;
let _registryNames = null; // cached registry names for validation

async function loadRegistryNames() {
  if (_registryNames !== null) return _registryNames;
  // Wait up to 5 seconds for Firebase to initialize
  let waited = 0;
  while (!_db && waited < 5000) {
    await new Promise(r => setTimeout(r, 200));
    waited += 200;
  }
  if (!_db) return null;
  try {
    const snap = await _db.ref('registry').once('value');
    const data = snap.val() || {};
    // Include all registry entries regardless of status
    _registryNames = Object.values(data)
      .filter(r => r.name && r.name.trim())
      .map(r => (r.name||'').toLowerCase().trim().replace(/\s+/g,' '));
    return _registryNames;
  } catch(e) { return null; }
}

async function validateStaffName(name) {
  const names = await loadRegistryNames();
  if (!names) return true; // if registry fails to load, allow submit
  const norm = (name||'').toLowerCase().trim().replace(/\s+/g,' ');
  if (!names.includes(norm)) return false;
  return true;
}
function initFirebase() {
  try {
    if (typeof firebase === 'undefined') {
      setTimeout(initFirebase, 100); return;
    }
    if (!firebase.apps.length) {
      firebase.initializeApp(FIREBASE_CONFIG);
    }
    _db = firebase.database();
    console.log('Firebase ready ✓');
  } catch(e) {
    console.error('Firebase init error:', e);
  }
}
initFirebase();

function pushToFirebase(record) {
  if (!_db) { console.warn('Firebase not ready'); setTimeout(()=>pushToFirebase(record), 500); return; }
  try {
    // Use consistent key — no Date.now() so same record gets updated not duplicated
    const shiftSuffix = record.shift ? '_' + record.shift : (record.status === 'opening_submitted' ? '_opening' : '_closing');
    const key = (record.staffName||'unknown').replace(/[^a-zA-Z0-9]/g,'_')
              + '_' + record.role
              + '_' + (record.week||'').replace(/[^a-zA-Z0-9]/g,'_')
              + shiftSuffix;
    // Strip raw base64 photos from taskData before pushing — too large for Firebase
    // Photos are stored separately under photos/ node
    const cleanRecord = { ...record };
    if (cleanRecord.taskData) {
      const cleanTasks = {};
      Object.entries(cleanRecord.taskData).forEach(([k, t]) => {
        cleanTasks[k] = { ...t };
        if (cleanTasks[k].photoUrl && cleanTasks[k].photoUrl.startsWith('data:')) {
          cleanTasks[k].photoUrl = ''; // strip base64, photo is in photos/ node
        }
      });
      cleanRecord.taskData = cleanTasks;
    }
    _db.ref('submissions/' + key).set({
      ...cleanRecord,
      lastUpdated: new Date().toISOString()
    }).then(() => {
      showToast('✓ Synced to dashboard', 'ok');
    }).catch(e => {
      console.warn('Firebase write failed:', e);
      showToast('⚠ Sync failed: ' + e.message, 'error');
    });
  } catch(e) {
    console.warn('Firebase error:', e);
    showToast('⚠ Firebase error: ' + e.message, 'error');
  }
}


// ── Cloudinary Photo Upload ───────────────────────────────────
const CLOUDINARY_CLOUD = 'db94rgiil';
const CLOUDINARY_PRESET = 'culex_uploads';

// Convert data: URL to Blob without fetch() — works on all mobile browsers
function dataURLtoBlob(dataUrl) {
  try {
    const parts = dataUrl.split(',');
    const mime = parts[0].match(/:(.*?);/)[1];
    const bstr = atob(parts[1]);
    let n = bstr.length;
    const u8arr = new Uint8Array(n);
    while (n--) u8arr[n] = bstr.charCodeAt(n);
    return new Blob([u8arr], { type: mime });
  } catch(e) { return null; }
}

async function uploadPhotoToFirebase(dataUrl, taskId, staffName, day) {
  try {
    if (!dataUrl) return null;
    const compressed = await compressToSize(dataUrl, 60);
    // Try Cloudinary first
    try {
      // Use dataURLtoBlob instead of fetch(dataUrl) — fetch of data: URL fails on iOS/Android
      const blob = dataURLtoBlob(compressed);
      if (!blob) throw new Error('blob conversion failed');
      const folder = 'culex/' + ROLE + '/' + (staffName||'unknown').replace(/[^a-zA-Z0-9]/g,'_');
      const fd = new FormData();
      fd.append('file', blob, 'photo.jpg');
      fd.append('upload_preset', CLOUDINARY_PRESET);
      fd.append('folder', folder);
      const resp = await fetch('https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD + '/image/upload', {
        method: 'POST', body: fd
      });
      const data = await resp.json();
      if (data.secure_url) {
        console.log('Photo uploaded to Cloudinary ✓');
        return data.secure_url;
      }
    } catch(cloudErr) {
      console.warn('Cloudinary unavailable, saving locally:', cloudErr);
    }
    // Fallback — save base64 locally, queue for retry
    showToast('Cloud unavailable — photo saved locally 📱', 'warn');

  } catch(e) {

// Retry pending photos when back online
async function retryPendingPhotos() {
  const pendingKey = 'pending_photos_' + ROLE;
  const pending = JSON.parse(localStorage.getItem(pendingKey) || '[]');
  if (!pending.length) return;
  showToast('Retrying ' + pending.length + ' pending photo(s)...', 'ok');
  const remaining = [];
  for (const p of pending) {
    try {
      const res = await fetch(p.dataUrl);
      const blob = await res.blob();
      const folder = 'culex/' + ROLE + '/' + (p.staffName||'unknown').replace(/[^a-zA-Z0-9]/g,'_');
      const fd = new FormData();
      fd.append('file', blob);
      fd.append('upload_preset', CLOUDINARY_PRESET);
      fd.append('folder', folder);
      const resp = await fetch('https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD + '/image/upload', {
        method: 'POST', body: fd
      });
      const data = await resp.json();
      if (data.secure_url) {
        console.log('Pending photo uploaded ✓');
      } else {
        remaining.push(p);
      }
    } catch(e) {
      remaining.push(p);
    }
  }
  localStorage.setItem(pendingKey, JSON.stringify(remaining));
  if (remaining.length === 0) showToast('All pending photos uploaded ✓', 'ok');
  else showToast(remaining.length + ' photo(s) still pending', 'warn');
}

// Compress image to target size in KB
function compressToSize(dataUrl, maxKB) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      // Scale down if too large
      const maxDim = 600;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = Math.round(h * maxDim/w); w = maxDim; }
        else { w = Math.round(w * maxDim/h); h = maxDim; }
      }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      // Try quality 0.7 first
      let result = canvas.toDataURL('image/jpeg', 0.5);
      if (result.length > maxKB * 1024 * 1.37) {
        result = canvas.toDataURL('image/jpeg', 0.25);
      }
      resolve(result);
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

function _setupFileInput(id, withCapture, taskId) {
  // Remove old input and create fresh one — fixes OPPO and other Android browsers
  const old = document.getElementById(id);
  if (!old) return null;
  const input = document.createElement('input');
  input.type = 'file';
  input.id = id;
  input.accept = 'image/*';
  input.style.cssText = 'position:absolute;top:0;left:0;opacity:0;width:0.1px;height:0.1px;overflow:hidden;pointer-events:none;';
  if (withCapture) {
    input.setAttribute('capture', 'environment');
  }
  old.parentNode.replaceChild(input, old);
  input.addEventListener('change', function(e) {
    const file = (e.target.files && e.target.files.length > 0) ? e.target.files[0] : null;
    if (file) {
      // Set activePhotoTask from closure — don't rely on global state
      if (taskId) activePhotoTask = taskId;
      handlePhotoFile(file);
      setTimeout(() => { try { input.value = ''; } catch(e2) {} }, 600);
    }
  });
  return input;
}

function compressAndReturn(file, callback) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const MAX = 400;
      let w = img.width, h = img.height;
      if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
      if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.5));
    };
    img.onerror = function() { callback(ev.target.result); };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ── Day unlock logic — only unlock next day, not future days ─────────────────
function getTodayDayNumber(weekStartStr) {
  if (!weekStartStr) return 1;
  try {
    // Use local calendar date (midnight-based, not 24hr rolling)
    const now = new Date();
    const todayStr = now.getFullYear() + '-' + 
      String(now.getMonth()+1).padStart(2,'0') + '-' + 
      String(now.getDate()).padStart(2,'0');
    const today = new Date(todayStr + 'T00:00:00');
    const start = new Date(weekStartStr + 'T00:00:00');
    const diff = Math.floor((today - start) / (1000 * 60 * 60 * 24));
    return Math.min(Math.max(diff + 1, 1), 6);
  } catch(e) { return 1; }
}

function isDayUnlocked(dayNum, weekStartStr) {
  if (!weekStartStr) return dayNum === 1; // allow day 1 even if week not set yet
  return dayNum <= getTodayDayNumber(weekStartStr);
}

function showToast(msg, type) {
  let t = document.getElementById('_toast');
  if (!t) {
    t = document.createElement('div');
    t.id = '_toast';
    t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);padding:10px 18px;border-radius:30px;font-size:13px;font-weight:600;opacity:0;transition:all 0.3s;z-index:9999;white-space:nowrap;pointer-events:none;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.background = type === 'error' ? '#EF4444' : type === 'warn' ? '#F59E0B' : '#0F172A';
  t.style.color = '#fff';
  t.style.opacity = '1';
  t.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => {
    t.style.opacity = '0';
    t.style.transform = 'translateX(-50%) translateY(20px)';
  }, 2800);
}



// ── Auto-reset: detect new week and start fresh cycle ────────
function getMonday(date) {
  const d = new Date(date);
  const day = d.getDay();
  // Sunday (0) = day 7 of current week, go back 6 days to Monday
  // Monday (1) = day 1, no change
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  d.setDate(diff);
  d.setHours(0,0,0,0);
  return d;
}

function getTodaySubmittedStaff() {
  // Get list of staff who submitted today from Firebase
  if (!_db) return [];
  const today = getDubaiDateStr();
  const staffList = [];
  // Check Firebase submissions for today
  if (window._todayStaff) return window._todayStaff;
  // Load async
  _db.ref('submissions').orderByChild('role').equalTo(ROLE).limitToLast(50).once('value', snap => {
    window._todayStaff = [];
    if (snap.exists()) {
      snap.forEach(child => {
        const sub = child.val();
        if (sub.date === today && sub.staffName && !window._todayStaff.includes(sub.staffName)) {
          window._todayStaff.push(sub.staffName);
        }
      });
    }
    renderDay(); // Re-render with staff list
  });
  return [];
}

function tapYN(tid, val, el) {
  const data = load();
  const todayData = data[getTodayKey()] || {};
  const isClosing = currentShift === 'closing';
  const lockOpening = (todayData._openDone || todayData._done) && !isClosing;
  const lockClosing = todayData._closeDone && isClosing;
  if ((lockOpening || lockClosing) && !ALLOW_OVERWRITE) {
    showToast('Already submitted — cannot edit 🔒', 'error'); return;
  }
  // Lock verify tasks — OIC fills via dashboard only
  const taskDef = SECTIONS.flatMap(s=>s.tasks).find(t=>t.id===tid);
  if (taskDef && taskDef.owner === 'verify' && (lockOpening || lockClosing) && !ALLOW_OVERWRITE) {
    showToast('Verify by OIC only — manager fills this via dashboard 🔒', 'error'); return;
  }
  setVal(currentDay, tid, 'yn', val);
  el.closest('.yn-row').querySelectorAll('.yn').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  // Update score bar AND all 4 score boxes immediately
  let t=0, y=0, oY=0, oM=0, cY=0, cM=0;
  const _td = load()[getTodayKey()] || {};
  SECTIONS.forEach((s, si) => {
    if (s.oicOnly) return;
    s.tasks.forEach(tk => {
      const v = _td[tk.id]?.yn;
      // Only count answered tasks (not unanswered)
      if (v && v !== 'na') {
        if (si === 0) { oM++; if (v === 'yes') oY++; }
        else          { cM++; if (v === 'yes') cY++; }
      }
      if ((currentShift === 'opening' && si === 0) || (currentShift === 'closing' && si === 1)) {
        if (v && v !== 'na') { t++; if (v === 'yes') y++; }
      }
    });
  });
  const p   = t>0  ? Math.round((y/t)*100)   : 0;
  const opO = currentShift==='opening' && oM>0 ? Math.round((oY/oM)*100) : null;
  const opC = currentShift==='closing' && cM>0 ? Math.round((cY/cM)*100) : null;
  // Total = average of all available scores (opening + closing + OIC eval)
  // OIC eval not available live — use current shift score only for live update
  const _liveScores = [opO, opC].filter(v => v !== null);
  const op = _liveScores.length > 0 ? Math.round(_liveScores.reduce((a,b)=>a+b,0)/_liveScores.length) : 0;
  const tM = _liveScores.length;
  // Score bar
  document.getElementById('scoreFill').style.width = p + '%';
  document.getElementById('scoreFill').style.background = p>=95?'#22C55E':p>=70?'#F59E0B':'#3B82F6';
  document.getElementById('scorePct').textContent = p + '%';
  // Update score boxes live
  const _sc = document.querySelector('.status-card');
  if (_sc) {
    _sc.querySelectorAll('[data-scorebox]').forEach(b => {
      const type = b.getAttribute('data-scorebox');
      const pct = type==='opening'?opO : type==='closing'?opC : op;
      const isNull = pct===null;
      const pctEl = b.querySelector('.sb-pct');
      const lblEl = b.querySelector('.sb-lbl');
      if (pctEl) { pctEl.textContent = isNull?'—':pct+'%'; pctEl.style.color = isNull?'#94A3B8':pct>=95?'#0F766E':pct>=70?'#92400E':'#B91C1C'; }
      if (lblEl) { lblEl.textContent = isNull?'Not submitted':pct>=95?'✓ Pass':'✗ Below target'; lblEl.style.color = isNull?'#94A3B8':pct>=95?'#0F766E':'#B91C1C'; }
    });
  }
}


function fmtDateTime(iso) {
  if (!iso) return '—';
  try {
    const d = new Date(iso);
    const date = d.toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'});
    const time = d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:true});
    return date + ' ' + time;
  } catch(e) { return iso; }
}
function fmtTimeOnly(iso) {
  if (!iso) return '—';
  try {
    return new Date(iso).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:true});
  } catch(e) { return '—'; }
}

// ── Wait for Cloudinary uploads to complete ──────────────────
async function waitForPhotoUploads(tasks, maxWaitMs) {
  const start = Date.now();
  const interval = 300;
  while (Date.now() - start < maxWaitMs) {
    const _td = load()[getTodayKey()] || {};
    // Check if all tasks with local photos now have http URLs
    const allDone = tasks.every(t => {
      const hasLocal = ['photo','photo_1','photo_2','photo_3','photo_4'].some(pk => {
        const p = _td[t.id]?.[pk];
        return p && p.startsWith('data:');
      });
      if (!hasLocal) return true; // no photo taken — OK
      // Has local photo — check if at least one http URL exists
      return ['photoUrl','photoUrl_1','photoUrl_2','photoUrl_3','photoUrl_4'].some(pk => {
        const p = _td[t.id]?.[pk];
        return p && p.startsWith('http');
      });
    });
    if (allDone) { showToast('Photos ready ✓', 'ok'); return; }
    await new Promise(r => setTimeout(r, interval));
  }
  // Timeout — proceed anyway with whatever URLs we have
  showToast('Submitting with available photos...', 'warn');
}

      // Collect Cloudinary URLs first (photoUrl, photoUrl_1...)
      ['photoUrl','photoUrl_1','photoUrl_2','photoUrl_3','photoUrl_4'].forEach(pk => {
        const p = _tdOpen[t.id]?.[pk];
        if (p && p.startsWith('http') && !_allPhotosOpen.includes(p)) _allPhotosOpen.push(p);
      });
      // If no Cloudinary URLs yet, check if local photos exist (base64 slots)
      // hasPhoto flag tells dash a photo was taken even if URL not ready
      const _hasLocalPhotos = ['photo','photo_1','photo_2','photo_3','photo_4'].some(pk => {
        const p = _tdOpen[t.id]?.[pk];
        return p && p.startsWith('data:');
      });
      openingTaskData[`d1_${t.id}`] = {
        day: currentDay, section: SECTIONS[0].title,
        task: t.text, owner: t.ownerLbl,
        yn: yn||'', comment: comment2,
        photoUrl: _allPhotosOpen[0] || (pUrl && pUrl.startsWith('http') ? pUrl : '') || '',
        photoUrls: _allPhotosOpen,
        hasPhoto: _allPhotosOpen.length > 0 || _hasLocalPhotos || !!(pUrl||photo),
      };
    }
  });

  // Explicitly remove closingPct from Firebase for opening-only record
  // Firebase ignores null so we must delete it separately
  try {
    const _openKey = name.replace(/[^a-zA-Z0-9]/g,'_') + '_' + ROLE + '_' + (getWeekStart()||'').replace(/[^a-zA-Z0-9]/g,'_') + '_opening';
    if (_db) _db.ref('submissions/' + _openKey + '/closingPct').remove().catch(()=>{});
  } catch(e) {}

  pushToFirebase({
    staffName:   name,
    role:        ROLE,
    roleLabel:   ROLE_LABEL,
    outlet:      getOutlet(),
    week:        getWeekStart(),
    overallPct:  opO2,
    openingPct:  opO2,
    qualified:   false,
    day:         currentDay,
    status:      'opening_submitted',
    startedAt:   d[getTodayKey()]?._start || new Date().toISOString(),
    submittedAt: new Date().toISOString(),
    lastUpdated: new Date().toISOString(),
    taskData:    openingTaskData,
  });
  showToast('Opening tasks submitted ✓', 'ok');
  currentShift = null; // reset so closing staff sees shift picker
  buildDayRail(); renderDay();
}

async function submitDay() {
  const name = getStaffName();
  const closerName = name;
  if (!name) { showToast('Please enter your name first', 'warn'); document.getElementById('fName').focus(); return; }
  if (!getOutlet()) { showToast('Please select an outlet', 'warn'); return; }
  if (!getWeekStart()) { showToast('Please set the week starting date', 'warn'); return; }
  const closingTasks = SECTIONS[1].tasks;
  const unanswered = closingTasks.filter(t => !getVal(currentDay, t.id, 'yn'));
  if (unanswered.length > 0) { showToast('Please answer all Closing Tasks first', 'warn'); return; }
  const d = load();
  const todayKey2 = getTodayKey();
  if (!d[todayKey2]) d[todayKey2] = {};
  d[todayKey2]._closeDone  = new Date().toISOString();
  d[todayKey2]._closerName = closerName;
  d[todayKey2]._done       = new Date().toISOString(); // keep _done for compatibility
  save(d);

  // Calc closing score only — closing staff only fills closing tasks (si=1)
  // Opening score belongs to the opener and already exists in Firebase — do NOT recalculate it
  let cY=0,cM=0;
  const _tdSubmit = load()[getTodayKey()] || {};
  SECTIONS.forEach((s,si)=>s.tasks.forEach(t=>{
    if(s.oicOnly) return;
    if(si!==1) return; // closing tasks only (si=1)
    const v=_tdSubmit[t.id]?.yn;
    if(v&&v!=='na'){
      cM++;if(v==='yes')cY++;
    }
  }));
  const opC=cM>0?Math.round((cY/cM)*100):null;
  // Overall = closing score only (opening score is in the opener's separate record)
  const op=opC!==null?opC:0;

  // Push to master dashboard
  const _fbRecord = {
    staffName:    closerName,
    closingStaff: closerName,
    role:         ROLE,
    roleLabel:    ROLE_LABEL,
    outlet:       getOutlet(),
    week:         getWeekStart(),
    verifiedBy:   getVerified(),
    overallPct:   op,
    openingPct:   null,
    closingPct:   opC,
    qualified:    false,
    day:        currentDay,
    startedAt:  d[getTodayKey()]?._start || new Date().toISOString(),
    photos: (function() {
      const photos = {};
      SECTIONS.forEach(s => s.tasks.forEach(t => {
        const url = getVal(currentDay, t.id, 'photoUrl');
        if (url) photos[t.id + '_day' + currentDay] = url;
      }));
      return photos;
    })(),
    // Store closing task responses only — opening tasks belong to opener's record
    taskData: (function() {
      const tasks = {};
      const _tdData = load()[getTodayKey()] || {};
      SECTIONS.forEach((s, si) => {
        if (si !== 1) return; // closing tasks only (si=1)
        s.tasks.forEach(t => {
          const yn    = _tdData[t.id]?.yn;
          const photo = _tdData[t.id]?.photo || _tdData[t.id]?.photo_0;
          const pUrl  = _tdData[t.id]?.photoUrl;
          // Collect ALL Cloudinary URLs
          const _allPhotos = [];
          ['photoUrl','photoUrl_1','photoUrl_2','photoUrl_3','photoUrl_4'].forEach(pk => {
            const p = _tdData[t.id]?.[pk];
            if (p && p.startsWith('http') && !_allPhotos.includes(p)) _allPhotos.push(p);
          });
          const finalPhotoUrl = _allPhotos[0] || ((pUrl && pUrl.startsWith('http')) ? pUrl : '');
          // hasPhoto true if any local base64 photo exists even if Cloudinary not done
          const _hasLocalClose = ['photo','photo_1','photo_2','photo_3','photo_4'].some(pk => {
            const p = _tdData[t.id]?.[pk];
            return p && p.startsWith('data:');
          });
          if (yn || photo || pUrl || _allPhotos.length > 0 || _hasLocalClose) {
            tasks[`d1_${t.id}`] = {
              day: 1,
              section: s.title,
              task: t.text,
              owner: t.ownerLbl,
              yn: yn||'',
              comment: _tdData[t.id]?.comment||'',
              photoUrl: finalPhotoUrl,
              photoUrls: _allPhotos,
              hasPhoto: _allPhotos.length > 0 || _hasLocalClose,
            };
          }
        });
      });
      return tasks;
    })(),
    submittedAt:new Date().toISOString(),
    lastUpdated:new Date().toISOString(),
  };
  pushToMasterDashboard(_fbRecord);
  pushToFirebase(_fbRecord);

  showToast(`Day ${currentDay} submitted ✓`, 'ok');
  buildDayRail();
  renderDay();
}

// ── Overwrite (KIC/Area Chef) ─────────────────────────────────
function doOverwrite() {
  // Check both possible PIN input IDs (opening and closing panels)
  const code = (document.getElementById('owCode')?.value || document.getElementById('owCodeO')?.value || '').trim();
  if (!checkOverwritePin(code)) { showToast('Wrong PIN — access denied 🔒', 'error'); return; }
  const d = load();
  if (d[getTodayKey()]) {
    // Only delete submission flags — preserve all task answers and photos
    delete d[getTodayKey()]._done;
    delete d[getTodayKey()]._closeDone;
    delete d[getTodayKey()]._openDone;
    d[getTodayKey()]._overwritten = true;
    d[getTodayKey()]._overwrittenAt = new Date().toISOString();
    // Note: task answers (yn, photo, photo_1..4, photoUrl) are preserved intentionally
  }
  save(d);
  showToast(`Day ${currentDay} unlocked — edit tasks then Resubmit ✓`, 'ok');
  currentShift = null;
  buildDayRail();
  renderDay();
}

function resubmitAfterOverwrite() {
  // Recalculate score and push to Firebase
  const shift = currentShift || 'opening';
  if (shift === 'opening') {
    submitOpening();
  } else {
    submitDay();
  }
}

// ── Photo ─────────────────────────────────────────────────────
function openPhotoModal(tid, label) {
  const data = load();
  if (data[getTodayKey()]?._done && !ALLOW_OVERWRITE) {
    showToast('Day submitted — cannot change photos', 'error'); return;
  }
  activePhotoTask = tid;
  document.getElementById('modalLabel').textContent = label;
  document.getElementById('photoModal').classList.add('open');
}
function closePhotoModal() {
  document.getElementById('photoModal').classList.remove('open');
  activePhotoTask = null;
}



function handlePhotoFile(file) {
  if (!file || !activePhotoTask) return;
  const taskId = activePhotoTask;
  activePhotoTask = null;
  closePhotoModal();
  compressAndReturn(file, async function(dataUrl) {
    // Save locally first — find next empty slot (deduplicated)
    const legacyUrl = getVal(currentDay, taskId, 'photo');
    let slotIdx = legacyUrl ? 1 : 0; // if legacy 'photo' exists, start from photo_1
    for (let pi = slotIdx; pi < 5; pi++) {
      const existing = getVal(currentDay, taskId, pi === 0 ? 'photo' : 'photo_' + pi);
      if (!existing) { slotIdx = pi; break; }
      slotIdx = pi + 1;
    }
    const slotKey = slotIdx === 0 ? 'photo' : 'photo_' + slotIdx;
    setVal(currentDay, taskId, slotKey, dataUrl);
    renderDay();
    showToast('Photo saved ✓', 'ok');

    // Save compressed photo to Firebase / Cloudinary
    const staffName = getStaffName();
    if (staffName && _db) {
      const dbRef = await uploadPhotoToFirebase(dataUrl, taskId, staffName, currentDay);
      if (dbRef) {
        // Save Cloudinary URL to the SAME slot key as the local base64 — not always 'photoUrl'
        const cloudSlotKey = slotIdx === 0 ? 'photoUrl' : 'photoUrl_' + slotIdx;
        setVal(currentDay, taskId, cloudSlotKey, dbRef);
        showToast('Photo synced ✓', 'ok');
        // Update Firebase submission with the new URL in the correct slot
        updatePhotoInSubmission(staffName, taskId, dbRef, slotIdx);
      }
    }
  });
}
// Photo input listeners moved to DOMContentLoaded

// ── Persist info fields ───────────────────────────────────────
function removePhoto(taskId, idx) {
  if (!confirm('Remove this photo?')) return;
  const key = idx === 0 ? 'photo' : 'photo_' + idx;
  setVal(currentDay, taskId, key, '');
  // Shift remaining photos down
  for (let pi = idx; pi < 4; pi++) {
    const nextKey = (pi+1) === 1 ? 'photo' : 'photo_' + (pi+1);
    const currentKey = pi === 0 ? 'photo' : 'photo_' + pi;
    const nextVal = getVal(currentDay, taskId, (pi+1) === 1 ? 'photo' : 'photo_' + (pi+1)) || '';
    setVal(currentDay, taskId, currentKey, nextVal);
    setVal(currentDay, taskId, nextKey, '');
  }
  renderDay();
}

window.addEventListener('DOMContentLoaded', () => {
  // Set Dubai date immediately — locked, auto-set, cannot be changed
  const dubaiToday = getDubaiDateStr();
  const weekField = document.getElementById('fWeek');
  if (weekField) weekField.textContent = dubaiToday;
  localStorage.setItem('kic_info_' + ROLE + '_fWeek', dubaiToday);

  // Set initial SK based on saved name — MUST happen before renderDay
  const savedName = localStorage.getItem('kic_info_' + ROLE + '_fName') || '';
  if (savedName) SK = SK_BASE + '_' + savedName.replace(/[^a-zA-Z0-9]/g,'_').toLowerCase();

  // Restore saved field values
  ['fName','fOutlet'].forEach(id => { // fWeek excluded — auto-set from Dubai time
    const el = document.getElementById(id);
    if (!el) return;
    const saved = localStorage.getItem('kic_info_' + ROLE + '_' + id);
    if (saved) el.value = saved;
    el.addEventListener('input', () => {
      localStorage.setItem('kic_info_' + ROLE + '_' + id, el.value);
      const name = document.getElementById('fName').value.trim();
      SK = name ? SK_BASE + '_' + name.replace(/[^a-zA-Z0-9]/g,'_').toLowerCase() : SK_BASE;
      buildDayRail(); renderDay();
    });
  });

  // Photo input listeners
  ['camInput','galInput'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('change', function(e) {
      const file = (e.target.files && e.target.files.length > 0) ? e.target.files[0] : null;
      if (file) { handlePhotoFile(file); setTimeout(() => { try { this.value = ''; } catch(e2) {} }, 600); }
    });
    el.addEventListener('cancel', function() { try { this.value = ''; } catch(e) {} });
  });

  window._selectShiftReady = selectShift;
  if (window._pendingShift) { selectShift(window._pendingShift); window._pendingShift = null; }

  buildDayRail();

  // Visually lock closing button before 3pm Dubai time
  (function() {
    const hour = getDubaiHour();
    const isAfter3pm = hour >= 15 || hour < 2;
    const btnC = document.getElementById('btnCloseShift');
    if (btnC && !isAfter3pm) {
      const minsLeft = (15 - hour - 1) * 60 + (60 - new Date().getMinutes());
      const h = Math.floor(minsLeft/60), m = minsLeft%60;
      btnC.style.cssText = 'flex:1;padding:8px;border-radius:8px;border:2px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.35);font-size:12px;font-weight:700;cursor:not-allowed;';
      btnC.title = `Closing opens at 3:00 PM — ${h}h ${m}m remaining`;
      btnC.textContent = `🌙 Closing (opens 3PM)`;
    }
  })();

  try { renderDay(); } catch(e) {
    document.getElementById('mainContent').innerHTML = '<div style="padding:20px;color:red;font-size:12px;">Error: ' + e.message + '</div>';
  }
});

// ── Midnight auto-reset (Dubai time UTC+4) ───────────────────
function scheduleNextMidnight() {
  const now = new Date();
  const dubaiOffset = 4 * 60 * 60 * 1000; // UTC+4
  const dubaiNow = new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + dubaiOffset);
  // Calculate ms until next Dubai midnight
  const nextMidnight = new Date(dubaiNow);
  nextMidnight.setHours(24, 0, 0, 0); // next midnight
  const msUntilMidnight = nextMidnight - dubaiNow;
  setTimeout(function() {
    // Update date display
    const newDate = getDubaiDateStr();
    const wf = document.getElementById('fWeek');
    if (wf) wf.textContent = newDate;
    localStorage.setItem('kic_info_' + ROLE + '_fWeek', newDate);
    // Reset shift so next day starts fresh
    currentShift = null;
    buildDayRail();
    try { renderDay(); } catch(e) {}
    showToast('📅 New day started — ' + newDate, 'ok');
    // Schedule next midnight reset
    scheduleNextMidnight();
  }, msUntilMidnight);
  console.log('Next midnight reset in', Math.round(msUntilMidnight/60000), 'minutes');
}
scheduleNextMidnight();

// Warn before page refresh if checklist not submitted
window.addEventListener('beforeunload', function(e) {
  const data = load();
  const todayKey = getTodayKey();
  const isDone = !!data[todayKey]?._done;
  const hasAnswers = data[todayKey] && Object.keys(data[todayKey]).some(k => !k.startsWith('_'));
  if (hasAnswers && !isDone) {
    e.preventDefault();
    e.returnValue = 'You have unsaved progress. Your answers are saved locally but please submit before leaving.';
    return e.returnValue;
  }
});
